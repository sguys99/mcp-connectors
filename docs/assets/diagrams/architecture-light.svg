<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="914" viewBox="0 0 1200 914" role="img" aria-labelledby="title desc">
<title id="title">MCP Connectors architecture</title>
<desc id="desc">Claude Code skills /mcp-spec-writer and /mcp-server-builder generate MCP servers under src/mcp-servers (starter_mcp, mock_repo_mcp, nl2sql_mcp) on shared _common modules, and add entries to configs/mcp_servers.yaml. The CLI and the Next.js Frontend read that registry. The Frontend reaches registered servers through /api/mcp/[server], runs Chat through /api/chat with LLM providers, and reaches runtime servers directly or through the opt-in /api/mcp-runtime.</desc>
<style>
