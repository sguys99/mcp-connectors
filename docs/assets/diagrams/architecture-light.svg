<path d="M988 187 L1018 187" class="w" marker-end="url(#ah)"/>
<text x="1030" y="191.5" class="lbl">Calls at runtime</text>
<path d="M988 208 L1018 208" class="w wd" marker-end="url(#ah)"/>
<text x="1030" y="212.5" class="lbl">Opt-in or optional</text>
<path d="M988 229 L1018 229" class="w"/>
<circle cx="1003" cy="229" r="3.5" class="dot"/>
<text x="1030" y="233.5" class="lbl">Joins a path</text>
<rect x="40.5" y="296.5" width="435" height="577" rx="10" class="zone"/><text x="64" y="326" class="caps">MCP SERVERS</text><text x="168.6" y="326" class="lbl mono">src/mcp-servers/</text>
<rect x="64.5" y="344.5" width="387" height="103" rx="8" class="card"/>
<text x="80" y="371" class="tm mono">_common/</text>
<text x="164" y="371" class="d">Shared modules, used by every server</text>
<rect x="80" y="386" width="51" height="24" rx="4" class="chip"/><text x="105.5" y="402.5" class="c mono" text-anchor="middle">auth</text><rect x="137" y="386" width="51" height="24" rx="4" class="chip"/><text x="162.5" y="402.5" class="c mono" text-anchor="middle">cors</text><rect x="194" y="386" width="43" height="24" rx="4" class="chip"/><text x="215.5" y="402.5" class="c mono" text-anchor="middle">env</text><rect x="243" y="386" width="67" height="24" rx="4" class="chip"/><text x="276.5" y="402.5" class="c mono" text-anchor="middle">errors</text>
<rect x="80" y="416" width="75" height="24" rx="4" class="chip"/><text x="117.5" y="432.5" class="c mono" text-anchor="middle">logging</text><rect x="161" y="416" width="75" height="24" rx="4" class="chip"/><text x="198.5" y="432.5" class="c mono" text-anchor="middle">masking</text><rect x="242" y="416" width="59" height="24" rx="4" class="chip"/><text x="271.5" y="432.5" class="c mono" text-anchor="middle">retry</text><rect x="307" y="416" width="59" height="24" rx="4" class="chip"/><text x="336.5" y="432.5" class="c mono" text-anchor="middle">trust</text>
<rect x="64.5" y="464.5" width="387" height="69" rx="8" class="card"/><text x="80" y="491" class="tm mono">starter_mcp</text><rect x="273" y="475" width="59" height="24" rx="4" class="chip"/><text x="302.5" y="491.5" class="c mono" text-anchor="middle">stdio</text><rect x="338" y="475" width="98" height="24" rx="4" class="chip"/><text x="387" y="491.5" class="c mono" text-anchor="middle">HTTP :8001</text><text x="80" y="514" class="d">Canonical starter and regression baseline</text>
<rect x="64.5" y="550.5" width="387" height="69" rx="8" class="card"/><text x="80" y="577" class="tm mono">mock_repo_mcp</text><rect x="338" y="561" width="98" height="24" rx="4" class="chip"/><text x="387" y="577.5" class="c mono" text-anchor="middle">HTTP :8002</text><text x="80" y="600" class="d">Code repository baseline on fixtures</text>
<rect x="64.5" y="636.5" width="387" height="105" rx="8" class="card"/><text x="80" y="663" class="tm mono">nl2sql_mcp</text><rect x="273" y="647" width="59" height="24" rx="4" class="chip"/><text x="302.5" y="663.5" class="c mono" text-anchor="middle">stdio</text><rect x="338" y="647" width="98" height="24" rx="4" class="chip"/><text x="387" y="663.5" class="c mono" text-anchor="middle">HTTP :8004</text><text x="80" y="686" class="d">Natural language to SQL with guardrails</text><text x="80" y="720" class="lbl">DB</text><rect x="106" y="703" width="118" height="24" rx="4" class="chip"/><text x="165" y="719.5" class="c" text-anchor="middle">Mock (default)</text><rect x="230" y="703" width="154" height="24" rx="4" class="chip"/><text x="307" y="719.5" class="c" text-anchor="middle">PostgreSQL + Pagila</text><rect x="390.5" y="703.5" width="59" height="23" rx="4" class="chip-dash"/><text x="420" y="719.5" class="c" text-anchor="middle">Oracle</text>
<rect x="64.5" y="758.5" width="387" height="65" rx="8" class="ph"/>
<text x="80" y="785" class="tm mono muted">&lt;your_server&gt;/</text>
<text x="80" y="807" class="d">Next server, generated from its spec</text>
<rect x="548.5" y="296.5" width="371" height="577" rx="10" class="zone"/><text x="572" y="326" class="caps">CLIENTS</text>
<rect x="572.5" y="344.5" width="323" height="59" rx="8" class="card"/>
<text x="588" y="369" class="tm">Server registry</text>
<text x="588" y="390" class="dmm mono">configs/mcp_servers.yaml</text>
