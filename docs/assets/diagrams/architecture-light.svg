<marker id="aha" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="aha" d="M4.5 2.5 L10.5 6 L4.5 9.5"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="913" rx="14" class="bg"/>
<text x="40" y="58" class="h1">MCP Connectors architecture</text>
<text x="40" y="84" class="sub">Skills generate servers. The CLI and the Frontend find them in one registry and call them.</text>
<rect x="40.5" y="112.5" width="879" height="127" rx="10" class="zone"/><text x="64" y="142" class="caps">BUILD WITH CLAUDE CODE SKILLS</text>
<rect x="64.5" y="160.5" width="231" height="59" rx="8" class="card-accent"/>
<text x="80" y="185" class="tm mono accent">/mcp-spec-writer</text>
<text x="80" y="206" class="d">Interview, 10-section spec</text>
<rect x="340.5" y="160.5" width="271" height="59" rx="8" class="card"/>
<text x="356" y="185" class="tm">Server spec</text>
<text x="356" y="206" class="dmm mono">docs/mcp-spec/&lt;name&gt;_v0.X.md</text>
<rect x="656.5" y="160.5" width="239" height="59" rx="8" class="card-accent"/>
<text x="672" y="185" class="tm mono accent">/mcp-server-builder</text>
<text x="672" y="206" class="d">Server, tests, registry entry</text>
<path d="M302 190 L334 190" class="wa" marker-end="url(#aha)"/>
<path d="M618 190 L650 190" class="wa" marker-end="url(#aha)"/>
