<text x="624" y="471" class="dmm mono">scripts/mcp_cli.py</text>
<rect x="588" y="488" width="98" height="24" rx="4" class="chip"/><text x="637" y="504.5" class="c mono" text-anchor="middle">list-tools</text><rect x="692" y="488" width="51" height="24" rx="4" class="chip"/><text x="717.5" y="504.5" class="c mono" text-anchor="middle">call</text><rect x="749" y="488" width="51" height="24" rx="4" class="chip"/><text x="774.5" y="504.5" class="c mono" text-anchor="middle">test</text>
<text x="588" y="534" class="lbl">test replays scenario YAML files</text>
<rect x="572.5" y="576.5" width="323" height="267" rx="8" class="card"/>
<text x="588" y="604" class="t">Frontend</text>
<text x="670" y="604" class="d">Next.js</text>
<text x="588" y="632" class="caps">PAGES</text>
<rect x="588" y="642" width="81" height="24" rx="4" class="chip"/><text x="628.5" y="658.5" class="c" text-anchor="middle">Dashboard</text><rect x="675" y="642" width="81" height="24" rx="4" class="chip"/><text x="715.5" y="658.5" class="c" text-anchor="middle">Inspector</text><rect x="762" y="642" width="45" height="24" rx="4" class="chip"/><text x="784.5" y="658.5" class="c" text-anchor="middle">Chat</text><rect x="813" y="642" width="74" height="24" rx="4" class="chip"/><text x="850" y="658.5" class="c" text-anchor="middle">Settings</text>
<line x1="588" y1="682.5" x2="880" y2="682.5" class="rule"/>
<text x="588" y="710" class="caps">SERVER ROUTES</text>
<text x="588" y="743" class="dm mono">/api/mcp/[server]</text>
<text x="880" y="743" class="lbl" text-anchor="end">Proxy, adds the API key</text>
<text x="588" y="783" class="dm mono">/api/mcp-runtime</text>
<text x="880" y="783" class="lbl" text-anchor="end">Runtime proxy, opt-in</text>
<text x="588" y="823" class="dm mono">/api/chat</text>
<text x="880" y="823" class="lbl" text-anchor="end">LLM tool-use loop</text>
<text x="972" y="326" class="caps">EXTERNAL</text>
<rect x="968.5" y="778.5" width="191" height="79" rx="8" class="card"/>
<text x="984" y="803" class="tm">LLM providers</text>
<text x="984" y="826" class="d">Anthropic, OpenAI,</text>
<text x="984" y="845" class="d">and OpenRouter</text>
<rect x="968.5" y="344.5" width="191" height="111" rx="8" class="card"/>
<text x="984" y="369" class="tm">Runtime servers</text>
<text x="984" y="392" class="d">Added in the UI,</text>
<text x="984" y="411" class="d">session only</text>
<text x="984" y="434" class="lbl">Browser direct</text>
<text x="984" y="450" class="lbl">or opt-in proxy</text>
