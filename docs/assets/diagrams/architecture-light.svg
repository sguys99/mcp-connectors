.c{font-size:13px;fill:#3a4547}
.ca{font-size:13px;fill:#006b74}
.lbl{font-size:12.5px;fill:#515d60}
.lbla{font-size:12.5px;fill:#006b74;font-weight:500}
.accent{fill:#006b74}
.badge{fill:#007781}
.badge-t{fill:#fcfefe;font-size:14px;font-weight:700}
.w{fill:none;stroke:#828f92;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wa{fill:none;stroke:#007781;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.wd{stroke-dasharray:5 5}
.dot{fill:#828f92}
.ph{fill:none;stroke:#828f92;stroke-dasharray:4 4}
.chip-dash{fill:none;stroke:#828f92;stroke-dasharray:3 3}
