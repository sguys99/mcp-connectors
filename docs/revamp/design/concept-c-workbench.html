let lastFocus = null;
function openDlg(id) { lastFocus = document.activeElement; const d = $(id); d.hidden = false; const f = $("input, button.btn:not(.icon), textarea", d) || $("button", d); setTimeout(() => f && f.focus(), 30); }
function closeDlg(id) { $(id).hidden = true; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
document.addEventListener("click", (e) => {
  const cv = $(".convs.open");
  if (cv && !cv.contains(e.target) && !e.target.closest(".conv-open")) cv.classList.remove("open");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { ["#dlgAdd", "#dlgCfg"].forEach((id) => { if (!$(id).hidden) closeDlg(id); }); $$(".convs.open").forEach((x) => x.classList.remove("open")); }
  if (e.key === "Tab") {
    const d = ["#dlgAdd", "#dlgCfg"].map((id) => $(id)).find((x) => !x.hidden); if (!d) return;
    const f = $$("button:not([disabled]), input, textarea, select, [tabindex='0']", d).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
["#dlgAdd", "#dlgCfg"].forEach((id) => document.addEventListener("click", (e) => { if (e.target === $(id)) closeDlg(id); }));

const addState = { url: "https://docs-mcp.example.internal/mcp", name: "", headers: [["X-MCP-API-Key", "${DOCS_MCP_KEY}"]], busy: false, result: null };
function openAdd() { addState.result = null; addState.busy = false; renderAdd(); openDlg("#dlgAdd"); }
function renderAdd() {
  const d = $("#dlgAdd .dlg");
  d.innerHTML = `<div class="dlg-head"><div><h2 id="dlgAddTitle">${esc(t("addTitle"))}</h2><p>${esc(t("addSub"))}</p></div><button type="button" class="btn ghost icon" data-close aria-label="${esc(t("close"))}">${icon("x")}</button></div>
  <form class="dlg-body" id="addForm" novalidate>
    <div class="field"><label for="addUrl">${esc(t("fUrl"))} <span class="req">*</span></label><input id="addUrl" class="input code" type="url" value="${esc(addState.url)}" placeholder="https://host.example/mcp" aria-describedby="addUrlH" required><span class="hint" id="addUrlH">streamable_http</span></div>
    <div class="field"><label for="addName">${esc(t("fName"))}</label><input id="addName" class="input code" value="${esc(addState.name)}" placeholder="docs-mcp" aria-describedby="addNameH"><span class="hint" id="addNameH">${esc(t("fNameHint"))}</span></div>
    <div class="field"><span class="label" id="hdrLbl">${esc(t("fHeaders"))}</span>
      <div class="hdr-rows" role="group" aria-labelledby="hdrLbl">${addState.headers.map((h, i) => `<div class="hdr-row"><label class="sr-only" for="hk-${i}">${esc(t("hdrKey"))}</label><input id="hk-${i}" class="input code" data-hk="${i}" value="${esc(h[0])}" placeholder="${esc(t("hdrKey"))}"><label class="sr-only" for="hv-${i}">${esc(t("hdrVal"))}</label><input id="hv-${i}" class="input code" data-hv="${i}" value="${esc(h[1])}" placeholder="${esc(t("hdrVal"))}"><button type="button" class="btn ghost icon" data-rmh="${i}" aria-label="${esc(t("removeHeader"))}">${icon("trash", "sm")}</button></div>`).join("")}</div>
      <button type="button" class="btn sm" id="addHdr" style="align-self:flex-start">${icon("plus", "sm")}${esc(t("addHeader"))}</button>
      <span class="hint">${icon("key", "sm")} ${esc(t("fHeadersHint"))}</span></div>
    ${addState.result ? `<div class="conn-result ${addState.result.ok ? "ok" : "err"}" role="status">${icon(addState.result.ok ? "check" : "err")}<span>${esc(addState.result.msg)}</span></div>` : ""}
  </form>
  <div class="dlg-foot"><span class="note">${icon("clock", "sm")}${esc(t("sessionNote"))}</span><span class="spacer"></span><button type="button" class="btn" data-close>${esc(t("cancel"))}</button><button type="submit" form="addForm" class="btn primary" id="connectBtn" ${addState.busy ? "disabled" : ""}>${addState.busy ? `<svg class="i sm spin"><use href="#i-refresh"/></svg>${esc(t("connecting"))}` : `${icon("plug", "sm")}${esc(t("connect"))}`}</button></div>`;
  $$("[data-close]", d).forEach((b) => b.addEventListener("click", () => closeDlg("#dlgAdd")));
  const sync = () => { addState.url = $("#addUrl").value; addState.name = $("#addName").value; $$("[data-hk]", d).forEach((x) => (addState.headers[x.dataset.hk][0] = x.value)); $$("[data-hv]", d).forEach((x) => (addState.headers[x.dataset.hv][1] = x.value)); };
  $("#addHdr").addEventListener("click", () => { sync(); addState.headers.push(["", ""]); renderAdd(); $(`#hk-${addState.headers.length - 1}`).focus(); });
  $$("[data-rmh]", d).forEach((b) => b.addEventListener("click", () => { sync(); addState.headers.splice(Number(b.dataset.rmh), 1); renderAdd(); }));
  $("#addForm").addEventListener("submit", async (e) => {
    e.preventDefault(); sync();
    const u = addState.url.trim();
    const urlEl = $("#addUrl");
    if (!/^https?:\/\/[^\s/]+\/\S*$/.test(u)) { urlEl.setAttribute("aria-invalid", "true"); const h = $("#addUrlH"); h.textContent = t("urlInvalid"); h.style.color = "var(--danger-fg)"; urlEl.focus(); return; }
    addState.busy = true; addState.result = null; renderAdd();
    await sleep(REDUCED.matches ? 200 : 1000);
    addState.busy = false;
    if (/:8004\b|refused|:9\d{3}\b/.test(u)) { addState.result = { ok: false, msg: t("connErr") }; renderAdd(); return; }
    const host = u.replace(/^https?:\/\//, "").split(/[/:]/)[0];
    const name = (addState.name.trim() || host.split(".")[0]).replace(/[^a-z0-9-]/gi, "-").toLowerCase();
    addState.result = { ok: true, msg: t("connOk") }; renderAdd();
    const srv = { name, transport: "streamable_http", url: u, status: "online", runtime: true, desc: { en: "Runtime server, headers: " + addState.headers.filter((h) => h[0]).map((h) => h[0]).join(", "), ko: "런타임 서버, 헤더: " + addState.headers.filter((h) => h[0]).map((h) => h[0]).join(", ") },
      p50: 64, spark: Array(23).fill(null).concat([64]), checked: Date.now(), version: "1.2.0", caps: { tools: true, resources: false, prompts: false, logging: false } };
    const ex = RUNTIME.findIndex((x) => x.name === name); if (ex >= 0) RUNTIME.splice(ex, 1);
    RUNTIME.push(srv);
    await sleep(REDUCED.matches ? 0 : 700);
    closeDlg("#dlgAdd"); renderDashboard(); toast((LANG === "ko" ? "추가했습니다: " : "Added ") + name);
  });
}
const cfgState = { server: "starter-mcp-http", client: "claude" };
const CLIENTS = [["claude", "Claude Desktop", "~/Library/Application Support/Claude/claude_desktop_config.json"], ["cursor", "Cursor", "~/.cursor/mcp.json"], ["vscode", "VS Code", ".vscode/mcp.json"]];
function cfgJSON(name, client) {
  const s = serverByName(name);
  const hdr = { "X-MCP-API-Key": "${MCP_API_KEY}" };
  const stdioArgs = ["--directory", "/path/to/mcp-connectors/src/mcp-servers"].concat(s.cmd ? s.cmd.slice(1) : []);
  let body;
  if (s.transport === "stdio") {
    if (!stdioArgs.includes("--transport")) stdioArgs.push("--transport", "stdio");
    const entry = { command: "uv", args: stdioArgs };
    body = client === "vscode" ? { servers: { [name]: Object.assign({ type: "stdio" }, entry) } } : { mcpServers: { [name]: entry } };
  } else if (client === "claude") body = { mcpServers: { [name]: { command: "npx", args: ["-y", "mcp-remote", s.url, "--header", "X-MCP-API-Key:${MCP_API_KEY}"] } } };
  else if (client === "cursor") body = { mcpServers: { [name]: { url: s.url, headers: hdr } } };
  else body = { servers: { [name]: { type: "http", url: s.url, headers: hdr } } };
  return JSON.stringify(body, null, 2);
}
function openCfg(name) { cfgState.server = name; renderCfg(); openDlg("#dlgCfg"); }
function renderCfg() {
  const d = $("#dlgCfg .dlg");
  const cl = CLIENTS.find((c) => c[0] === cfgState.client);
  const json = cfgJSON(cfgState.server, cfgState.client);
  const s = serverByName(cfgState.server);
  d.innerHTML = `<div class="dlg-head"><div><h2 id="dlgCfgTitle">${esc(t("cfgTitle"))}</h2><p>${esc(t("cfgSub"))}</p></div><button type="button" class="btn ghost icon" data-close aria-label="${esc(t("close"))}">${icon("x")}</button></div>
  <div class="dlg-body">
    <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap"><span class="chip mono">${icon("server", "sm")}${esc(cfgState.server)}</span><span class="chip mono">${esc(s.transport)}</span></div>
    <div class="tabs" role="tablist" style="border-bottom:1px solid var(--line);height:38px" aria-label="Client">${CLIENTS.map((c) => `<button type="button" role="tab" id="cfg-${c[0]}" data-client="${c[0]}" aria-selected="${c[0] === cfgState.client}">${esc(c[1])}</button>`).join("")}</div>
    <div class="cfg-path">${icon("file", "sm")}<span>${esc(t("cfgFile"))}</span><code class="mono">${esc(cl[2])}</code></div>
    <div class="block"><div class="block-head"><b>json</b><span class="spacer"></span><button type="button" class="btn sm" id="cfgCopy">${icon("copy", "sm")}${esc(t("copy"))}</button></div><pre tabindex="0" class="code-block" id="cfgPre" role="tabpanel" aria-labelledby="cfg-${cl[0]}">${hlJSON(json)}</pre></div>
    ${s.transport !== "stdio" ? `<p class="hint" style="font-size:var(--text-xs);color:var(--fg-muted);display:flex;gap:6px">${icon("key", "sm")}<span>${esc(t("cfgEnv"))}</span></p>` : ""}
  </div>
  <div class="dlg-foot"><span class="spacer"></span><button type="button" class="btn" data-close>${esc(t("close"))}</button></div>`;
  $$("[data-close]", d).forEach((b) => b.addEventListener("click", () => closeDlg("#dlgCfg")));
  $$("[data-client]", d).forEach((b) => b.addEventListener("click", () => { cfgState.client = b.dataset.client; renderCfg(); $(`#cfg-${cfgState.client}`).focus(); }));
  $("#cfgCopy").addEventListener("click", async () => {
    const ok = await copyText(json, $("#cfgPre"));
    if (ok) { const b = $("#cfgCopy"); b.innerHTML = `${icon("check", "sm")}${esc(t("copied").split(" ")[0])}`; setTimeout(() => { if (document.contains(b)) b.innerHTML = `${icon("copy", "sm")}${esc(t("copy"))}`; }, 1600); }
  });
}

/* ==========================================================================
   Shell: router, theme, language
   ========================================================================== */
const VIEWS = ["dashboard", "inspector", "chat"];
let current = null;
function route() {
  const h = (location.hash || "").replace("#", "");
  const v = VIEWS.includes(h) ? h : "dashboard";
  current = v;
  VIEWS.forEach((x) => { $("#view-" + x).hidden = x !== v; });
  $$(".nav a").forEach((a) => { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (v === "dashboard") renderDashboard();
  if (v === "inspector") renderInspector();
  if (v === "chat") renderChat();
}
function applyStatic() {
  document.documentElement.lang = LANG;
  $$("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  $$("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $$("#langSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
}
function setTheme(mode) {
  if (mode === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = mode;
  store.set("mcpc-theme", mode === "system" ? null : mode);
  $$("#themeSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.themeSet === mode));
  requestAnimationFrame(() => { chat.wfs.forEach((w) => w.update()); if (insp.wf) insp.wf.update(); });
}
$$("#themeSeg button").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
$$("#langSeg button").forEach((b) => b.addEventListener("click", () => {
  LANG = b.dataset.lang; store.set("mcpc-c-lang", LANG); applyStatic();
  if (current === "chat" && chat.live) { renderThread(); renderTrace(); const w = chat.wfs.get(chat.live.turn.id); if (w) w.live = true; }
  else route();
}));
window.addEventListener("hashchange", route);
setInterval(() => { $$("[data-ago]").forEach((el) => (el.textContent = ago(Number(el.dataset.ago)))); }, 5000);
(function boot() {
  const th = document.documentElement.dataset.theme;
  $$("#themeSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.themeSet === (th || "system")));
  applyStatic();
  route();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { chat.wfs.forEach((w) => w.update()); if (insp.wf) insp.wf.update(); });
})();
