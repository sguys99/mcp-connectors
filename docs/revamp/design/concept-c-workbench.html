/* ==========================================================================
   MCP Connectors design tokens (Phase 3 draft, shared by concepts A/B/C)
   --------------------------------------------------------------------------
   How to use in a concept HTML (Artifact, no <html> tag available):
     1. Put this line right after <title>, before <style>, so it runs first:
          <script>document.documentElement.dataset.concept="a"</script>
        ("a" Console, "b" Studio, "c" Workbench)
     2. Inline this whole file inside <style>.
     3. Theme = data-theme on <html>: "light" | "dark" | removed (= follow OS).
        The concept A page is dark-first: its script sets data-theme="dark"
        on load when the viewer has no saved preference. The final design
        (final.html) drops that and follows the OS until the viewer picks a
        theme. The CSS below stays a single light-first source of truth for
        every page, so no value is written twice. Rationale: tokens.md
        section 2.
     4. Load the concept's Google Fonts <link> (URLs in the concept blocks).

   Layers:
     1. Common structure: spacing, radius scale, shadow, type scale, motion,
        z-index, neutral steps (hue comes from the concept), semantic colors,
        syntax and log colors.
     2. Theme mapping: light in bare :root, dark in the media query and in
        :root[data-theme="dark"] (identical values).
     3. Concept overrides: brand hue and colors, neutral hue, fonts, radius.

   Naming: brand tokens are --brand-*, not --accent-*, because shadcn's
   --accent means "hover surface". Divider is --line, input boundary is
   --line-strong. Mapping to shadcn variables: tokens.md section 6.
   Colors are oklch. Hex comments are sRGB approximations: in the common
   blocks they show the no-concept fallback (neutral hue 250), in concept
   blocks the concept itself. Per-concept hex for every token:
   python3 docs/revamp/design/scripts/check_contrast.py --hex
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Common structure + light theme (bare :root)
   -------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* Concept hooks (overridden per concept; fallback = cool gray) */
  --neutral-hue: 250;
  --brand-hue: 250;

  /* Spacing, 4px grid */
  --space-0: 0;
  --space-px: 1px;
  --space-0-5: 2px;
  --space-1: 4px;
  --space-1-5: 6px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Layout sizes */
  --control-h-sm: 28px;
  --control-h-md: 32px;
  --control-h-lg: 40px;
  --touch-min: 44px;
  --header-h: 48px;
  --sidebar-w: 248px;
  --content-max: 1280px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));

  /* Radius scale, derived from --radius (set per concept) */
  --radius: 6px;
  --radius-xs: calc(var(--radius) * 0.5);
  --radius-sm: calc(var(--radius) * 0.75);
  --radius-md: var(--radius);
  --radius-lg: calc(var(--radius) * 1.5);
  --radius-xl: calc(var(--radius) * 2);
  --radius-full: 9999px;

  /* Typography (families set per concept) */
  --font-kr-fallback: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: system-ui, var(--font-kr-fallback);
  --font-body: system-ui, var(--font-kr-fallback);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --text-2xs: 11px;  --leading-2xs: 16px;
  --text-xs: 12px;   --leading-xs: 18px;
  --text-sm: 13px;   --leading-sm: 20px;
  --text-base: 14px; --leading-base: 22px;
  --text-md: 16px;   --leading-md: 26px;
  --text-lg: 18px;   --leading-lg: 28px;
  --text-xl: 20px;   --leading-xl: 30px;
  --text-2xl: 24px;  --leading-2xl: 32px;
  --text-3xl: 30px;  --leading-3xl: 38px;
  --text-4xl: 36px;  --leading-4xl: 44px;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --tracking-tight: -0.015em;
  --tracking-normal: 0;
  --tracking-caps: 0.06em;

  /* Motion */
  --duration-instant: 80ms;
  --duration-fast: 140ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0.2, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --ease-emphasized: cubic-bezier(0.3, 0, 0, 1.15);

  /* z-index */
  --z-base: 0;
  --z-raised: 10;
  --z-sticky: 100;
  --z-sidebar: 200;
  --z-dropdown: 1000;
  --z-overlay: 1100;
  --z-modal: 1200;
  --z-popover: 1300;
  --z-toast: 1400;
  --z-tooltip: 1500;

  /* Focus */
  --focus-width: 2px;
  --focus-offset: 2px;

  /* Neutral steps: fixed L and C, hue from the concept (slight brand tint) */
  --n-0: oklch(0.995 0.002 var(--neutral-hue));       /* #fcfdff */
  --n-25: oklch(0.985 0.003 var(--neutral-hue));      /* #f9fafc */
  --n-50: oklch(0.972 0.004 var(--neutral-hue));      /* #f4f6f8 */
  --n-100: oklch(0.952 0.006 var(--neutral-hue));     /* #eceff3 */
  --n-150: oklch(0.928 0.007 var(--neutral-hue));     /* #e4e8ec */
  --n-200: oklch(0.900 0.009 var(--neutral-hue));     /* #dadfe4 */
  --n-300: oklch(0.840 0.011 var(--neutral-hue));     /* #c5cbd2 */
  --n-400: oklch(0.720 0.014 var(--neutral-hue));     /* #9ea5ad */
  --n-450: oklch(0.640 0.015 var(--neutral-hue));     /* #868d95 */
  --n-500: oklch(0.560 0.016 var(--neutral-hue));     /* #6e757e */
  --n-600: oklch(0.470 0.016 var(--neutral-hue));     /* #545c64 */
  --n-700: oklch(0.380 0.015 var(--neutral-hue));     /* #3c434a */
  --n-750: oklch(0.320 0.014 var(--neutral-hue));     /* #2e343a */
  --n-800: oklch(0.275 0.013 var(--neutral-hue));     /* #23282e */
  --n-850: oklch(0.240 0.012 var(--neutral-hue));     /* #1b2025 */
  --n-900: oklch(0.210 0.011 var(--neutral-hue));     /* #15191d */
  --n-950: oklch(0.180 0.010 var(--neutral-hue));     /* #0e1216 */
  --n-1000: oklch(0.150 0.009 var(--neutral-hue));    /* #080b0f */

  /* Shadows (light) */
  --shadow-color: oklch(0.25 0.02 var(--neutral-hue)); /* #1a222b */
  --shadow-xs: 0 1px 2px oklch(0.25 0.02 var(--neutral-hue) / 0.06);
  --shadow-sm: 0 1px 3px oklch(0.25 0.02 var(--neutral-hue) / 0.08), 0 1px 2px oklch(0.25 0.02 var(--neutral-hue) / 0.04);
  --shadow-md: 0 4px 12px -2px oklch(0.25 0.02 var(--neutral-hue) / 0.10), 0 2px 4px -2px oklch(0.25 0.02 var(--neutral-hue) / 0.06);
  --shadow-lg: 0 12px 32px -8px oklch(0.25 0.02 var(--neutral-hue) / 0.16), 0 4px 8px -4px oklch(0.25 0.02 var(--neutral-hue) / 0.06);
  --shadow-xl: 0 24px 64px -12px oklch(0.25 0.02 var(--neutral-hue) / 0.24), 0 8px 16px -8px oklch(0.25 0.02 var(--neutral-hue) / 0.08);

  /* Surfaces and text (light) */
  --bg: var(--n-25);
  --bg-subtle: var(--n-50);
  --surface: var(--n-0);
  --surface-raised: var(--n-0);
  --surface-sunken: var(--n-50);
  --surface-hover: var(--n-100);
  --surface-active: var(--n-150);
  --line: var(--n-150);
  --line-strong: var(--n-450);
  --fg: var(--n-1000);
  --fg-muted: var(--n-600);
  --fg-subtle: var(--n-450);
  --fg-on-inverse: var(--n-0);
  --inverse: var(--n-900);
  --overlay: oklch(0.2 0.01 var(--neutral-hue) / 0.45);

  /* Brand fallback (each concept overrides all of these) */
  --brand: oklch(0.50 0.02 var(--brand-hue));         /* #5b646f */
  --brand-hover: oklch(0.45 0.02 var(--brand-hue));   /* #4d5660 */
  --brand-fg: var(--n-0);
  --brand-subtle: var(--n-100);
  --brand-text: oklch(0.45 0.02 var(--brand-hue));    /* #4d5660 */
  --brand-border: var(--n-300);
  --focus-ring: oklch(0.55 0.02 var(--brand-hue));    /* #69737d */
  --selection: oklch(0.90 0.03 var(--brand-hue));     /* #d0e0f2 */

  /* Semantic: success (green 150), warning (orange 62), danger (red 25), info (blue 245) */
  --success-hue: 150;
  --warning-hue: 62;
  --danger-hue: 25;
  --info-hue: 245;

  --success-fg: oklch(0.46 0.12 var(--success-hue));  /* #0f6a31 */
  --success-bg: oklch(0.962 0.030 var(--success-hue)); /* #e5f9e8 */
  --success-border: oklch(0.62 0.13 var(--success-hue)); /* #429c5a */
  --success-solid: oklch(0.54 0.14 var(--success-hue)); /* #17843f */
  --success-solid-fg: var(--n-0);

  --warning-fg: oklch(0.49 0.12 calc(var(--warning-hue) - 8)); /* #934a06 */
  --warning-bg: oklch(0.967 0.040 calc(var(--warning-hue) + 18)); /* #fff2de */
  --warning-border: oklch(0.64 0.14 var(--warning-hue)); /* #c77618 */
  --warning-solid: oklch(0.66 0.15 var(--warning-hue)); /* #d27908 */
  --warning-solid-fg: var(--n-1000);

  --danger-fg: oklch(0.50 0.17 var(--danger-hue));    /* #b02a2d */
  --danger-bg: oklch(0.962 0.025 var(--danger-hue));  /* #ffeeec */
  --danger-border: oklch(0.62 0.18 var(--danger-hue)); /* #de4e4b */
  --danger-solid: oklch(0.55 0.19 var(--danger-hue)); /* #c92f33 */
  --danger-solid-fg: var(--n-0);

  --info-fg: oklch(0.48 0.13 var(--info-hue));        /* #00629d */
  --info-bg: oklch(0.962 0.025 var(--info-hue));      /* #e8f4ff */
  --info-border: oklch(0.62 0.13 var(--info-hue));    /* #348dcf */
  --info-solid: oklch(0.53 0.14 var(--info-hue));     /* #0071b3 */
  --info-solid-fg: var(--n-0);

  /* JSON syntax (light, checked on --surface-sunken and --surface) */
  --syntax-key: oklch(0.48 0.13 255);                 /* #215da5 */
  --syntax-string: oklch(0.49 0.12 150);              /* #1d7339 */
  --syntax-number: oklch(0.52 0.15 45);               /* #ab4500 */
  --syntax-boolean: oklch(0.49 0.17 330);             /* #92318d */
  --syntax-null: oklch(0.52 0.012 var(--neutral-hue)); /* #646a70 */
  --syntax-punct: var(--fg-muted);

  /* Log levels (JSON-RPC log, server log) */
  --log-debug: var(--fg-muted);
  --log-info: var(--info-fg);
  --log-warn: var(--warning-fg);
  --log-error: var(--danger-fg);
  --log-request: var(--brand-text);
  --log-response: var(--success-fg);

  /* Charts (chart-1 is the brand, set per concept) */
  --chart-1: var(--brand);
  --chart-2: oklch(0.58 0.12 165);                    /* #0a9068 */
  --chart-3: oklch(0.62 0.16 45);                     /* #d16022 */
  --chart-4: oklch(0.56 0.18 340);                    /* #b53e95 */
  --chart-5: oklch(0.58 0.13 240);                    /* #0c82bf */
  --chart-6: oklch(0.55 0.15 295);                    /* #795bbf, violet for guardrail spans */

  /* Trace spans (waterfall in Chat and Inspector timing). One hue per span
     kind, about 45 degrees apart: LLM = brand, proxy/DB = blue 240,
     guardrail = violet 295, tool = magenta 340, error = danger red,
     approval wait = warning edge color drawn as a hatch. Declared once here
     and only through theme-switching tokens, so the dark blocks need no
     copy and a page can still override a span kind in its own :root. */
  --span-llm: var(--chart-1);
  --span-tool: var(--chart-4);
  --span-guard: var(--chart-6);
  --span-proxy: var(--chart-5);
  --span-err: var(--danger-solid);
  --span-wait: var(--warning-border);
}

/* --------------------------------------------------------------------------
   2. Dark theme (system preference, unless data-theme="light")
      The block right after this repeats the exact same values for an
      explicit data-theme="dark". Keep the two blocks identical.
   -------------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --shadow-color: oklch(0 0 0);                     /* #000000 */
    --shadow-xs: 0 1px 2px oklch(0 0 0 / 0.30);
    --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.36), 0 1px 2px oklch(0 0 0 / 0.24);
    --shadow-md: 0 4px 12px -2px oklch(0 0 0 / 0.45), 0 2px 4px -2px oklch(0 0 0 / 0.30);
    --shadow-lg: 0 12px 32px -8px oklch(0 0 0 / 0.55), 0 4px 8px -4px oklch(0 0 0 / 0.30);
    --shadow-xl: 0 24px 64px -12px oklch(0 0 0 / 0.65), 0 8px 16px -8px oklch(0 0 0 / 0.35);

    --bg: var(--n-950);
    --bg-subtle: var(--n-1000);
    --surface: var(--n-900);
    --surface-raised: var(--n-850);
    --surface-sunken: var(--n-1000);
    --surface-hover: var(--n-800);
    --surface-active: var(--n-750);
    --line: var(--n-800);
    --line-strong: var(--n-500);
    --fg: var(--n-25);
    --fg-muted: var(--n-400);
    --fg-subtle: var(--n-500);
    --fg-on-inverse: var(--n-1000);
    --inverse: var(--n-100);
    --overlay: oklch(0 0 0 / 0.6);

    --brand: oklch(0.75 0.02 var(--brand-hue));       /* #a5afba */
    --brand-hover: oklch(0.80 0.02 var(--brand-hue)); /* #b4bfca */
    --brand-fg: var(--n-1000);
    --brand-subtle: var(--n-800);
    --brand-text: oklch(0.80 0.02 var(--brand-hue));  /* #b4bfca */
    --brand-border: var(--n-700);
    --focus-ring: oklch(0.75 0.02 var(--brand-hue));  /* #a5afba */
    --selection: oklch(0.38 0.04 var(--brand-hue));   /* #324457 */

    --success-fg: oklch(0.80 0.13 var(--success-hue)); /* #7cd591 */
    --success-bg: oklch(0.27 0.045 var(--success-hue)); /* #152d1a */
    --success-border: oklch(0.55 0.11 var(--success-hue)); /* #3b834e */
    --success-solid: oklch(0.72 0.15 var(--success-hue)); /* #53be70 */
    --success-solid-fg: var(--n-1000);

    --warning-fg: oklch(0.83 0.12 calc(var(--warning-hue) + 8)); /* #f9b96c */
    --warning-bg: oklch(0.28 0.045 var(--warning-hue)); /* #392310 */
    --warning-border: oklch(0.58 0.11 var(--warning-hue)); /* #a86a2c */
    --warning-solid: oklch(0.78 0.14 var(--warning-hue)); /* #f6a14f */
    --warning-solid-fg: var(--n-1000);

    --danger-fg: oklch(0.78 0.13 var(--danger-hue));  /* #ff958d */
    --danger-bg: oklch(0.27 0.055 var(--danger-hue)); /* #3d1b18 */
    --danger-border: oklch(0.58 0.15 var(--danger-hue)); /* #c34f4b */
    --danger-solid: oklch(0.68 0.17 var(--danger-hue)); /* #ef6661 */
    --danger-solid-fg: var(--n-1000);

    --info-fg: oklch(0.80 0.10 var(--info-hue));      /* #86c5fa */
    --info-bg: oklch(0.27 0.045 var(--info-hue));     /* #12283b */
    --info-border: oklch(0.56 0.11 var(--info-hue));  /* #337ab0 */
    --info-solid: oklch(0.72 0.12 var(--info-hue));   /* #5eaceb */
    --info-solid-fg: var(--n-1000);

    --syntax-key: oklch(0.80 0.10 240);               /* #80c7f8 */
    --syntax-string: oklch(0.80 0.13 148);            /* #80d58d */
    --syntax-number: oklch(0.80 0.12 60);             /* #f6ab6b */
    --syntax-boolean: oklch(0.78 0.13 330);           /* #e698df */
    --syntax-null: oklch(0.68 0.012 var(--neutral-hue)); /* #9399a0 */

    --chart-2: oklch(0.72 0.12 165);                  /* #4dbc92 */
    --chart-3: oklch(0.72 0.15 50);                   /* #ee8545 */
    --chart-4: oklch(0.70 0.16 340);                  /* #de73bd */
    --chart-5: oklch(0.72 0.12 240);                  /* #55aee8 */
    --chart-6: oklch(0.72 0.12 295);                  /* #aa95e8 */
  }
}

/* --------------------------------------------------------------------------
   3. Concept overrides
      Each concept has three blocks: base (light brand, fonts, radius),
      dark via media query, dark via data-theme. Brand lines and shape
      lines are grouped so a brand can be moved to another layout later.
   -------------------------------------------------------------------------- */

/* ---- A "Console": cyan/teal, mono-forward developer tool, dark-first ----
   Fonts: https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap */
:root[data-concept="a"] {
  /* shape + type */
  --radius: 4px;
  --font-display: "JetBrains Mono", "IBM Plex Sans KR", ui-monospace, monospace;
  --font-body: "IBM Plex Sans", "IBM Plex Sans KR", var(--font-kr-fallback);
  --font-mono: "JetBrains Mono", "IBM Plex Sans KR", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* brand */
  --neutral-hue: 215;
  --brand-hue: 200;
  --brand: oklch(0.52 0.095 205);                     /* #007781 */
  --brand-hover: oklch(0.47 0.090 205);               /* #006770 */
  --brand-fg: var(--n-0);
  --brand-subtle: oklch(0.955 0.025 205);             /* #def5f8 */
  --brand-text: oklch(0.48 0.090 205);                /* #006b74 */
  --brand-border: oklch(0.70 0.090 205);              /* #50afb9 */
  --focus-ring: oklch(0.56 0.110 205);                /* #00848f */
  --selection: oklch(0.90 0.050 205);                 /* #b8e8ee */
}
@media (prefers-color-scheme: dark) {
  :root[data-concept="a"]:not([data-theme="light"]) {
    --brand: oklch(0.80 0.125 200);                   /* #37d6dd */
    --brand-hover: oklch(0.86 0.110 200);             /* #6ce7ed */
    --brand-fg: var(--n-1000);
    --brand-subtle: oklch(0.30 0.050 210);            /* #03343c */
    --brand-text: oklch(0.82 0.115 200);              /* #55dae1 */
    --brand-border: oklch(0.55 0.090 205);            /* #13808a */
    --focus-ring: oklch(0.78 0.125 200);              /* #2ccfd7 */
    --selection: oklch(0.38 0.070 205);               /* #004c53 */
  }
}
:root[data-concept="a"][data-theme="dark"] {
  --brand: oklch(0.80 0.125 200);                     /* #37d6dd */
  --brand-hover: oklch(0.86 0.110 200);               /* #6ce7ed */
  --brand-fg: var(--n-1000);
  --brand-subtle: oklch(0.30 0.050 210);              /* #03343c */
  --brand-text: oklch(0.82 0.115 200);                /* #55dae1 */
  --brand-border: oklch(0.55 0.090 205);              /* #13808a */
  --focus-ring: oklch(0.78 0.125 200);                /* #2ccfd7 */
  --selection: oklch(0.38 0.070 205);                 /* #004c53 */
}

/* ---- B "Studio": indigo, refined SaaS sans, light-first ----
   Fonts: https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap */
:root[data-concept="b"] {
  /* shape + type */
  --radius: 8px;
  --font-display: "Geist", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Geist", "Noto Sans KR", var(--font-kr-fallback);
  --font-mono: "Geist Mono", "Noto Sans KR", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* brand (info shifts toward azure to stay apart from indigo) */
  --neutral-hue: 275;
  --brand-hue: 277;
  --info-hue: 232;
  --brand: oklch(0.51 0.190 277);                     /* #5051cf */
  --brand-hover: oklch(0.46 0.190 277);               /* #4441be */
  --brand-fg: var(--n-0);
  --brand-subtle: oklch(0.955 0.025 277);             /* #ecefff */
  --brand-text: oklch(0.50 0.180 277);                /* #4e50c6 */
  --brand-border: oklch(0.72 0.110 277);              /* #939ee9 */
  --focus-ring: oklch(0.56 0.180 277);                /* #5e63db */
  --selection: oklch(0.90 0.050 277);                 /* #d5dcff */
}
@media (prefers-color-scheme: dark) {
  :root[data-concept="b"]:not([data-theme="light"]) {
    --brand: oklch(0.55 0.190 277);                   /* #5a5edd */
    --brand-hover: oklch(0.51 0.190 277);             /* #5051cf */
    --brand-fg: oklch(0.995 0 0);                     /* #fdfdfd */
    --brand-subtle: oklch(0.29 0.070 277);            /* #23274d */
    --brand-text: oklch(0.79 0.110 277);              /* #a9b4ff */
    --brand-border: oklch(0.50 0.140 277);            /* #5157b1 */
    --focus-ring: oklch(0.72 0.150 277);              /* #8e9aff */
    --selection: oklch(0.38 0.100 277);               /* #363b76 */
  }
}
:root[data-concept="b"][data-theme="dark"] {
  --brand: oklch(0.55 0.190 277);                     /* #5a5edd */
  --brand-hover: oklch(0.51 0.190 277);               /* #5051cf */
  --brand-fg: oklch(0.995 0 0);                       /* #fdfdfd */
  --brand-subtle: oklch(0.29 0.070 277);              /* #23274d */
  --brand-text: oklch(0.79 0.110 277);                /* #a9b4ff */
  --brand-border: oklch(0.50 0.140 277);              /* #5157b1 */
  --focus-ring: oklch(0.72 0.150 277);                /* #8e9aff */
  --selection: oklch(0.38 0.100 277);                 /* #363b76 */
}

/* ---- C "Workbench": amber, warm readable sans, balanced light/dark ----
   Fonts: https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Atkinson+Hyperlegible+Mono:wght@400..600&family=Gothic+A1:wght@400;500;600;700&display=swap */
:root[data-concept="c"] {
  /* shape + type */
  --radius: 10px;
  --font-display: "Bricolage Grotesque", "Gothic A1", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Gothic A1", var(--font-kr-fallback);
  --font-mono: "Atkinson Hyperlegible Mono", "Gothic A1", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* brand (warning shifts toward orange to stay apart from amber) */
  --neutral-hue: 70;
  --brand-hue: 78;
  --warning-hue: 48;
  --brand: oklch(0.80 0.150 78);                      /* #f2b036 */
  --brand-hover: oklch(0.75 0.150 72);                /* #e79c27 */
  --brand-fg: var(--n-1000);
  --brand-subtle: oklch(0.962 0.040 85);              /* #fff1d5 */
  --brand-text: oklch(0.51 0.110 62);                 /* #925512 */
  --brand-border: oklch(0.74 0.130 75);               /* #da9e3f */
  --focus-ring: oklch(0.60 0.140 62);                 /* #b96a00 */
  --selection: oklch(0.92 0.070 85);                  /* #fae2b0 */
  --chart-1: oklch(0.64 0.150 65);                    /* #c67600, brand is too light for 3:1 on white */
  --chart-3: oklch(0.55 0.150 290);                   /* #725ec2, violet since the common orange sits too close to amber */
}
@media (prefers-color-scheme: dark) {
  :root[data-concept="c"]:not([data-theme="light"]) {
    --brand: oklch(0.80 0.150 78);                    /* #f2b036 */
    --brand-hover: oklch(0.85 0.140 82);              /* #fbc456 */
    --brand-fg: var(--n-1000);
    --brand-subtle: oklch(0.30 0.055 75);             /* #3e2909 */
    --brand-text: oklch(0.83 0.130 80);               /* #f3bd5c */
    --brand-border: oklch(0.56 0.100 72);             /* #986a28 */
    --focus-ring: oklch(0.80 0.150 78);               /* #f2b036 */
    --selection: oklch(0.40 0.080 75);                /* #604008 */
    --chart-1: var(--brand);
    --chart-3: oklch(0.72 0.120 290);                 /* #a497ea */
  }
}
:root[data-concept="c"][data-theme="dark"] {
  --brand: oklch(0.80 0.150 78);                      /* #f2b036 */
  --brand-hover: oklch(0.85 0.140 82);                /* #fbc456 */
  --brand-fg: var(--n-1000);
  --brand-subtle: oklch(0.30 0.055 75);               /* #3e2909 */
  --brand-text: oklch(0.83 0.130 80);                 /* #f3bd5c */
  --brand-border: oklch(0.56 0.100 72);               /* #986a28 */
  --focus-ring: oklch(0.80 0.150 78);                 /* #f2b036 */
  --selection: oklch(0.40 0.080 75);                  /* #604008 */
  --chart-1: var(--brand);
  --chart-3: oklch(0.72 0.120 290);                   /* #a497ea */
}

/* --------------------------------------------------------------------------
   4. Reduced motion
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-instant: 0ms;
    --duration-fast: 0ms;
    --duration-base: 0ms;
    --duration-slow: 0ms;
  }
}

/* --------------------------------------------------------------------------
   5. Minimal base (optional, keeps every concept page consistent)
   -------------------------------------------------------------------------- */
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-base);
  -webkit-font-smoothing: antialiased;
}
:lang(ko) { word-break: keep-all; }
::selection { background: var(--selection); }
:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
/* @tokens:end */

/* ==========================================================================
   Concept C "Workbench" layer. Every color and face comes from the tokens
   above. Layout concept: one shell, top bar, each view is a split
   workbench (conversation or request on the left, trace on the right).
   ========================================================================== */
:root {
  /* Trace language, shared by Chat, Inspector and Dashboard */
  --span-llm: var(--chart-1);
  --span-tool: var(--chart-2);
  --span-guard: var(--chart-3);
  --span-proxy: var(--chart-5);
  --span-err: var(--danger-solid);
  --span-wait: var(--warning-solid);
  /* Active indicator: amber face is too light on white for a text-less state (tokens.md 7.5) */
  --indicator: var(--focus-ring);
  --panel-head-h: 44px;
  --topbar-h: 52px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:lang(ko) body { font-family: "Atkinson Hyperlegible Next", "Gothic A1", var(--font-kr-fallback); }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); letter-spacing: var(--tracking-tight); text-wrap: balance; font-weight: var(--weight-semibold); }
p { margin: 0; }
code, pre, kbd, .mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 20px; height: 20px; }

/* ---------- Shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.topbar {
  position: relative; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: var(--space-4);
  min-height: var(--topbar-h);
  padding-block: var(--space-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: var(--space-2-5, 10px); min-width: 0; text-decoration: none; color: inherit; }
.brand-mark { width: 28px; height: 28px; flex: none; border-radius: var(--radius-sm); background: var(--brand); color: var(--brand-fg); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.brand-name { font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: var(--text-md); letter-spacing: var(--tracking-tight); white-space: nowrap; }
.brand-sub { font-size: var(--text-2xs); line-height: var(--leading-2xs); color: var(--fg-muted); white-space: nowrap; }
.brand-sub .sample-inline { display: none; }

.nav { display: flex; align-items: stretch; gap: var(--space-1); align-self: stretch; margin-left: var(--space-4); }
.nav a {
  position: relative; display: inline-flex; align-items: center; gap: var(--space-2);
  padding: 0 var(--space-3); color: var(--fg-muted); text-decoration: none; font-weight: var(--weight-medium);
  border-radius: var(--radius-sm);
  transition: color var(--duration-instant) var(--ease-standard), background var(--duration-instant) var(--ease-standard);
}
.nav a:hover { color: var(--fg); background: var(--surface-hover); }
.nav a[aria-current="page"] { color: var(--fg); }
.nav a[aria-current="page"]::after {
  content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: calc(-1 * var(--space-2) - 1px);
  height: 2px; border-radius: 2px; background: var(--indicator);
}
.nav .count { font-size: var(--text-2xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
.pill-sample {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px;
  border: 1px dashed var(--line-strong); border-radius: var(--radius-full);
  font-size: var(--text-2xs); color: var(--fg-muted); white-space: nowrap;
}
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-subtle); }
.seg button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 28px; height: 26px; padding: 0 8px; border: 0; border-radius: calc(var(--radius-sm) - 2px);
  background: transparent; color: var(--fg-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-xs), inset 0 0 0 1px var(--line); }
.seg.icon-only button { padding: 0 6px; }

.view { min-height: 0; height: 100%; }
.view[hidden] { display: none !important; }

/* ---------- Generic controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1-5);
  height: var(--control-h-md); padding: 0 var(--space-3);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--fg); font-size: var(--text-sm); font-weight: var(--weight-medium); white-space: nowrap;
  transition: background var(--duration-instant) var(--ease-standard), border-color var(--duration-instant) var(--ease-standard);
}
.btn:hover { background: var(--surface-hover); border-color: var(--line-strong); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand-border); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-muted); }
.btn.ghost:hover { background: var(--surface-hover); color: var(--fg); }
.btn.danger { color: var(--danger-fg); border-color: var(--danger-border); background: var(--surface); }
.btn.danger:hover { background: var(--danger-bg); }
.btn.success { background: var(--success-solid); color: var(--success-solid-fg); border-color: var(--success-solid); }
.btn.sm { height: var(--control-h-sm); padding: 0 var(--space-2); font-size: var(--text-xs); }
.btn.icon { width: var(--control-h-md); padding: 0; }
.btn.sm.icon { width: var(--control-h-sm); }
.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.field > label, .label { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.field .hint { font-size: var(--text-xs); color: var(--fg-muted); }
.req { color: var(--danger-fg); font-weight: var(--weight-bold); }
.type-tag { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); font-weight: var(--weight-regular); }
.input, .select, .textarea {
  width: 100%; min-width: 0; height: var(--control-h-md); padding: 0 var(--space-2-5, 10px);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--fg); font-size: var(--text-sm);
}
.input::placeholder, .textarea::placeholder { color: var(--fg-muted); }
.select { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-muted) 50%), linear-gradient(135deg, var(--fg-muted) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.textarea { height: auto; min-height: 96px; padding: var(--space-2) var(--space-2-5, 10px); resize: vertical; line-height: var(--leading-sm); }
.textarea.code, .input.code { font-family: var(--font-mono); font-size: var(--text-xs); }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 0; border-color: var(--focus-ring); }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger-border); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px;
  border-radius: var(--radius-full); font-size: var(--text-2xs); font-weight: var(--weight-semibold); white-space: nowrap; line-height: 1;
  border: 1px solid var(--line); color: var(--fg-muted); background: var(--surface);
}
.chip.mono { font-family: var(--font-mono); font-weight: var(--weight-regular); }
.chip.ok { color: var(--success-fg); background: var(--success-bg); border-color: color-mix(in oklab, var(--success-border) 45%, transparent); }
.chip.err { color: var(--danger-fg); background: var(--danger-bg); border-color: color-mix(in oklab, var(--danger-border) 45%, transparent); }
.chip.warn { color: var(--warning-fg); background: var(--warning-bg); border-color: color-mix(in oklab, var(--warning-border) 45%, transparent); }
.chip.info { color: var(--info-fg); background: var(--info-bg); border-color: color-mix(in oklab, var(--info-border) 45%, transparent); }
.chip.brand { color: var(--brand-text); background: var(--brand-subtle); border-color: var(--brand-border); }
.dot { width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; background: var(--fg-subtle); }
.dot.ok { background: var(--success-solid); }
.dot.err { background: var(--danger-solid); }
.dot.warn { background: var(--warning-solid); }
.dot.idle { background: transparent; border: 1.5px solid var(--fg-subtle); }
.eyebrow { font-size: var(--text-2xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-muted); }
:lang(ko) .eyebrow { letter-spacing: 0; }
kbd { font-size: var(--text-2xs); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: var(--radius-xs); color: var(--fg-muted); background: var(--surface); }

.panel-head {
  display: flex; align-items: center; gap: var(--space-2); min-height: var(--panel-head-h);
  padding: 0 var(--space-4); border-bottom: 1px solid var(--line); background: var(--surface);
}
.panel-head h2, .panel-head h3 { font-size: var(--text-base); line-height: var(--leading-base); }
.panel-head .spacer { flex: 1; }
.tabs { display: flex; gap: var(--space-1); align-self: stretch; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--space-2-5, 10px);
  border: 0; background: none; color: var(--fg-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); white-space: nowrap;
}
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--indicator); }
.tabs button:disabled { color: var(--fg-subtle); cursor: not-allowed; }
.tabs .badge { font-size: var(--text-2xs); font-variant-numeric: tabular-nums; color: var(--fg-muted); background: var(--surface-hover); border-radius: var(--radius-full); padding: 0 6px; line-height: 16px; }

.scroll { overflow: auto; min-height: 0; overscroll-behavior: contain; }

/* JSON / code blocks */
.code-block {
  margin: 0; padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-sunken); font-family: var(--font-mono); font-size: var(--text-xs); line-height: var(--leading-xs);
  overflow-x: auto; white-space: pre; tab-size: 2; max-width: 100%;
}
.code-block.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
:lang(ko) .code-block.wrap { word-break: keep-all; } /* QA 3-5: break-word split Korean words mid-syllable run */
.j-key { color: var(--syntax-key); }
.j-str { color: var(--syntax-string); }
.j-num { color: var(--syntax-number); }
.j-bool { color: var(--syntax-boolean); }
.j-null { color: var(--syntax-null); font-style: italic; }
.j-p { color: var(--syntax-punct); }
.sql-kw { color: var(--syntax-boolean); font-weight: 600; }

/* ==========================================================================
   Waterfall: the signature drawing. Label column + one time track.
   Bars, ticks and grid lines share one scale (percent of the domain).
   ========================================================================== */
.wf { --label-w: 252px; position: relative; font-size: var(--text-xs); }
.wf-axis { display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); align-items: end; height: 26px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--bg-subtle); }

.wf-tick.first::after { left: 0; }
.wf-tick.last::after { left: auto; right: 0; }
.wf-body { position: relative; }
.wf-grid { position: absolute; inset: 0 var(--space-4) 0 var(--label-w); pointer-events: none; }
.wf-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in oklab, var(--line) 75%, transparent); }
.wf-grid i.zero { background: var(--line); }
.wf-row {
  position: relative; display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); align-items: center;

.wf-row:focus-visible { outline-offset: -2px; }
.wf-label { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 4px var(--space-2) 4px calc(var(--space-3) + var(--depth, 0) * 14px); }
.wf-label .tree { width: 10px; height: 18px; flex: none; position: relative; margin-left: -4px; }
.wf-label .tree::before { content: ""; position: absolute; left: 0; top: -9px; bottom: 50%; border-left: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); width: 8px; border-bottom-left-radius: 4px; }
.wf-kind { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: var(--radius-xs); color: var(--surface); }
.wf-kind svg { width: 13px; height: 13px; stroke-width: 2; }
.k-llm .wf-kind { background: var(--span-llm); }
.k-tool .wf-kind { background: var(--span-tool); }
.k-guard .wf-kind { background: var(--span-guard); }

.wf-name small { font-weight: var(--weight-regular); color: var(--fg-muted); margin-left: 4px; }
.wf-status { margin-left: auto; flex: none; display: inline-flex; color: var(--success-fg); }

.wf-track { position: relative; height: 34px; margin-right: var(--space-4); }
.wf-bar {
  position: absolute; top: 9px; height: 16px; min-width: 3px; border-radius: 4px;
  background: color-mix(in oklab, var(--c) 30%, var(--surface));
  border: 1px solid var(--c);
  transition: left var(--duration-slow) var(--ease-enter), width var(--duration-slow) var(--ease-enter);
}
.wf-bar::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; border-radius: 4px 0 0 4px; background: var(--c); }
.k-llm .wf-bar { --c: var(--span-llm); }
.k-tool .wf-bar { --c: var(--span-tool); }
.k-guard .wf-bar { --c: var(--span-guard); }
.k-proxy .wf-bar { --c: var(--span-proxy); }
.k-turn .wf-bar { --c: var(--fg-subtle); height: 6px; top: 14px; background: color-mix(in oklab, var(--fg-subtle) 35%, var(--surface)); border: 0; }

.wf-row.is-err .wf-bar { --c: var(--span-err); }
.wf-row.is-wait .wf-bar {
  --c: var(--warning-border);
  background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--span-wait) 34%, var(--surface)) 0 5px, var(--surface) 5px 10px);
  border-style: dashed;
}

@keyframes wf-run { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.wf-row[aria-selected="true"] .wf-bar { background: color-mix(in oklab, var(--c) 62%, var(--surface)); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--focus-ring); }
.wf-row.is-wait[aria-selected="true"] .wf-bar { background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--span-wait) 60%, var(--surface)) 0 5px, color-mix(in oklab, var(--span-wait) 18%, var(--surface)) 5px 10px); }
.wf-dur { position: absolute; top: 9px; line-height: 16px; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }

.wf-row.enter { animation: wf-enter var(--duration-slow) var(--ease-enter); }

}

.legend { display: flex; flex-wrap: wrap; gap: var(--space-3); font-size: var(--text-2xs); color: var(--fg-muted); }

.legend .l-llm { --c: var(--span-llm); }
.legend .l-tool { --c: var(--span-tool); }
.legend .l-guard { --c: var(--span-guard); }
.legend .l-proxy { --c: var(--span-proxy); }
.legend .l-err { --c: var(--span-err); }
.legend .l-wait i { --c: var(--warning-border); background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--span-wait) 34%, var(--surface)) 0 3px, var(--surface) 3px 6px); border-style: dashed; }

/* Span detail */
.span-detail { border-top: 1px solid var(--line); background: var(--surface); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }

.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--space-2) var(--space-4); }
.kv div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv dt { font-size: var(--text-2xs); color: var(--fg-muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.io-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-3); }
.io-grid .label { margin-bottom: 4px; }
.io-grid .code-block { max-height: 220px; overflow: auto; }

/* ==========================================================================
   Dashboard
   ========================================================================== */
.dash { height: 100%; overflow: auto; }
.dash-inner {
  max-width: 1440px; margin: 0 auto;
  padding-block: var(--space-6) var(--space-10);
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));

  align-items: start;
}
.dash-head { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }

.stat-strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.stat { padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .v { font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-2xl); font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); }
.stat .v small { font-size: var(--text-sm); color: var(--fg-muted); font-family: var(--font-body); font-weight: var(--weight-regular); margin-left: 4px; }

.section { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.section-head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.section-head h2 { font-size: var(--text-lg); line-height: var(--leading-lg); }
.section-head .meta { color: var(--fg-muted); font-size: var(--text-xs); }
.section-head .spacer { flex: 1; }

.srv-table { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
.srv-row {
  display: grid; align-items: center; gap: var(--space-3);
  grid-template-columns: minmax(140px, 1.5fr) minmax(104px, 128px) 48px 160px 72px 132px; /* QA 3-5: was 808px of fixed tracks, clipped actions at 1280px */
  padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line);
}
.srv-row.head { border-top: 0; padding-block: var(--space-2); background: var(--bg-subtle); font-size: var(--text-2xs); color: var(--fg-muted); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-caps); text-transform: uppercase; }

.srv-name { display: flex; align-items: flex-start; gap: var(--space-2-5, 10px); min-width: 0; }

.srv-name span { font-size: var(--text-xs); color: var(--fg-muted); display: block; }

.srv-status .st.ok { color: var(--success-fg); }
.srv-status .st.err { color: var(--danger-fg); }
.srv-status .st.idle { color: var(--fg-muted); }
.srv-status .tp { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); }
.srv-tools { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
.spark { display: flex; align-items: center; gap: var(--space-2); }
.spark svg { width: 92px; height: 26px; flex: none; overflow: visible; }

.spark .p50.none { color: var(--fg-muted); font-family: var(--font-body); }
.srv-checked { font-size: var(--text-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.srv-actions { display: flex; gap: var(--space-1); justify-content: flex-end; }
.srv-alert {
  grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-3);
  padding: var(--space-3); border-radius: var(--radius-sm); background: var(--danger-bg); border: 1px solid color-mix(in oklab, var(--danger-border) 50%, transparent);
  color: var(--fg);
}
.srv-alert > svg { color: var(--danger-fg); margin-top: 2px; }
.srv-alert b { color: var(--danger-fg); }
.srv-alert .fix { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-1); }
.cmd { display: inline-flex; align-items: center; gap: var(--space-2); max-width: 100%; min-width: 0; padding: 4px 4px 4px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-family: var(--font-mono); font-size: var(--text-xs); }
.cmd code { overflow-x: auto; white-space: nowrap; min-width: 0; }
.cmd .btn.icon { min-width: 24px; min-height: 24px; }
/* QA 3-5: on narrow screens wrap the offline command instead of scrolling it inside the box */
@media (max-width: 899px) { .cmd { align-items: flex-start; } .cmd code { white-space: normal; overflow-wrap: anywhere; overflow-x: visible; padding-block: 2px; } }
.cmd code::before { content: "$ "; color: var(--fg-muted); }

.empty {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-4); align-items: center;
  padding: var(--space-5); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); background: var(--bg-subtle);
}

.rt-list { display: flex; flex-direction: column; gap: 0; }

.runs { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
.run {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px var(--space-3); width: 100%; text-align: left;
  padding: var(--space-3) var(--space-4); border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit;
}
.run:first-child { border-top: 0; }
.run:hover { background: var(--surface-hover); }
.run-title { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
.run-title span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-when { font-size: var(--text-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.run-strip { grid-column: 1 / -1; position: relative; height: 12px; border-radius: 3px; background: var(--bg-subtle); overflow: hidden; }
.run-strip i { position: absolute; top: 2px; height: 8px; border-radius: 2px; background: var(--c); }
.run-strip i.l { --c: var(--span-llm); }
.run-strip i.t { --c: var(--span-tool); }
.run-strip i.g { --c: var(--span-guard); }
.run-strip i.p { --c: var(--span-proxy); }
.run-strip i.e { --c: var(--span-err); }
.run-meta { grid-column: 1 / -1; display: flex; gap: var(--space-3); flex-wrap: wrap; font-size: var(--text-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.run-meta .sep { color: var(--fg-muted); } /* QA 3-5: line-strong text was 3.3:1 */

/* ==========================================================================
   Inspector
   ========================================================================== */
.insp { height: 100%; display: grid; grid-template-columns: 280px minmax(0, 1fr) minmax(0, 1fr); }
.insp > section { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.insp-left { border-right: 1px solid var(--line); background: var(--bg-subtle); }
.insp-mid { background: var(--surface); border-right: 1px solid var(--line); }
.insp-right { background: var(--bg-subtle); }
.srv-pick { padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); border-bottom: 1px solid var(--line); }
.srv-pick .row { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--fg-muted); flex-wrap: wrap; }
.prim-tabs { padding: 0 var(--space-3); border-bottom: 1px solid var(--line); height: 40px; display: flex; }
.search { position: relative; padding: var(--space-3) var(--space-3) var(--space-2); }
.search svg { position: absolute; left: calc(var(--space-3) + 9px); top: calc(var(--space-3) + 8px); color: var(--fg-muted); }
.search .input { padding-left: 30px; }
.tool-list { list-style: none; margin: 0; padding: 0 var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: 2px; }
.tool-item {
  width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-2);
  padding: var(--space-2) var(--space-2-5, 10px); border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: inherit;
}
.tool-item:hover { background: var(--surface-hover); }
.tool-item[aria-selected="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-xs); }
.tool-item b { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--weight-semibold); overflow-wrap: break-word; }
.tool-item span { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--fg-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tool-item mark { background: var(--selection); color: inherit; border-radius: 2px; }
.list-empty { padding: var(--space-4); font-size: var(--text-sm); color: var(--fg-muted); text-align: left; display: flex; flex-direction: column; gap: var(--space-2); }

.req-head { padding: var(--space-4) var(--space-5) var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); border-bottom: 1px solid var(--line); }
.req-title { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.req-title h2 { font-family: var(--font-mono); font-size: var(--text-xl); letter-spacing: 0; overflow-wrap: anywhere; }
.req-desc { color: var(--fg-muted); font-size: var(--text-sm); max-width: 68ch; }
.req-body { padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3) var(--space-4); }
.form-grid .full { grid-column: 1 / -1; }
.run-bar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.run-bar .elapsed { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.run-bar .spacer { flex: 1; }
.resp { display: flex; flex-direction: column; gap: var(--space-2); }
.resp-head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.resp-head h3 { font-size: var(--text-sm); }
.block { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.block-head { display: flex; align-items: center; gap: var(--space-2); padding: 6px var(--space-3); background: var(--bg-subtle); border-bottom: 1px solid var(--line); font-size: var(--text-xs); color: var(--fg-muted); flex-wrap: wrap; }
.block-head b { color: var(--fg); font-family: var(--font-mono); font-weight: var(--weight-semibold); }
.block-head .spacer { flex: 1; }
.block .code-block { border: 0; border-radius: 0; }
.block.is-err { border-color: var(--danger-border); }
.block.is-err .block-head { background: var(--danger-bg); color: var(--danger-fg); border-color: color-mix(in oklab, var(--danger-border) 40%, transparent); }
.err-text { padding: var(--space-3); font-size: var(--text-sm); }
.err-text code { color: var(--danger-fg); font-weight: var(--weight-semibold); }
.img-block { padding: var(--space-3); display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.img-block img { width: 96px; height: 96px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface-sunken); }
.img-block dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-3); font-size: var(--text-xs); }
.img-block dt { color: var(--fg-muted); }
.img-block dd { margin: 0; font-family: var(--font-mono); }
.resp-empty { padding: var(--space-6); text-align: center; color: var(--fg-muted); border: 1px dashed var(--line); border-radius: var(--radius-sm); font-size: var(--text-sm); }

.side-tabs { height: var(--panel-head-h); padding: 0 var(--space-3); border-bottom: 1px solid var(--line); background: var(--surface); display: flex; align-items: stretch; }
.side-body { padding: 0; }
.trace-sum { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); background: var(--surface); }
.trace-sum .m { display: flex; flex-direction: column; min-width: 0; }
.trace-sum .m b { font-family: var(--font-mono); font-size: var(--text-sm); font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); white-space: nowrap; }
.trace-sum .m span { font-size: var(--text-2xs); color: var(--fg-muted); white-space: nowrap; }
.wf-wrap { background: var(--bg-subtle); }

.rpc { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: var(--text-xs); }
.rpc li { border-bottom: 1px solid var(--line); }
.rpc summary { list-style: none; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: var(--space-2); align-items: center; padding: 7px var(--space-4); cursor: pointer; }
.rpc summary::-webkit-details-marker { display: none; }
.rpc summary:hover { background: var(--surface-hover); }
.rpc .dir-req { color: var(--log-request); }
.rpc .dir-res { color: var(--log-response); }
.rpc .dir-err { color: var(--log-error); }
.rpc .dir-note { color: var(--log-debug); }
.rpc .m { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rpc .m small { color: var(--fg-muted); }
.rpc .ms, .rpc .ts { color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rpc .code-block { margin: 0 var(--space-4) var(--space-3); max-height: 260px; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px var(--space-3); align-items: center; padding: var(--space-2-5, 10px) var(--space-4); border-bottom: 1px solid var(--line); }
.hist li[aria-current="true"] { background: var(--surface-active); }
.hist .t { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--weight-semibold); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .a { grid-column: 2; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .r { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: var(--space-1); align-items: center; }
.hist .when { font-size: var(--text-2xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hist .dot { grid-row: 1 / span 2; }
.info-pane { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.caps { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.cap { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--radius-full); font-size: var(--text-xs); background: var(--surface); }
.cap.off { color: var(--fg-muted); border-style: dashed; }
.cap svg { width: 12px; height: 12px; }

/* ==========================================================================
   Chat
   ========================================================================== */
.chat { height: 100%; display: grid; grid-template-columns: 232px minmax(0, 1fr) minmax(0, 1.08fr); }
.chat > section, .chat > aside { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.convs { border-right: 1px solid var(--line); background: var(--bg-subtle); }
.convs-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); }
.convs-head h2 { font-size: var(--text-sm); }
.conv-list { list-style: none; margin: 0; padding: 0 var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: 2px; }
.conv-group { font-size: var(--text-2xs); color: var(--fg-muted); padding: var(--space-3) var(--space-2) var(--space-1); }
.conv {
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent; color: inherit; border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-2-5, 10px); display: flex; flex-direction: column; gap: 2px;
}
.conv:hover { background: var(--surface-hover); }
.conv[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-xs); }
.conv b { font-size: var(--text-sm); font-weight: var(--weight-semibold); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.conv span { font-size: var(--text-2xs); color: var(--fg-muted); display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.convs-foot { margin-top: auto; padding: var(--space-3); border-top: 1px solid var(--line); font-size: var(--text-2xs); color: var(--fg-muted); display: flex; gap: 6px; align-items: flex-start; }

.thread-col { background: var(--surface); border-right: 1px solid var(--line); }
.chat-tools { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line); min-height: var(--panel-head-h); }
.chat-tools .select { width: auto; height: var(--control-h-sm); font-size: var(--text-xs); }
.chat-tools .ctl { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-muted); }
.chat-tools .ctl label { white-space: nowrap; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); height: var(--control-h-sm); background: var(--surface); }
.stepper button { width: 24px; height: 100%; border: 0; background: transparent; color: var(--fg-muted); display: grid; place-items: center; }
.stepper button:hover { color: var(--fg); background: var(--surface-hover); }
.stepper input { width: 30px; border: 0; background: transparent; text-align: center; font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.token-meter { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.token-meter b { color: var(--fg); font-family: var(--font-mono); font-weight: var(--weight-semibold); }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-hover); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--indicator); border-radius: 3px; }
.thread { flex: 1; overflow: auto; padding: var(--space-5) var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.msg { display: flex; flex-direction: column; gap: var(--space-2); max-width: 760px; width: 100%; min-width: 0; }
.msg.enter { animation: wf-enter var(--duration-slow) var(--ease-enter); }
.msg-who { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--fg-muted); }
.msg-who b { color: var(--fg); font-weight: var(--weight-semibold); }
.avatar { width: 22px; height: 22px; border-radius: var(--radius-full); display: grid; place-items: center; font-size: var(--text-2xs); font-weight: var(--weight-bold); flex: none; }
.avatar.u { background: var(--surface-active); color: var(--fg); }
.avatar.a { background: var(--brand); color: var(--brand-fg); }
.avatar.a svg { width: 13px; height: 13px; stroke-width: 2; }
.msg.user { align-self: flex-end; align-items: flex-end; max-width: min(560px, 88%); }
.msg.user .bubble { background: var(--bg-subtle); border: 1px solid var(--line); border-radius: var(--radius-lg) var(--radius-lg) var(--radius-xs) var(--radius-lg); padding: var(--space-2-5, 10px) var(--space-3-5, 14px); font-size: var(--text-md); line-height: var(--leading-md); }
.md { font-size: var(--text-md); line-height: var(--leading-md); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.md p { max-width: 68ch; }
.md code { font-size: 0.86em; padding: 1px 5px; border-radius: var(--radius-xs); background: var(--surface-sunken); border: 1px solid var(--line); }
.md .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); max-width: 100%; }
.md table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); line-height: var(--leading-sm); }
.md th, .md td { padding: 7px var(--space-3); text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.md th { background: var(--bg-subtle); font-size: var(--text-xs); color: var(--fg-muted); font-weight: var(--weight-semibold); }
.md td.n, .md th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.md tr:last-child td { border-bottom: 0; }
.md ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.md .foot { font-size: var(--text-xs); color: var(--fg-muted); }
.msg-actions { display: flex; gap: var(--space-1); align-items: center; }
.msg-actions .turn-tok { font-size: var(--text-2xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; margin-left: var(--space-2); }

.toolcard {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px var(--space-3); align-items: center; width: 100%; text-align: left;
  padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: inherit;
  transition: border-color var(--duration-instant) var(--ease-standard), background var(--duration-instant) var(--ease-standard);
}
.toolcard:hover { border-color: var(--line-strong); background: var(--bg-subtle); }
.toolcard[aria-pressed="true"] { border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); background: var(--bg-subtle); }
.toolcard .wf-kind { background: var(--span-tool); }
.toolcard.is-err .wf-kind { background: var(--span-err); }
.toolcard.is-wait { border-style: dashed; border-color: var(--warning-border); }
.toolcard.is-wait .wf-kind { background: var(--span-wait); }
.toolcard .nm { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--weight-semibold); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolcard .nm small { color: var(--fg-muted); font-weight: var(--weight-regular); }
.toolcard .args { grid-column: 2 / -1; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolcard .rt { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tool-steps { display: flex; flex-direction: column; gap: 6px; }
.approve {
  display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); margin-top: -2px;
  border: 1px dashed var(--warning-border); border-top: 0; border-radius: 0 0 var(--radius-sm) var(--radius-sm); background: var(--warning-bg);
}
.approve p { font-size: var(--text-sm); color: var(--fg); }
.approve p b { color: var(--warning-fg); }
.approve .row { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.approve .row .timer { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--warning-fg); font-variant-numeric: tabular-nums; margin-left: auto; }
.toolcard.is-wait + .approve { margin-top: -8px; }
.toolcard.is-wait:has(+ .approve) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.thinking { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--fg-muted); }
.typing { display: inline-flex; gap: 3px; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-subtle); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.composer-wrap { border-top: 1px solid var(--line); background: var(--surface); padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom, 0px)); }
.composer { border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface); display: flex; flex-direction: column; transition: border-color var(--duration-fast) var(--ease-standard); }
.composer:focus-within { border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }
.composer textarea { border: 0; background: transparent; resize: none; min-height: 48px; max-height: 160px; padding: var(--space-3) var(--space-3) var(--space-1); font-size: var(--text-md); line-height: var(--leading-md); outline: none; }
.composer textarea::placeholder { color: var(--fg-muted); }
.composer-foot { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-2) var(--space-2) var(--space-3); flex-wrap: wrap; }
.composer-foot .hint { font-size: var(--text-2xs); color: var(--fg-muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.composer-foot .spacer { flex: 1; }

.trace-col { background: var(--bg-subtle); }
.trace-head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-4); min-height: var(--panel-head-h); border-bottom: 1px solid var(--line); background: var(--surface); }
.trace-head h2 { font-size: var(--text-base); }
.trace-head .spacer { flex: 1; }
.turn-block { border-bottom: 1px solid var(--line); }
.turn-head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-3) var(--space-4) var(--space-2); }
.turn-head h3 { font-size: var(--text-sm); font-family: var(--font-body); font-weight: var(--weight-semibold); letter-spacing: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.turn-head .n { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); }
.turn-head .spacer { flex: 1; }
.turn-head .tt { font-size: var(--text-2xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.trace-legend { padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line); background: var(--surface); }

.mobile-seg { display: none; }
.trace-head, .trace-sum, .trace-legend, .chat-tools, .composer-wrap, .side-tabs, .srv-pick, .prim-tabs, .search, .convs-head, .convs-foot { flex-shrink: 0; }
.pane-badge { font-size: var(--text-2xs); font-variant-numeric: tabular-nums; color: var(--fg-muted); background: var(--surface-hover); border-radius: var(--radius-full); padding: 0 6px; line-height: 16px; }
.sql { white-space: pre-wrap; }
@media (min-width: 1280px) { .conv-close { display: none !important; } }
.conv-toggle { display: none; }

/* ---------- Dialogs ---------- */
.dlg-backdrop { position: fixed; inset: 0; z-index: var(--z-overlay); background: var(--overlay); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.dlg-backdrop[hidden] { display: none; }
.dlg { width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); display: flex; flex-direction: column; animation: dlg-in var(--duration-base) var(--ease-enter); }
@keyframes dlg-in { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
.dlg-head { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-4) var(--space-5) var(--space-3); }
.dlg-head h2 { font-size: var(--text-lg); line-height: var(--leading-lg); }
.dlg-head p { color: var(--fg-muted); font-size: var(--text-sm); margin-top: 2px; }
.dlg-head .btn { margin-left: auto; }
.dlg-body { padding: var(--space-2) var(--space-5) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.dlg-foot { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-5); border-top: 1px solid var(--line); background: var(--bg-subtle); border-radius: 0 0 var(--radius-lg) var(--radius-lg); flex-wrap: wrap; }
.dlg-foot .spacer { flex: 1; }
.dlg-foot .note { font-size: var(--text-xs); color: var(--fg-muted); display: flex; gap: 6px; align-items: center; }
.hdr-rows { display: flex; flex-direction: column; gap: var(--space-2); }
.hdr-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: var(--space-2); align-items: center; }
.conn-result { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-3); border-radius: var(--radius-sm); font-size: var(--text-sm); }
.conn-result.ok { background: var(--success-bg); color: var(--success-fg); }
.conn-result.err { background: var(--danger-bg); color: var(--danger-fg); }
.cfg-path { font-size: var(--text-xs); color: var(--fg-muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cfg-path code { color: var(--fg); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: var(--z-toast); background: var(--inverse); color: var(--fg-on-inverse); padding: 8px 14px; border-radius: var(--radius-sm); font-size: var(--text-sm); box-shadow: var(--shadow-lg); display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Responsive ---------- */
@media (max-width: 1279px) {
  .chat { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .convs { position: fixed; z-index: var(--z-sidebar); top: 0; bottom: 0; left: 0; width: min(300px, 86vw); box-shadow: var(--shadow-xl); transform: translateX(-102%); visibility: hidden; transition: transform var(--duration-slow) var(--ease-standard), visibility 0s linear var(--duration-slow); padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); }
  .convs.open { transform: none; visibility: visible; transition: transform var(--duration-slow) var(--ease-standard), visibility 0s; box-shadow: var(--shadow-xl), 0 0 0 100vmax var(--overlay); }
  .conv-toggle { display: inline-flex; }
  .insp { grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 0.9fr); }
  .insp-left { grid-row: 1 / span 2; }
  .insp-mid { border-right: 0; border-bottom: 1px solid var(--line); }
  .dash-inner { grid-template-columns: minmax(0, 1fr); }
  .srv-row { grid-template-columns: minmax(160px, 1.4fr) 120px 48px 160px 76px 132px; }
}
@media (max-width: 1023px) {
  .srv-row.head { display: none; }
  .srv-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name actions" "status status" "tools tools" "spark spark"; gap: var(--space-2); }
  .srv-row > .srv-name { grid-area: name; }
  .srv-row > .srv-actions { grid-area: actions; }
  .srv-row > .srv-status { grid-area: status; flex-direction: row; gap: var(--space-2); flex-wrap: wrap; padding-left: 18px; }
  .srv-row > .srv-tools { display: none; }
  .srv-row > .spark { grid-area: spark; padding-left: 18px; }
  .srv-row > .srv-checked { display: none; }
  .srv-row .m-meta { display: inline-flex !important; }
}
.iter-ico { display: none !important; color: var(--fg-muted); }
.m-meta { display: none !important; font-size: var(--text-xs); color: var(--fg-muted); gap: var(--space-2); font-variant-numeric: tabular-nums; }
@media (max-width: 899px) {
  .topbar { flex-wrap: wrap; row-gap: 0; padding-bottom: 0; }
  .nav { order: 3; width: 100%; margin: 0; height: 40px; justify-content: stretch; }
  .nav a { flex: 1; justify-content: center; }
  .nav a[aria-current="page"]::after { bottom: 0; }
  .topbar-right .pill-sample { display: none; }
  .brand-sub .sample-inline { display: block; }
  .trace-col { overflow: auto; }
  .trace-col #traceScroll { flex: none !important; overflow: visible; }
  .trace-col .span-detail { max-height: none !important; overflow: visible; }
  .trace-head .legend { width: 100%; gap: var(--space-1) var(--space-3); }
  .chat { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .mobile-seg { display: flex; padding: var(--space-2) max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); gap: var(--space-2); align-items: center; }
  .mobile-seg .seg { flex: 1; }
  .mobile-seg .seg button { flex: 1; height: 32px; }
  .chat[data-pane="chat"] .trace-col { display: none; }
  .chat[data-pane="trace"] .thread-col { display: none; }
  .thread-col { border-right: 0; }
  .chat-head-conv { display: none !important; }
  .insp { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .insp-left { grid-row: auto; border-right: 0; }
  .insp[data-pane="tools"] .insp-mid, .insp[data-pane="tools"] .insp-right { display: none; }
  .insp[data-pane="request"] .insp-left, .insp[data-pane="request"] .insp-right { display: none; }
  .insp[data-pane="trace"] .insp-left, .insp[data-pane="trace"] .insp-mid { display: none; }
  .insp-mid { border-bottom: 0; }
  .wf { --label-w: 0px; }
  .wf-axis { grid-template-columns: minmax(0, 1fr); }
  .wf-axis .wf-axis-label { display: none; }
  .wf-ticks { margin-left: var(--space-3); margin-right: var(--space-3); }
  .wf-grid { left: var(--space-3); right: var(--space-3); }
  .wf-row { grid-template-columns: minmax(0, 1fr); min-height: 0; padding-top: 4px; }
  .wf-label { padding-right: var(--space-3); }
  .wf-track { height: 24px; margin: 0 var(--space-3); }
  .wf-bar, .wf-dur { top: 3px; }
  .k-turn .wf-bar { top: 8px; }
}

    if (chat.conv === L_.conv.id) {
      const w = chat.wfs.get(L_.turn.id); if (w) w.update();
      $$("[data-wait-timer]").forEach((el) => { const s = L_.turn.spans.find((x) => x.id === el.dataset.waitTimer); if (s) el.textContent = fmtDur(s.dur); });
      if (chat.sel) { const ss = L_.turn.spans.find((x) => x.id === chat.sel); if (ss && (ss.status === "run" || ss.status === "wait")) renderSpanDetail(); }

          ws.status = ok ? "ok" : "err";
          ws.detail.decision = ok ? "approved" : "denied";
          ws.name = ok ? (LANG === "ko" ? "승인함" : "approved") : (LANG === "ko" ? "거부함" : "denied");
          at = ws.start + ws.dur;
          if (!ok) {
            card.denied = true;
            if (chat.live.stopped) break;
            const fin = { llm: { in: lastIn + 180, out: 84, ms: 900, stop: "end_turn", out_: "The tool call was denied by the user." } };
            llmCount++;

            await runSpan(sp, fin.llm.ms);

          const fin = ts.status; ts.status = "run"; ts.dur = 0;

          const ts = toolSpanFor(c.server, step.tool.name, args, at + 10, res);
          const fin = ts.status; ts.status = "run"; ts.dur = 0;

    if (it.type === "chat") {
      const tu = it.turn; const llm = tu.spans.filter((s) => s.kind === "llm").length; const tools = tu.spans.filter((s) => s.kind === "tool").length; const err = tu.spans.some((s) => s.status === "err" && s.depth === 1 && s.kind === "tool");
      return `<button type="button" class="run" data-run-chat="${it.conv.id}" data-run-span="${tu.spans[0].id}"><span class="run-title">${icon("chat", "sm")}<span>${esc(L(tu.q))}</span></span><span class="run-when">${esc(ago(it.when))}</span><span class="run-strip" aria-hidden="true">${runStripHTML(tu.spans)}</span><span class="run-meta"><span class="dot ${err ? "err" : "ok"}" style="align-self:center" aria-hidden="true"></span><span>${fmtDur(tu.spans[0].dur)}</span><span class="sep">/</span><span>${llm} ${esc(t("runLlm"))}, ${tools} ${esc(t("runTools"))}</span><span class="sep">/</span><span>${fmtNum(tu.inTok + tu.outTok)} ${esc(t("runTok"))}</span></span></button>`;
    }
    const h = it.call; const err = h.res.isError || h.cancelled;
    const code = h.res.isError ? (h.res.blocks[0].text.match(/\[([A-Z_]+)\]/) || [])[1] : null;
    return `<button type="button" class="run" data-run-insp="${h.id}"><span class="run-title">${icon("inspect", "sm")}<span class="mono">${esc(h.kind === "resource" ? "resources/read" : h.tool)}</span></span><span class="run-when">${esc(ago(h.when))}</span><span class="run-strip" aria-hidden="true">${runStripHTML(h.spans)}</span><span class="run-meta"><span class="dot ${err ? "err" : "ok"}" style="align-self:center" aria-hidden="true"></span><span>${fmtDur(h.spans[0].dur)}</span><span class="sep">/</span><span class="mono">${esc(h.server)}</span>${code ? `<span class="sep">/</span><span class="mono" style="color:var(--danger-fg)">[${esc(code)}]</span>` : ""}</span></button>`;
  }).join("");
  $$("[data-run-chat]", el).forEach((b) => b.addEventListener("click", () => { chat.conv = b.dataset.runChat; chat.sel = null; chat.model = curConv().model; location.hash = "chat"; }));
  $$("[data-run-insp]", el).forEach((b) => b.addEventListener("click", () => {
    const h = insp.history.find((x) => x.id === b.dataset.runInsp);
    insp.server = h.server; insp.tab = h.kind === "resource" ? "resources" : "tools"; insp.item = h.kind === "resource" ? h.args.uri : h.tool;
    insp.args[h.server + "/" + h.tool] = JSON.parse(JSON.stringify(h.args)); insp.result = h; insp.spans = h.spans; insp.side = "trace"; insp.pane = "trace";
    insp.sel = (h.spans.find((x) => x.status === "err" && x.depth === 2) || h.spans.find((x) => x.kind === "tool")).id;
    location.hash = "inspector";
  }));
  const rc = $("#runsCount"); if (rc) rc.textContent = CONVS.reduce((a, c) => a + c.built.length, 0) + insp.history.length;
}
