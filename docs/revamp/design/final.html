  document.documentElement.dataset.concept = "a";
  /* Final design: follow the OS until the viewer picks a theme (no forced dark) */
  try {
    var savedTheme = localStorage.getItem("mcpc-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
  } catch (e) { /* storage blocked: stay on the system theme */ }
  try { var savedLang = localStorage.getItem("mcpc-lang"); document.documentElement.lang = savedLang === "ko" ? "ko" : "en"; }
  catch (e) { document.documentElement.lang = "en"; }
</script>

/* @tokens:start (synced from docs/revamp/design/tokens.css by scripts/inline_tokens.py, do not edit by hand) */
/* ==========================================================================
   MCP Connectors design tokens (Phase 3 draft, shared by concepts A/B/C)
   --------------------------------------------------------------------------
   How to use in a concept HTML (Artifact, no <html> tag available):
     1. Put this line right after <title>, before <style>, so it runs first:
          <script>document.documentElement.dataset.concept="a"</script>
        ("a" Console, "b" Studio, "c" Workbench)
     2. Inline this whole file inside <style>.
     3. Theme = data-theme on <html>: "light" | "dark" | removed (= follow OS).
        The concept A page is dark-first: its script sets data-theme="dark"
        on load when the viewer has no saved preference. The final design
        (final.html) drops that and follows the OS until the viewer picks a
        theme. The CSS below stays a single light-first source of truth for
        every page, so no value is written twice. Rationale: tokens.md
        section 2.
     4. Load the concept's Google Fonts <link> (URLs in the concept blocks).

   Layers:
     1. Common structure: spacing, radius scale, shadow, type scale, motion,
        z-index, neutral steps (hue comes from the concept), semantic colors,
        syntax and log colors.
     2. Theme mapping: light in bare :root, dark in the media query and in
        :root[data-theme="dark"] (identical values).
     3. Concept overrides: brand hue and colors, neutral hue, fonts, radius.

   Naming: brand tokens are --brand-*, not --accent-*, because shadcn's
   --accent means "hover surface". Divider is --line, input boundary is
   --line-strong. Mapping to shadcn variables: tokens.md section 6.
   Colors are oklch. Hex comments are sRGB approximations: in the common
   blocks they show the no-concept fallback (neutral hue 250), in concept
   blocks the concept itself. Per-concept hex for every token:
   python3 docs/revamp/design/scripts/check_contrast.py --hex
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Common structure + light theme (bare :root)
   -------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* Concept hooks (overridden per concept; fallback = cool gray) */
  --neutral-hue: 250;
  --brand-hue: 250;

  /* Spacing, 4px grid */
  --space-0: 0;
  --space-px: 1px;
  --space-0-5: 2px;
  --space-1: 4px;
  --space-1-5: 6px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Layout sizes */
  --control-h-sm: 28px;
  --control-h-md: 32px;
  --control-h-lg: 40px;
  --touch-min: 44px;
  --header-h: 48px;
  --sidebar-w: 248px;
  --content-max: 1280px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));

  /* Radius scale, derived from --radius (set per concept) */
  --radius: 6px;
  --radius-xs: calc(var(--radius) * 0.5);
  --radius-sm: calc(var(--radius) * 0.75);
  --radius-md: var(--radius);
  --radius-lg: calc(var(--radius) * 1.5);
  --radius-xl: calc(var(--radius) * 2);
  --radius-full: 9999px;

  /* Typography (families set per concept) */
  --font-kr-fallback: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: system-ui, var(--font-kr-fallback);
  --font-body: system-ui, var(--font-kr-fallback);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --text-2xs: 11px;  --leading-2xs: 16px;
  --text-xs: 12px;   --leading-xs: 18px;
  --text-sm: 13px;   --leading-sm: 20px;
  --text-base: 14px; --leading-base: 22px;
  --text-md: 16px;   --leading-md: 26px;
  --text-lg: 18px;   --leading-lg: 28px;
  --text-xl: 20px;   --leading-xl: 30px;
  --text-2xl: 24px;  --leading-2xl: 32px;
  --text-3xl: 30px;  --leading-3xl: 38px;
  --text-4xl: 36px;  --leading-4xl: 44px;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --tracking-tight: -0.015em;
  --tracking-normal: 0;
  --tracking-caps: 0.06em;

  /* Motion */
  --duration-instant: 80ms;
  --duration-fast: 140ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0.2, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --ease-emphasized: cubic-bezier(0.3, 0, 0, 1.15);

  /* z-index */
  --z-base: 0;
  --z-raised: 10;
  --z-sticky: 100;
  --z-sidebar: 200;
  --z-dropdown: 1000;
  --z-overlay: 1100;
  --z-modal: 1200;
  --z-popover: 1300;
  --z-toast: 1400;
  --z-tooltip: 1500;

  /* Focus */
  --focus-width: 2px;
  --focus-offset: 2px;

  /* Neutral steps: fixed L and C, hue from the concept (slight brand tint) */
  --n-0: oklch(0.995 0.002 var(--neutral-hue));       /* #fcfdff */
  --n-25: oklch(0.985 0.003 var(--neutral-hue));      /* #f9fafc */
  --n-50: oklch(0.972 0.004 var(--neutral-hue));      /* #f4f6f8 */
  --n-100: oklch(0.952 0.006 var(--neutral-hue));     /* #eceff3 */
  --n-150: oklch(0.928 0.007 var(--neutral-hue));     /* #e4e8ec */
  --n-200: oklch(0.900 0.009 var(--neutral-hue));     /* #dadfe4 */
  --n-300: oklch(0.840 0.011 var(--neutral-hue));     /* #c5cbd2 */
  --n-400: oklch(0.720 0.014 var(--neutral-hue));     /* #9ea5ad */
  --n-450: oklch(0.640 0.015 var(--neutral-hue));     /* #868d95 */
  --n-500: oklch(0.560 0.016 var(--neutral-hue));     /* #6e757e */
  --n-600: oklch(0.470 0.016 var(--neutral-hue));     /* #545c64 */
  --n-700: oklch(0.380 0.015 var(--neutral-hue));     /* #3c434a */
  --n-750: oklch(0.320 0.014 var(--neutral-hue));     /* #2e343a */
  --n-800: oklch(0.275 0.013 var(--neutral-hue));     /* #23282e */
  --n-850: oklch(0.240 0.012 var(--neutral-hue));     /* #1b2025 */
  --n-900: oklch(0.210 0.011 var(--neutral-hue));     /* #15191d */
  --n-950: oklch(0.180 0.010 var(--neutral-hue));     /* #0e1216 */
  --n-1000: oklch(0.150 0.009 var(--neutral-hue));    /* #080b0f */

  /* Shadows (light) */
  --shadow-color: oklch(0.25 0.02 var(--neutral-hue)); /* #1a222b */
  --shadow-xs: 0 1px 2px oklch(0.25 0.02 var(--neutral-hue) / 0.06);
  --shadow-sm: 0 1px 3px oklch(0.25 0.02 var(--neutral-hue) / 0.08), 0 1px 2px oklch(0.25 0.02 var(--neutral-hue) / 0.04);
  --shadow-md: 0 4px 12px -2px oklch(0.25 0.02 var(--neutral-hue) / 0.10), 0 2px 4px -2px oklch(0.25 0.02 var(--neutral-hue) / 0.06);
  --shadow-lg: 0 12px 32px -8px oklch(0.25 0.02 var(--neutral-hue) / 0.16), 0 4px 8px -4px oklch(0.25 0.02 var(--neutral-hue) / 0.06);
  --shadow-xl: 0 24px 64px -12px oklch(0.25 0.02 var(--neutral-hue) / 0.24), 0 8px 16px -8px oklch(0.25 0.02 var(--neutral-hue) / 0.08);

  /* Surfaces and text (light) */
  --bg: var(--n-25);
  --bg-subtle: var(--n-50);
  --surface: var(--n-0);
  --surface-raised: var(--n-0);
  --surface-sunken: var(--n-50);
  --surface-hover: var(--n-100);
  --surface-active: var(--n-150);
  --line: var(--n-150);
  --line-strong: var(--n-450);
  --fg: var(--n-1000);
  --fg-muted: var(--n-600);
  --fg-subtle: var(--n-450);
  --fg-on-inverse: var(--n-0);
  --inverse: var(--n-900);
  --overlay: oklch(0.2 0.01 var(--neutral-hue) / 0.45);

  /* Brand fallback (each concept overrides all of these) */
  --brand: oklch(0.50 0.02 var(--brand-hue));         /* #5b646f */
  --brand-hover: oklch(0.45 0.02 var(--brand-hue));   /* #4d5660 */
  --brand-fg: var(--n-0);
  --brand-subtle: var(--n-100);
  --brand-text: oklch(0.45 0.02 var(--brand-hue));    /* #4d5660 */
  --brand-border: var(--n-300);
  --focus-ring: oklch(0.55 0.02 var(--brand-hue));    /* #69737d */
  --selection: oklch(0.90 0.03 var(--brand-hue));     /* #d0e0f2 */

  /* Semantic: success (green 150), warning (orange 62), danger (red 25), info (blue 245) */
  --success-hue: 150;
  --warning-hue: 62;
  --danger-hue: 25;
  --info-hue: 245;

  --success-fg: oklch(0.46 0.12 var(--success-hue));  /* #0f6a31 */
  --success-bg: oklch(0.962 0.030 var(--success-hue)); /* #e5f9e8 */
  --success-border: oklch(0.62 0.13 var(--success-hue)); /* #429c5a */
  --success-solid: oklch(0.54 0.14 var(--success-hue)); /* #17843f */
  --success-solid-fg: var(--n-0);

  --warning-fg: oklch(0.49 0.12 calc(var(--warning-hue) - 8)); /* #934a06 */
  --warning-bg: oklch(0.967 0.040 calc(var(--warning-hue) + 18)); /* #fff2de */
  --warning-border: oklch(0.64 0.14 var(--warning-hue)); /* #c77618 */
  --warning-solid: oklch(0.66 0.15 var(--warning-hue)); /* #d27908 */
  --warning-solid-fg: var(--n-1000);

  --danger-fg: oklch(0.50 0.17 var(--danger-hue));    /* #b02a2d */
  --danger-bg: oklch(0.962 0.025 var(--danger-hue));  /* #ffeeec */
  --danger-border: oklch(0.62 0.18 var(--danger-hue)); /* #de4e4b */
  --danger-solid: oklch(0.55 0.19 var(--danger-hue)); /* #c92f33 */
  --danger-solid-fg: var(--n-0);

  --info-fg: oklch(0.48 0.13 var(--info-hue));        /* #00629d */
  --info-bg: oklch(0.962 0.025 var(--info-hue));      /* #e8f4ff */
  --info-border: oklch(0.62 0.13 var(--info-hue));    /* #348dcf */
  --info-solid: oklch(0.53 0.14 var(--info-hue));     /* #0071b3 */
  --info-solid-fg: var(--n-0);

  /* JSON syntax (light, checked on --surface-sunken and --surface) */
  --syntax-key: oklch(0.48 0.13 255);                 /* #215da5 */
  --syntax-string: oklch(0.49 0.12 150);              /* #1d7339 */
  --syntax-number: oklch(0.52 0.15 45);               /* #ab4500 */
  --syntax-boolean: oklch(0.49 0.17 330);             /* #92318d */
  --syntax-null: oklch(0.52 0.012 var(--neutral-hue)); /* #646a70 */
  --syntax-punct: var(--fg-muted);

  /* Log levels (JSON-RPC log, server log) */
  --log-debug: var(--fg-muted);
  --log-info: var(--info-fg);
  --log-warn: var(--warning-fg);
  --log-error: var(--danger-fg);
  --log-request: var(--brand-text);
  --log-response: var(--success-fg);

  /* Charts (chart-1 is the brand, set per concept) */
  --chart-1: var(--brand);
  --chart-2: oklch(0.58 0.12 165);                    /* #0a9068 */
  --chart-3: oklch(0.62 0.16 45);                     /* #d16022 */
  --chart-4: oklch(0.56 0.18 340);                    /* #b53e95 */
  --chart-5: oklch(0.58 0.13 240);                    /* #0c82bf */
  --chart-6: oklch(0.55 0.15 295);                    /* #795bbf, violet for guardrail spans */

  /* Trace spans (waterfall in Chat and Inspector timing). One hue per span
     kind, about 45 degrees apart: LLM = brand, proxy/DB = blue 240,
     guardrail = violet 295, tool = magenta 340, error = danger red,
     approval wait = warning edge color drawn as a hatch. Declared once here
     and only through theme-switching tokens, so the dark blocks need no
     copy and a page can still override a span kind in its own :root. */
  --span-llm: var(--chart-1);
  --span-tool: var(--chart-4);
  --span-guard: var(--chart-6);
  --span-proxy: var(--chart-5);
  --span-err: var(--danger-solid);
  --span-wait: var(--warning-border);
}

/* --------------------------------------------------------------------------
   2. Dark theme (system preference, unless data-theme="light")
      The block right after this repeats the exact same values for an
      explicit data-theme="dark". Keep the two blocks identical.
   -------------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --shadow-color: oklch(0 0 0);                     /* #000000 */
    --shadow-xs: 0 1px 2px oklch(0 0 0 / 0.30);
    --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.36), 0 1px 2px oklch(0 0 0 / 0.24);
    --shadow-md: 0 4px 12px -2px oklch(0 0 0 / 0.45), 0 2px 4px -2px oklch(0 0 0 / 0.30);
    --shadow-lg: 0 12px 32px -8px oklch(0 0 0 / 0.55), 0 4px 8px -4px oklch(0 0 0 / 0.30);
    --shadow-xl: 0 24px 64px -12px oklch(0 0 0 / 0.65), 0 8px 16px -8px oklch(0 0 0 / 0.35);

    --bg: var(--n-950);
    --bg-subtle: var(--n-1000);
    --surface: var(--n-900);
    --surface-raised: var(--n-850);
    --surface-sunken: var(--n-1000);
    --surface-hover: var(--n-800);
    --surface-active: var(--n-750);
    --line: var(--n-800);
    --line-strong: var(--n-500);
    --fg: var(--n-25);
    --fg-muted: var(--n-400);
    --fg-subtle: var(--n-500);
    --fg-on-inverse: var(--n-1000);
    --inverse: var(--n-100);
    --overlay: oklch(0 0 0 / 0.6);

    --brand: oklch(0.75 0.02 var(--brand-hue));       /* #a5afba */
    --brand-hover: oklch(0.80 0.02 var(--brand-hue)); /* #b4bfca */
    --brand-fg: var(--n-1000);
    --brand-subtle: var(--n-800);
    --brand-text: oklch(0.80 0.02 var(--brand-hue));  /* #b4bfca */
    --brand-border: var(--n-700);
    --focus-ring: oklch(0.75 0.02 var(--brand-hue));  /* #a5afba */
    --selection: oklch(0.38 0.04 var(--brand-hue));   /* #324457 */

    --success-fg: oklch(0.80 0.13 var(--success-hue)); /* #7cd591 */
    --success-bg: oklch(0.27 0.045 var(--success-hue)); /* #152d1a */
    --success-border: oklch(0.55 0.11 var(--success-hue)); /* #3b834e */
    --success-solid: oklch(0.72 0.15 var(--success-hue)); /* #53be70 */
    --success-solid-fg: var(--n-1000);

    --warning-fg: oklch(0.83 0.12 calc(var(--warning-hue) + 8)); /* #f9b96c */
    --warning-bg: oklch(0.28 0.045 var(--warning-hue)); /* #392310 */
    --warning-border: oklch(0.58 0.11 var(--warning-hue)); /* #a86a2c */
    --warning-solid: oklch(0.78 0.14 var(--warning-hue)); /* #f6a14f */
    --warning-solid-fg: var(--n-1000);

    --danger-fg: oklch(0.78 0.13 var(--danger-hue));  /* #ff958d */
    --danger-bg: oklch(0.27 0.055 var(--danger-hue)); /* #3d1b18 */
    --danger-border: oklch(0.58 0.15 var(--danger-hue)); /* #c34f4b */
    --danger-solid: oklch(0.68 0.17 var(--danger-hue)); /* #ef6661 */
    --danger-solid-fg: var(--n-1000);

    --info-fg: oklch(0.80 0.10 var(--info-hue));      /* #86c5fa */
    --info-bg: oklch(0.27 0.045 var(--info-hue));     /* #12283b */
    --info-border: oklch(0.56 0.11 var(--info-hue));  /* #337ab0 */
    --info-solid: oklch(0.72 0.12 var(--info-hue));   /* #5eaceb */
    --info-solid-fg: var(--n-1000);

    --syntax-key: oklch(0.80 0.10 240);               /* #80c7f8 */
    --syntax-string: oklch(0.80 0.13 148);            /* #80d58d */
    --syntax-number: oklch(0.80 0.12 60);             /* #f6ab6b */
    --syntax-boolean: oklch(0.78 0.13 330);           /* #e698df */
    --syntax-null: oklch(0.68 0.012 var(--neutral-hue)); /* #9399a0 */

    --chart-2: oklch(0.72 0.12 165);                  /* #4dbc92 */
    --chart-3: oklch(0.72 0.15 50);                   /* #ee8545 */
    --chart-4: oklch(0.70 0.16 340);                  /* #de73bd */
    --chart-5: oklch(0.72 0.12 240);                  /* #55aee8 */
    --chart-6: oklch(0.72 0.12 295);                  /* #aa95e8 */
  }
}

  --brand-border: oklch(0.56 0.100 72);               /* #986a28 */

/* --------------------------------------------------------------------------
   4. Reduced motion
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-instant: 0ms;
    --duration-fast: 0ms;
    --duration-base: 0ms;
    --duration-slow: 0ms;
  }
}

/* --------------------------------------------------------------------------
   5. Minimal base (optional, keeps every concept page consistent)
   -------------------------------------------------------------------------- */
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-base);
  -webkit-font-smoothing: antialiased;
}
:lang(ko) { word-break: keep-all; }
::selection { background: var(--selection); }
:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
/* @tokens:end */

/* ==========================================================================
   Final design (Phase 3, 3-7): A + B + C
   Shell, Inspector and brand from concept A "Console" (IDE shell, activity
   bar, server explorer, status bar, command palette, resizable panes).
   Dashboard adds B's "Getting started" checklist redrawn in A's language.
   Chat keeps A's thread and swaps the terminal trace for C's waterfall;
   Inspector timing uses the same waterfall. Theme follows the OS until the
   viewer picks one. Page tokens below only derive from tokens.css roles.
   ========================================================================== */
:root {
  --tb-h: 40px;
  --sb-h: 24px;
  --act-w: 44px;
  --side-w: 248px;
  --c1: 264px;
  --rq: 1fr;
  --rs: 1fr;
  --dock-h: 216px;
  --trace-w: 420px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --brand-wash: color-mix(in oklch, var(--brand) 14%, transparent);
  --brand-wash-strong: color-mix(in oklch, var(--brand) 24%, transparent);
  --sel-row: color-mix(in oklch, var(--brand) 9%, var(--surface-hover)); /* QA 3-5: surface-active base left fg-muted at 4.2:1 in dark */
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg-subtle);
  color: var(--fg);
  overflow: hidden;
  font-size: var(--text-sm);
  line-height: var(--leading-sm);
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: not-allowed; }
input, select, textarea { margin: 0; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
pre, code { font-family: var(--font-mono); font-variant-ligatures: none; }
pre { margin: 0; }
table { border-collapse: collapse; }
a { color: var(--brand-text); }

.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 14px; height: 14px; }
.ic-lg { width: 20px; height: 20px; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-muted); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.caps { font-family: var(--font-mono); font-size: var(--text-2xs); line-height: var(--leading-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-muted); font-weight: var(--weight-medium); }
:lang(ko) .caps { letter-spacing: 0.02em; }

kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  font-family: var(--font-mono); font-size: var(--text-2xs); line-height: 1;
  color: var(--fg-muted); background: var(--surface-sunken);
  border: 1px solid var(--line); border-radius: var(--radius-xs);
  white-space: nowrap;
}
.btn-primary kbd { background: transparent; border-color: color-mix(in oklch, var(--brand-fg) 28%, transparent); color: var(--brand-fg); }

/* ---------- Buttons and controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1-5);
  height: var(--control-h-sm); padding: 0 var(--space-2-5, 10px);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--fg);
  font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap;
  transition: background-color var(--duration-instant) var(--ease-standard), border-color var(--duration-instant) var(--ease-standard), color var(--duration-instant) var(--ease-standard);
}
.btn:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--line-strong); }
.btn:active:not(:disabled) { background: var(--surface-active); }
.btn:disabled { opacity: 0.45; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn-primary:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn-primary:active:not(:disabled) { background: var(--brand-hover); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
.btn-ghost:hover:not(:disabled) { color: var(--fg); background: var(--surface-hover); border-color: transparent; }
.btn-danger { color: var(--danger-fg); border-color: var(--danger-border); background: transparent; }
.btn-danger:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger-border); }
.btn-icon { width: var(--control-h-sm); padding: 0; }
.btn-lg { height: var(--control-h-md); padding: 0 var(--space-3); font-size: var(--text-sm); }

.seg {
  display: inline-flex; align-items: center; padding: 2px; gap: 2px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg);
  flex: none;
}
.seg > button {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 22px; min-width: 26px; padding: 0 var(--space-2);
  border-radius: var(--radius-xs); color: var(--fg-muted);
  font-family: var(--font-mono); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap;
  transition: background-color var(--duration-instant), color var(--duration-instant);
}
.seg > button:hover { color: var(--fg); background: var(--surface-hover); }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"], .seg > button[aria-checked="true"] { background: var(--surface-active); color: var(--fg); box-shadow: var(--shadow-xs); }
.seg-icons > button { padding: 0; width: 26px; }

.inp, .sel, .ta {
  width: 100%; min-width: 0;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface-sunken); color: var(--fg);
  font-size: var(--text-sm);
  transition: border-color var(--duration-instant), box-shadow var(--duration-instant);
}
.inp, .sel { height: 30px; padding: 0 var(--space-2); }
.ta { padding: var(--space-2); resize: vertical; line-height: var(--leading-sm); font-family: var(--font-mono); font-size: var(--text-xs); }
.inp::placeholder, .ta::placeholder { color: var(--fg-muted); }
.inp:hover, .sel:hover, .ta:hover { border-color: var(--fg-subtle); }
.inp:focus-visible, .sel:focus-visible, .ta:focus-visible { outline: none; border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }
.inp[aria-invalid="true"], .ta[aria-invalid="true"] { border-color: var(--danger-border); }
.inp.mono { font-family: var(--font-mono); font-size: var(--text-xs); }
.sel { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-muted) 50%), linear-gradient(135deg, var(--fg-muted) 50%, transparent 50%); background-position: calc(100% - 13px) 13px, calc(100% - 9px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }

.search { position: relative; display: flex; align-items: center; min-width: 0; }
.search .ic { position: absolute; left: 8px; color: var(--fg-muted); pointer-events: none; }
.search .inp { padding-left: 28px; padding-right: 30px; height: 28px; font-size: var(--text-xs); }
.search kbd { position: absolute; right: 6px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px;
  border: 1px solid var(--line); border-radius: var(--radius-xs);
  font-family: var(--font-mono); font-size: var(--text-2xs); line-height: 1; color: var(--fg-muted);
  white-space: nowrap; flex: none;
}
.chip-brand { color: var(--brand-text); border-color: var(--brand-border); background: var(--brand-subtle); }
.chip-ok { color: var(--success-fg); border-color: var(--success-border); background: var(--success-bg); }
.chip-warn { color: var(--warning-fg); border-color: var(--warning-border); background: var(--warning-bg); }
.chip-err { color: var(--danger-fg); border-color: var(--danger-border); background: var(--danger-bg); }
.chip-info { color: var(--info-fg); border-color: var(--info-border); background: var(--info-bg); }

/* Status dot with a soft pulse for live states */
.dot { position: relative; width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; background: var(--fg-subtle); }
.dot-online { background: var(--success-solid); }
.dot-online::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--success-solid); animation: pulse 2.4s var(--ease-standard) infinite; }
.dot-offline { background: var(--danger-solid); box-shadow: 0 0 0 3px color-mix(in oklch, var(--danger-solid) 22%, transparent); }
.dot-ondemand { background: transparent; border: 1.5px solid var(--fg-subtle); }
.dot-checking { background: var(--warning-solid); animation: blink 1s steps(2, start) infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
@keyframes blink { to { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.spin { animation: spin 0.9s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .dot-online::after, .dot-checking, .spin, .progress::after, .caret { animation: none !important; }
}

/* ---------- App shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: var(--tb-h) minmax(0, 1fr) var(--sb-h); }

.tb {
  display: flex; align-items: center; gap: var(--space-3); min-width: 0;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--bg-subtle);
}
.tb-brand { display: flex; align-items: center; gap: var(--space-2); flex: none; font-family: var(--font-display); font-size: var(--text-sm); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); }
.tb-brand .mark { width: 22px; height: 22px; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--brand); color: var(--brand-fg); }
.tb-brand .mark .ic { width: 14px; height: 14px; stroke-width: 2; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-muted); }
.crumb b { color: var(--fg); font-weight: var(--weight-medium); }
.crumb .sep { color: var(--fg-muted); }
.cmdk {
  display: flex; align-items: center; gap: var(--space-2);
  width: min(380px, 100%); height: 26px; padding: 0 6px 0 var(--space-2); margin-inline: auto;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg);
  color: var(--fg-muted); font-size: var(--text-xs);
  transition: border-color var(--duration-instant), color var(--duration-instant);
}
.cmdk:hover { border-color: var(--line-strong); color: var(--fg); }
.cmdk span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-right { display: flex; align-items: center; gap: var(--space-2); flex: none; }
.tb .menu-btn { display: none; }

.work { min-height: 0; display: flex; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 var(--space-2); }
.frame {
  flex: 1; min-width: 0; min-height: 0;
  display: grid; grid-template-columns: var(--act-w) var(--side-w) minmax(0, 1fr);
  border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden;
  background: var(--surface);
}

/* Activity bar */
.act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-block: var(--space-1); background: var(--bg); border-right: 1px solid var(--line); }
.act-btn { position: relative; width: 44px; height: 42px; display: grid; place-items: center; color: var(--fg-subtle); transition: color var(--duration-instant); }
.act-btn:hover { color: var(--fg); }
.act-btn[aria-current="page"] { color: var(--fg); }
.act-btn[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 0 2px 2px 0; background: var(--brand); }
.act-btn .ic { width: 20px; height: 20px; }
.act-btn .badge { position: absolute; top: 7px; right: 8px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: var(--radius-full); background: var(--warning-solid); color: var(--warning-solid-fg); font-family: var(--font-mono); font-size: 9px; line-height: 14px; text-align: center; font-weight: var(--weight-bold); }
.act-spacer { flex: 1; }
.act-tip { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); padding: 3px 8px; border-radius: var(--radius-sm); background: var(--inverse); color: var(--fg-on-inverse); font-size: var(--text-2xs); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--duration-fast); z-index: var(--z-tooltip); }
.act-btn:hover .act-tip, .act-btn:focus-visible .act-tip { opacity: 1; }

/* Sidebar */
.side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); border-right: 1px solid var(--line); }
.side-head { display: flex; align-items: center; gap: var(--space-1); height: 36px; padding: 0 var(--space-2) 0 var(--space-3); flex: none; }
.side-head .caps { flex: 1; }
.side-close { display: none; }
.side-body { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: var(--space-3); }
.side-group { padding: var(--space-2) 0 var(--space-1); }
.side-group-h { display: flex; align-items: center; gap: 6px; padding: 4px var(--space-3); color: var(--fg-muted); font-size: var(--text-2xs); font-family: var(--font-mono); }
.side-group-h .ic { width: 12px; height: 12px; }
.side-group-h .src { margin-left: auto; color: var(--fg-muted); }
.srv-item {
  display: flex; align-items: center; gap: var(--space-2); width: 100%;
  height: 30px; padding: 0 var(--space-2) 0 var(--space-3);
  color: var(--fg); font-family: var(--font-mono); font-size: var(--text-xs);
  transition: background-color var(--duration-instant);
}
.srv-item:hover { background: var(--surface-hover); }
.srv-item[aria-current="true"] { background: var(--sel-row); box-shadow: inset 2px 0 0 var(--brand); }
.srv-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srv-item .count { color: var(--fg-muted); font-size: var(--text-2xs); }
.tbadge { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 16px; border-radius: var(--radius-xs); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.02em; color: var(--fg-muted); flex: none; }
.tbadge.http { color: var(--brand-text); border-color: var(--brand-border); }
.side-empty { margin: var(--space-1) var(--space-3) 0; padding: var(--space-3); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--fg-muted); font-size: var(--text-xs); line-height: var(--leading-xs); display: grid; gap: var(--space-2); justify-items: start; }
.side-foot { flex: none; display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-2-5, 10px) var(--space-3); border-top: 1px solid var(--line); color: var(--fg-muted); font-size: var(--text-2xs); line-height: var(--leading-2xs); }
.side-foot .ic { width: 13px; height: 13px; margin-top: 1px; color: var(--success-fg); }
.side-foot code { color: var(--fg); }

.conv-item { display: grid; gap: 2px; width: 100%; padding: 7px var(--space-3); transition: background-color var(--duration-instant); }
.conv-item:hover { background: var(--surface-hover); }
.conv-item[aria-current="true"] { background: var(--sel-row); box-shadow: inset 2px 0 0 var(--brand); }
.conv-item .t { font-size: var(--text-xs); font-weight: var(--weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-item .m { display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); min-width: 0; }
.conv-item .m .ic { width: 11px; height: 11px; }
.conv-item .m > span { flex: none; }
.conv-item .m > .mdl { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chk-row { display: flex; align-items: center; gap: var(--space-2); padding: 5px var(--space-3); font-family: var(--font-mono); font-size: var(--text-xs); cursor: pointer; }
.chk-row:hover { background: var(--surface-hover); }
.chk-row input { width: 14px; height: 14px; accent-color: var(--brand); margin: 0; flex: none; }
.chk-row .count { margin-left: auto; color: var(--fg-muted); font-size: var(--text-2xs); }
.chk-row.disabled { color: var(--fg-muted); cursor: not-allowed; }

/* Main views */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view[hidden] { display: none !important; }

/* Status bar */
.sb {
  display: flex; align-items: center; gap: 0; min-width: 0; overflow: hidden;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--brand); color: var(--brand-fg);
  font-family: var(--font-mono); font-size: var(--text-2xs); line-height: var(--sb-h);
}
.sb-item { display: inline-flex; align-items: center; gap: 5px; height: var(--sb-h); padding: 0 var(--space-2); white-space: nowrap; color: inherit; }
button.sb-item:hover { background: color-mix(in oklch, var(--brand-fg) 12%, transparent); }
.sb-item .ic { width: 12px; height: 12px; stroke-width: 1.75; }
.sb-item .sdot { width: 7px; height: 7px; border-radius: var(--radius-full); background: currentColor; }
.sb-item .sdot.hollow { background: transparent; border: 1.5px solid currentColor; }
.sb-spacer { flex: 1; min-width: var(--space-2); }
.sb-tag { padding: 0 6px; height: 16px; line-height: 14px; border: 1px solid color-mix(in oklch, var(--brand-fg) 45%, transparent); border-radius: var(--radius-xs); }
.sb .first { margin-left: calc(var(--space-2) * -1); flex: 0 1 auto; min-width: 0; overflow: hidden; }
.sb .first > span:not(.sdot) { overflow: hidden; text-overflow: ellipsis; }
.sb > *:not(.first):not(.sb-spacer) { flex: none; }

/* Mobile nav (replaces activity bar) */
.mnav { display: none; }

/* ---------- Generic panel parts ---------- */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
.pane-head { display: flex; align-items: center; gap: var(--space-2); min-height: 36px; padding: 0 var(--space-3); border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.pane-body { flex: 1; min-height: 0; overflow: auto; }
.tabs { display: flex; align-items: stretch; gap: 0; min-width: 0; align-self: stretch; }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--space-2-5, 10px);
  color: var(--fg-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap;
  transition: color var(--duration-instant);
}
.tab:hover:not(:disabled) { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; background: var(--brand); border-radius: 2px 2px 0 0; }
.tab:disabled { color: var(--fg-subtle); }
.tab .n { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); padding: 0 4px; border-radius: var(--radius-xs); background: var(--surface-hover); line-height: 15px; }
/* QA 3-5: "Prompts 1" spilled past the tool pane into the request pane (1024 to 1440px) */
#paneTools .pane-head .tab { padding: 0 6px; gap: 4px; }
.pane-head > .tabs:first-child .tab:first-child { padding-left: 0; }
.pane-head > .tabs:first-child .tab:first-child[aria-selected="true"]::after { left: 0; }

/* Splitters */
.split { position: relative; background: var(--line); flex: none; z-index: var(--z-raised); touch-action: none; }
.split-v { width: 1px; cursor: col-resize; }
.split-h { height: 1px; cursor: row-resize; }
.split::before { content: ""; position: absolute; }
.split-v::before { inset: 0 -4px; }
.split-h::before { inset: -4px 0; }
.split:hover, .split.drag, .split:focus-visible { background: var(--brand); outline: none; }
.split:focus-visible { box-shadow: 0 0 0 2px var(--focus-ring); }
.split:focus-visible .split-grip { opacity: 1; background: var(--brand); }
.split-grip { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 3px; height: 24px; border-radius: 2px; background: var(--line-strong); opacity: 0; transition: opacity var(--duration-fast); }
.split-h .split-grip { width: 24px; height: 3px; }
.split:hover .split-grip { opacity: 1; }

/* JSON and code */
.code {
  margin: 0; padding: var(--space-3); overflow: auto;
  background: var(--surface-sunken); border: 1px solid var(--line); border-radius: var(--radius-md);
  font-family: var(--font-mono); font-size: var(--text-xs); line-height: var(--leading-xs); color: var(--fg);
  white-space: pre; tab-size: 2;
}
.code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
:lang(ko) .code.wrap { word-break: keep-all; } /* QA 3-5: break-word split Korean words mid-syllable run */
.j-k { color: var(--syntax-key); }
.j-s { color: var(--syntax-string); }
.j-n { color: var(--syntax-number); }
.j-b { color: var(--syntax-boolean); }
.j-z { color: var(--syntax-null); font-style: italic; }
.j-p { color: var(--syntax-punct); }

.empty {
  display: grid; justify-items: center; gap: var(--space-2); text-align: center;
  padding: var(--space-8) var(--space-6); color: var(--fg-muted); font-size: var(--text-xs); line-height: var(--leading-xs);
}
.empty .ic { width: 22px; height: 22px; color: var(--fg-subtle); }
.empty h3 { color: var(--fg); font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.empty p { max-width: 36ch; }

.alert { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-2); padding: var(--space-3); border: 1px solid; border-radius: var(--radius-md); font-size: var(--text-xs); line-height: var(--leading-xs); }
.alert > .ic { margin-top: 1px; }
.alert-err { color: var(--fg); border-color: var(--danger-border); background: var(--danger-bg); }
.alert-err > .ic, .alert-err .alert-t { color: var(--danger-fg); }
.alert-warn { color: var(--fg); border-color: var(--warning-border); background: var(--warning-bg); }
.alert-warn > .ic, .alert-warn .alert-t { color: var(--warning-fg); }
.alert-info { color: var(--fg); border-color: var(--info-border); background: var(--info-bg); }
.alert-info > .ic, .alert-info .alert-t { color: var(--info-fg); }
.alert-t { font-weight: var(--weight-semibold); }
.alert-body { grid-column: 2; display: grid; gap: var(--space-2); }
.cmdline { display: flex; align-items: center; gap: var(--space-2); min-width: 0; padding: 4px 4px 4px var(--space-2); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-sunken); font-family: var(--font-mono); font-size: var(--text-xs); }
.cmdline code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--fg); scrollbar-width: none; }
.cmdline code::before { content: "$ "; color: var(--fg-muted); }
.row-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }

/* ---------- Dashboard ---------- */
.dash { flex: 1; min-height: 0; overflow: auto; }
.dash-in { padding: var(--space-5) var(--space-6) var(--space-8); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-5); max-width: 1320px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3) var(--space-4); }
.page-head h1 { font-family: var(--font-display); font-size: var(--text-xl); line-height: var(--leading-xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); }
.page-head p { color: var(--fg-muted); font-size: var(--text-xs); margin-top: 2px; }
.page-head p code { color: var(--fg); }
.page-head .row-actions { margin-left: auto; }

.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); }
.metric { padding: var(--space-3) var(--space-4); display: grid; gap: 2px; min-width: 0; }
.metric + .metric { border-left: 1px solid var(--line); }
.metric .v { font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-2xl); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; letter-spacing: var(--tracking-tight); }
.metric .v small { font-size: var(--text-sm); color: var(--fg-muted); font-weight: var(--weight-regular); margin-left: 4px; }
.metric .d { font-size: var(--text-xs); color: var(--fg-muted); }
.metric .v.ok { color: var(--success-fg); }
.metric .v.err { color: var(--danger-fg); }

.sec-h { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.sec-h h2 { font-family: var(--font-display); font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.sec-h p { color: var(--fg-muted); font-size: var(--text-xs); }

.stbl { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
.srow {
  display: grid; align-items: center; gap: var(--space-3);
  grid-template-columns: 96px minmax(160px, 1fr) 150px 44px 176px 84px 200px;
  padding: var(--space-2-5, 10px) var(--space-4); min-width: 0;
}
.srow + .srow, .srow + .sdetail, .sdetail + .srow { border-top: 1px solid var(--line); }
.srow.head { padding-block: 7px; background: var(--bg); }
.srow.head > * { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:lang(ko) .srow.head > * { letter-spacing: 0.02em; }
.srow:not(.head) { transition: background-color var(--duration-instant); }
.srow:not(.head):hover { background: color-mix(in oklch, var(--surface-hover) 55%, transparent); }
.srow .st { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); white-space: nowrap; }
.srow .st.online { color: var(--success-fg); }
.srow .st.offline { color: var(--danger-fg); }
.srow .st.ondemand { color: var(--fg-muted); }
.srow .st.checking { color: var(--warning-fg); }
.srow .nm { min-width: 0; display: grid; gap: 1px; }
.srow .nm b { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .nm span { color: var(--fg-muted); font-size: var(--text-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .tr { display: grid; gap: 1px; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); min-width: 0; }
.srow .tr .tbadge { width: auto; padding: 0 5px; justify-self: start; }
.srow .tr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* tool count */
.srow .tc { font-family: var(--font-mono); font-size: var(--text-sm); text-align: right; font-variant-numeric: tabular-nums; }
.srow .lat { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.srow .lat .p50 { font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; width: 40px; text-align: right; flex: none; }
.srow .lat .na { font-size: var(--text-2xs); color: var(--fg-muted); font-family: var(--font-mono); line-height: var(--leading-2xs); }
.srow .chk { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; line-height: var(--leading-2xs); }
.srow .chk b { display: block; color: var(--fg); font-weight: var(--weight-regular); font-size: var(--text-xs); }
.srow .acts { display: flex; justify-content: flex-end; gap: var(--space-1); }
.sdetail { padding: 0 var(--space-4) var(--space-3) calc(var(--space-4) + 96px + var(--space-3)); }
.spark { display: block; flex: none; overflow: visible; }
.spark .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
.spark .area { fill: var(--brand-wash); stroke: none; }
.spark .line { fill: none; stroke: var(--chart-1); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.spark .end { fill: var(--chart-1); stroke: var(--surface); stroke-width: 1.5; }
.spark .gap { stroke: var(--danger-border); stroke-width: 1.5; stroke-dasharray: 2 3; fill: none; }
.spark .end-off { fill: var(--surface); stroke: var(--danger-solid); stroke-width: 1.5; }
.dash-empty { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); padding: var(--space-4); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--fg-muted); font-size: var(--text-xs); line-height: var(--leading-xs); }
.dash-empty > .ic { width: 20px; height: 20px; color: var(--fg-subtle); }
.dash-empty .txt { flex: 1 1 260px; min-width: 0; }
.dash-empty b { display: block; color: var(--fg); font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: 2px; }
.dash-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-5); }
.mini-log { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-sunken); padding: var(--space-2) 0; font-family: var(--font-mono); font-size: var(--text-2xs); line-height: 20px; overflow-x: auto; }
.mini-log div { display: grid; grid-template-columns: 64px 64px minmax(0, 1fr); gap: var(--space-2); padding: 0 var(--space-3); white-space: nowrap; }
.mini-log .t { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.lv-ok { color: var(--log-response); }
.lv-err { color: var(--log-error); }
.lv-warn { color: var(--log-warn); }
.lv-info { color: var(--log-info); }
.lv-req { color: var(--log-request); }
.lv-dbg { color: var(--log-debug); }

/* ---------- Inspector ---------- */
.insp { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto var(--dock-h); }
.mseg-bar { display: none; }
.panes { min-height: 0; display: grid; grid-template-columns: var(--c1) auto minmax(0, var(--rq)) auto minmax(0, var(--rs)); }
.tool-list { padding: var(--space-1) 0 var(--space-3); }
.tool-item { display: grid; gap: 1px; width: 100%; padding: 7px var(--space-3); transition: background-color var(--duration-instant); }
.tool-item:hover { background: var(--surface-hover); }
.tool-item[aria-current="true"] { background: var(--sel-row); box-shadow: inset 2px 0 0 var(--brand); }
.tool-item .r1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tool-item .r1 b { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.tool-item .r2 { color: var(--fg-muted); font-size: var(--text-2xs); line-height: var(--leading-2xs); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tool-item mark { background: var(--brand-wash-strong); color: inherit; border-radius: 2px; }
.list-filter { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); flex: none; }
.cached-note { margin: var(--space-2) var(--space-3) 0; }

.req-head { display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); flex: none; }
.req-title { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; min-width: 0; }
.req-title h2 { font-family: var(--font-display); font-size: var(--text-md); line-height: var(--leading-md); font-weight: var(--weight-semibold); min-width: 0; overflow-wrap: anywhere; }
.req-title .seg { margin-left: auto; }
.req-desc { color: var(--fg-muted); font-size: var(--text-xs); line-height: var(--leading-xs); }
.req-meta { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
.req-body { padding: var(--space-4); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); align-content: start; }
.field { display: grid; gap: var(--space-1-5); }
.field-l { display: flex; align-items: center; gap: var(--space-1-5); flex-wrap: wrap; }
.field-l label { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg); }
.field-l .req { color: var(--danger-fg); font-family: var(--font-mono); font-size: var(--text-2xs); }
.field-l .opt { color: var(--fg-muted); font-size: var(--text-2xs); }
.field-h { color: var(--fg-muted); font-size: var(--text-2xs); line-height: var(--leading-2xs); }
.field-err { color: var(--danger-fg); font-size: var(--text-2xs); line-height: var(--leading-2xs); }
.examples { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; }
.examples .lab { color: var(--fg-muted); font-size: var(--text-2xs); }
.ex-btn { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius-full); color: var(--fg-muted); font-size: var(--text-2xs); white-space: nowrap; transition: border-color var(--duration-instant), color var(--duration-instant); }
.ex-btn:hover { color: var(--fg); border-color: var(--line-strong); }
.ex-btn .sw { width: 6px; height: 6px; border-radius: var(--radius-full); }
.req-foot { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-4); border-top: 1px solid var(--line); background: var(--bg); flex: none; min-height: 48px; }
.req-foot .elapsed { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.req-foot .elapsed.live { color: var(--warning-fg); }

.skel { height: 10px; border-radius: 3px; background: var(--surface-hover); }

.trow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) 56px; gap: var(--space-3); align-items: center; font-size: var(--text-xs); }

.dock { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }

.log-row { display: grid; grid-template-columns: 92px 18px minmax(120px, 170px) 48px minmax(0, 1fr) 56px 56px; gap: var(--space-2); align-items: center; width: 100%; padding: 0 var(--space-3); height: 24px; font-family: var(--font-mono); font-size: var(--text-2xs); white-space: nowrap; transition: background-color var(--duration-instant); }

.srvinfo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--space-4); padding: var(--space-3); }

.kv-grid dt { color: var(--fg-muted); font-family: var(--font-mono); font-size: var(--text-2xs); line-height: var(--leading-xs); }

/* ---------- Chat ---------- */
.chat { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto var(--trace-w); grid-template-rows: auto auto minmax(0, 1fr); }

.tok .meter i { display: block; height: 100%; background: var(--chart-1); }
.mseg-chat { display: none; }
.thread-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; grid-row: 3; }
.thread { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.thread-in { max-width: 820px; margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-6); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-5); }
.msg { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--space-3); }
.msg .av { width: 24px; height: 24px; border-radius: var(--radius-sm); display: grid; place-items: center; border: 1px solid var(--line); color: var(--fg-muted); background: var(--bg); }

.msg-h b { color: var(--fg); font-weight: var(--weight-semibold); }
.msg-b { display: grid; gap: var(--space-3); min-width: 0; }
.msg.user .bubble { padding: var(--space-2-5, 10px) var(--space-3); background: var(--surface-sunken); border: 1px solid var(--line); border-radius: var(--radius-md); font-size: var(--text-base); line-height: var(--leading-base); justify-self: start; max-width: 100%; }
.md { font-size: var(--text-base); line-height: var(--leading-base); display: grid; gap: var(--space-2); min-width: 0; }
.md p { max-width: 70ch; }

.md-table th { background: var(--bg); font-family: var(--font-mono); font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--fg-muted); letter-spacing: 0.02em; }

.tcard { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; min-width: 0; }
.tcard-h { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: 34px; padding: 0 var(--space-2) 0 var(--space-3); font-family: var(--font-mono); font-size: var(--text-xs); min-width: 0; transition: background-color var(--duration-instant); }

.approve { display: grid; gap: var(--space-3); padding: var(--space-3); border-top: 1px solid var(--warning-border); }
.approve p { font-size: var(--text-xs); color: var(--fg-muted); }
.approve .row-actions .btn { height: var(--control-h-md); padding: 0 var(--space-4); }
.typing { display: inline-flex; gap: 4px; align-items: center; height: 22px; color: var(--fg-muted); font-family: var(--font-mono); font-size: var(--text-2xs); }
.caret { display: inline-block; width: 7px; height: 13px; background: var(--brand); animation: blink 1s steps(2, start) infinite; vertical-align: -2px; }

.composer { flex: none; padding: var(--space-3) var(--space-5) var(--space-4); border-top: 1px solid var(--line); background: var(--surface); }
.composer-in { max-width: 820px; margin: 0 auto; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface-sunken); transition: border-color var(--duration-instant), box-shadow var(--duration-instant); }

.composer-f { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1-5) var(--space-2) var(--space-2) var(--space-3); }

.composer-f > .btn { flex: none; }
.composer-f .hint { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: var(--text-2xs); color: var(--fg-muted); white-space: nowrap; }
.trace-col { grid-row: 3; grid-column: 3; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface-sunken); }

.tl .t { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.tl .m { overflow-wrap: anywhere; color: var(--fg); }
.tl .m .d { color: var(--fg-muted); }
.tl.sep { margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px dashed var(--line); }
.trace-sum { flex: none; border-top: 1px solid var(--line); padding: var(--space-2) var(--space-3); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); background: var(--bg); }

.tag-llm { color: var(--brand-text); }
.tag-tool { color: var(--info-fg); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: var(--z-overlay); display: grid; place-items: start center; padding: 12vh max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); opacity: 0; transition: opacity var(--duration-base) var(--ease-standard); }

.hdr-rows { display: grid; gap: var(--space-2); }

.form-2 { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: var(--space-3); }
.cfg-tabs { display: flex; border-bottom: 1px solid var(--line); margin: calc(var(--space-4) * -1) calc(var(--space-4) * -1) 0; padding: 0 var(--space-4); height: 38px; }
.cfg-path { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-muted); flex-wrap: wrap; }

.pal { width: min(600px, 100%); }

.pal-item { display: flex; align-items: center; gap: var(--space-3); width: 100%; height: 34px; padding: 0 var(--space-4); font-size: var(--text-sm); color: var(--fg); }
.pal-item .ic { color: var(--fg-muted); }

.pal-item .sub { color: var(--fg-muted); font-family: var(--font-mono); font-size: var(--text-2xs); }
.pal-item[aria-selected="true"] { background: var(--sel-row); }
.pal-foot { display: flex; gap: var(--space-4); padding: var(--space-2) var(--space-4); border-top: 1px solid var(--line); font-size: var(--text-2xs); color: var(--fg-muted); background: var(--bg); flex-wrap: wrap; }
.pal-foot span { display: inline-flex; gap: 4px; align-items: center; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--sb-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: var(--z-toast); display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--inverse); color: var(--fg-on-inverse); font-size: var(--text-xs); box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(6px); transition: opacity var(--duration-base), transform var(--duration-base) var(--ease-enter); pointer-events: none; max-width: calc(100vw - 32px); }

.scrim { display: none; }

/* ---------- Medium widths ---------- */

/* ==========================================================================
   Final additions (3-7)
   ========================================================================== */

/* Skip link: off-canvas until focused */
.skip {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: 8px; z-index: var(--z-toast);
  padding: 6px var(--space-3); border-radius: var(--radius-sm);
  background: var(--inverse); color: var(--fg-on-inverse); font-size: var(--text-xs); font-weight: var(--weight-medium);
  text-decoration: none; transform: translateY(-160%); transition: transform var(--duration-fast) var(--ease-standard);
}
.skip:focus, .skip:focus-visible { transform: none; }
.main:focus { outline: none; }
.main:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: -2px; }

/* ---------- Getting started (B checklist in the A language) ---------- */
.gs { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
.gs-h {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2) var(--space-3);
  min-height: 38px; padding: 4px var(--space-2) 4px var(--space-3);
  background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: inset 2px 0 0 var(--brand);
}
.gs-mark { width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--radius-xs); background: var(--brand-subtle); color: var(--brand-text); flex: none; }
.gs-h h2 { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; font-weight: var(--weight-semibold); color: var(--fg); white-space: nowrap; }
:lang(ko) .gs-h h2 { letter-spacing: 0.02em; }
.gs-h h2:focus { outline: none; }
.gs-meter { display: inline-grid; grid-template-columns: repeat(4, 18px); gap: 3px; flex: none; }
.gs-meter i { height: 6px; border-radius: 1px; background: var(--surface-active); box-shadow: inset 0 0 0 1px var(--line-strong); }
.gs-meter i.on { background: var(--brand); box-shadow: none; }
.gs-count { font-size: var(--text-xs); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gs-count.short { display: none; font-family: var(--font-mono); font-size: var(--text-2xs); }
.gs-note { color: var(--fg-muted); font-size: var(--text-2xs); flex: 1 1 160px; min-width: 0; }
.gs-h .btn { margin-left: auto; flex: none; }
.gs-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; counter-reset: none; }
.gs-step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--space-2-5, 10px); padding: var(--space-3) var(--space-4) var(--space-3) var(--space-3); min-width: 0; transition: background-color var(--duration-slow) var(--ease-standard); }
.gs-step + .gs-step { border-left: 1px solid var(--line); }
.gs-box {
  width: 22px; height: 22px; display: grid; place-items: center; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface-sunken); color: var(--fg-muted);
  font-family: var(--font-mono); font-size: var(--text-2xs); font-weight: var(--weight-semibold);
}
.gs-box .ic { width: 13px; height: 13px; stroke-width: 2.25; }
.gs-step.done .gs-box { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.gs-txt { display: grid; gap: 4px; min-width: 0; align-content: start; }
.gs-txt b { font-size: var(--text-sm); line-height: var(--leading-sm); font-weight: var(--weight-semibold); }
.gs-step.done .gs-txt b { color: var(--fg-muted); font-weight: var(--weight-medium); }
.gs-txt p { color: var(--fg-muted); font-size: var(--text-xs); line-height: var(--leading-xs); }
.gs-txt p code { font-size: 0.92em; color: var(--fg); padding: 0 3px; border-radius: var(--radius-xs); background: var(--surface-sunken); border: 1px solid var(--line); overflow-wrap: anywhere; }
.gs-act { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1-5) var(--space-2); margin-top: var(--space-1); }
.gs-done { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--success-fg); white-space: nowrap; }
.gs-step.flash { animation: gs-flash 1.6s var(--ease-standard); }
@keyframes gs-flash { 0%, 35% { background: var(--brand-wash-strong); } 100% { background: transparent; } }
.gs.all .gs-h { box-shadow: inset 2px 0 0 var(--success-solid); }
.gs-show .ic { color: var(--brand-text); }

/* ---------- Waterfall (C trace language at A density) ---------- */
.wf-host { container-type: inline-size; min-width: 0; }
.wf { --label-w: 168px; --row-h: 28px; position: relative; font-size: var(--text-2xs); font-family: var(--font-mono); }
.wf-axis { display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); align-items: end; height: 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--surface-sunken); }
.wf-axis-label { padding: 0 0 4px var(--space-3); color: var(--fg-muted); font-size: 10px; text-transform: uppercase; letter-spacing: var(--tracking-caps); }
:lang(ko) .wf-axis-label { letter-spacing: 0; }
.wf-ticks { position: relative; height: 100%; margin-right: var(--space-3); }
.wf-tick { position: absolute; bottom: 4px; font-size: 10px; line-height: 12px; color: var(--fg-muted); white-space: nowrap; font-variant-numeric: tabular-nums; transform: translateX(-50%); }
.wf-tick.first { transform: none; }
.wf-tick.last { transform: translateX(-100%); }
.wf-tick::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 1px; height: 3px; background: var(--line-strong); }
.wf-tick.first::after { left: 0; }
.wf-tick.last::after { left: auto; right: 0; }
.wf-body { position: relative; }
.wf-grid { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: var(--space-3); pointer-events: none; }
.wf-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in oklab, var(--line) 70%, transparent); }
.wf-grid i.zero { background: var(--line); }
.wf-row {
  position: relative; display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); align-items: center;
  min-height: var(--row-h); cursor: pointer;
  border-bottom: 1px solid color-mix(in oklab, var(--line) 50%, transparent);
  transition: background-color var(--duration-instant) var(--ease-standard);
}
.wf-row:hover, .wf-row.is-linked { background: color-mix(in oklab, var(--surface-hover) 80%, transparent); }
.wf-row.is-linked { box-shadow: inset 2px 0 0 var(--focus-ring); }
.wf-row[aria-selected="true"] { background: var(--sel-row); box-shadow: inset 2px 0 0 var(--brand); }
.wf-row:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: -2px; }
.wf-row.flash { animation: wf-flash 1.1s var(--ease-standard); }
@keyframes wf-flash { 0%, 30% { background: var(--brand-wash-strong); } 100% { background: var(--sel-row); } }
.wf-label { display: flex; align-items: center; gap: 5px; min-width: 0; padding: 0 var(--space-2) 0 calc(var(--space-3) + var(--depth, 0) * 12px); }
.wf-label .tree { width: 8px; height: var(--row-h); flex: none; position: relative; margin-left: -3px; }
.wf-label .tree::before { content: ""; position: absolute; left: 0; top: -2px; height: 50%; width: 7px; border-left: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); border-bottom-left-radius: 3px; }
.wf-kind { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: var(--radius-xs); color: var(--surface); background: var(--fg-muted); }
.wf-kind .ic { width: 11px; height: 11px; stroke-width: 2; }
.k-llm .wf-kind { background: var(--span-llm); }
.k-tool .wf-kind { background: var(--span-tool); }
.k-guard .wf-kind { background: var(--span-guard); }
.k-proxy .wf-kind { background: var(--span-proxy); }
.k-turn .wf-kind { background: var(--fg); }
.k-wait .wf-kind { background: var(--span-wait); }
.wf-row.is-err .wf-kind, .wf-row.is-denied .wf-kind { background: var(--span-err); }
.wf-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-weight: var(--weight-medium); }
.wf-name small { font-size: 10px; font-weight: var(--weight-regular); color: var(--fg-muted); margin-left: 5px; }

.wf-status { margin-left: auto; flex: none; display: inline-flex; color: var(--success-fg); }
.wf-status .ic { width: 12px; height: 12px; }
.wf-status.err { color: var(--danger-fg); }
.wf-status.wait, .wf-status.run { color: var(--warning-fg); }
.wf-track { position: relative; height: var(--row-h); margin-right: var(--space-3); }
.wf-bar {
  --c: var(--fg-subtle);
  position: absolute; top: 7px; height: 14px; min-width: 3px; border-radius: 2px;
  background: color-mix(in oklab, var(--c) 26%, var(--surface));
  border: 1px solid var(--c);
  transition: left var(--duration-slow) var(--ease-enter), width var(--duration-slow) var(--ease-enter);
}
.wf-bar::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; border-radius: 2px 0 0 2px; background: var(--c); }
.k-llm .wf-bar { --c: var(--span-llm); }
.k-tool .wf-bar { --c: var(--span-tool); }
.k-guard .wf-bar { --c: var(--span-guard); }
.k-proxy .wf-bar { --c: var(--span-proxy); }
.k-turn .wf-bar { --c: var(--fg-subtle); height: 4px; top: 12px; background: var(--fg-subtle); border: 0; border-radius: 2px; }
.k-turn .wf-bar::before { display: none; }
.k-turn .wf-dur { display: none; }
.wf-row.is-err .wf-bar { --c: var(--span-err); }
.wf-row.is-wait .wf-bar {
  --c: var(--span-wait);
  background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--span-wait) 38%, var(--surface)) 0 4px, var(--surface) 4px 8px);
  border-style: dashed;
}
.wf-row.is-denied .wf-bar {
  --c: var(--span-err);
  background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--span-err) 30%, var(--surface)) 0 4px, var(--surface) 4px 8px);
}
.wf-row.is-run .wf-bar { background-image: linear-gradient(90deg, transparent, color-mix(in oklab, var(--c) 34%, transparent), transparent); background-size: 200% 100%; animation: wf-run 1s linear infinite; }
.wf-row.is-waiting .wf-bar::after { content: ""; position: absolute; right: -1px; top: -3px; bottom: -3px; width: 2px; background: var(--span-wait); animation: blink 1s steps(2, start) infinite; }
@keyframes wf-run { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.wf-row[aria-selected="true"] .wf-bar { background-color: color-mix(in oklab, var(--c) 55%, var(--surface)); box-shadow: 0 0 0 1px var(--surface), 0 0 0 3px var(--focus-ring); }
.wf-row.is-wait[aria-selected="true"] .wf-bar { background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--span-wait) 62%, var(--surface)) 0 4px, color-mix(in oklab, var(--span-wait) 16%, var(--surface)) 4px 8px); }
.wf-row.is-denied[aria-selected="true"] .wf-bar { background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--span-err) 55%, var(--surface)) 0 4px, color-mix(in oklab, var(--span-err) 14%, var(--surface)) 4px 8px); }
.wf-dur { position: absolute; top: 7px; line-height: 14px; font-size: 10px; color: var(--fg-muted); white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
.wf-dur.inside { color: var(--fg); }
.wf-row.is-waiting .wf-dur { color: var(--warning-fg); }
.wf-dur.pill { padding: 0 4px; margin-top: 0; border-radius: 2px; background: var(--surface); line-height: 12px; top: 8px; }
.wf-row.enter { animation: wf-enter var(--duration-slow) var(--ease-enter); }
@keyframes wf-enter { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
/* Replay: bars draw left to right on the shared time scale */
.wf.replaying .wf-bar { animation: wf-grow var(--rd, 0.3s) linear var(--rdl, 0s) both; }
.wf.replaying .wf-dur { animation: wf-fade 0.2s linear calc(var(--rdl, 0s) + var(--rd, 0.3s)) both; }
.wf.replaying .wf-row .wf-dur { animation-delay: 1.2s; }
@keyframes wf-grow { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes wf-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .wf-row.enter, .wf-row.flash, .wf-row.is-run .wf-bar, .wf-row.is-waiting .wf-bar::after, .wf.replaying .wf-bar, .wf.replaying .wf-dur, .gs-step.flash { animation: none !important; }
  .wf-bar { transition: none; }
  .wf-replay { display: none !important; }
}
/* Narrow hosts (resized trace column, phones): label above the bar */
@container (max-width: 330px) {
  .wf { --label-w: 0px; }

}

.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px var(--space-3); border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); background: var(--bg); }

/* Trace column (replaces the terminal log) */
.trace { padding: 0; font-family: var(--font-mono); line-height: normal; }
.turn-block + .turn-block { border-top: 1px solid var(--line); margin-top: var(--space-3); }

.sd-kind { box-shadow: inset 3px 0 0 var(--c, var(--fg-subtle)); padding-left: 8px; }

.sd-kind.k-guard { --c: var(--span-guard); }

.sd-kind.k-wait { --c: var(--span-wait); }

.trace-sum { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* Tool cards link to their spans */

}

  /* ---------- Dashboard ---------- */
  function spark(vals, status, label) {
    const W = 120, H = 28, P = 3, max = 120, n = vals.length;
    const x = (i) => P + (i * (W - 2 * P)) / (n - 1);
    const y = (v) => H - P - (Math.min(v, max) / max) * (H - 2 * P);
    const idx = vals.map((v, i) => (v == null ? -1 : i)).filter((i) => i >= 0);
    if (!idx.length) return "";
    const f = idx[0], l = idx[idx.length - 1];
    const pts = idx.map((i) => `${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`);
    const line = "M" + pts.join("L");
    const area = `${line}L${x(l).toFixed(1)},${H - P}L${x(f).toFixed(1)},${H - P}Z`;
    let tail = "";
    if (status === "offline" && l < n - 1) tail = `<path class="gap" d="M${x(l).toFixed(1)},${H - P}L${x(n - 1).toFixed(1)},${H - P}"/><circle class="end-off" cx="${x(n - 1).toFixed(1)}" cy="${H - P}" r="2.5"/>`;
    return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
      <path class="grid" d="M0,${y(60).toFixed(1)}H${W}M0,${H - P}H${W}"/>
      <path class="area" d="${area}"/><path class="line" d="${line}"/>

  }

  /* Form input handling */
  function readField(el) {
    const k = el.dataset.key, type = el.dataset.type, args = getArgs();
    const v = el.value;
    if (type === "array") args[k] = v.split("\n").map((x) => x.trim()).filter(Boolean);
    else if (type === "integer" || type === "number") { if (v.trim() === "") delete args[k]; else args[k] = /^-?\d+$/.test(v.trim()) ? parseInt(v, 10) : v; }
    else { if (v === "" && !(selDef().schema && selDef().schema.required.includes(k))) delete args[k]; else args[k] = v; }
    if (S.fieldErr[k]) { delete S.fieldErr[k]; el.removeAttribute("aria-invalid"); const e = $("#f-" + k + "-e"); if (e) e.hidden = true; }
  }
  function validate() {
    const d = selDef(), args = getArgs();
    S.fieldErr = {};
    if (S.sel.kind === "tool") {
      const props = d.schema.properties;
      d.schema.required.forEach((k) => { if (args[k] == null || args[k] === "" || (Array.isArray(args[k]) && !args[k].length)) S.fieldErr[k] = t("fieldRequired"); });
      Object.keys(props).forEach((k) => { if (props[k].type === "integer" && args[k] != null && !Number.isInteger(args[k])) S.fieldErr[k] = t("fieldInt"); });
    } else if (S.sel.kind === "prompt") {
      d.args.forEach((a) => { if (a.required && !args[a.name]) S.fieldErr[a.name] = t("fieldRequired"); });
    }
    return !Object.keys(S.fieldErr).length;
  }

  /* Run, finish, cancel */
  function run() {
    if (S.running || S.view !== "inspector") return;
    const s = cur();
    if (s.transport === "stdio" || s.status === "checking") return;
    const kind = S.sel.kind, d = selDef();
    const k = key(S.server, kind, S.sel.name);
    if (kind === "tool" && S.mode === "json") {
      const raw = S.raw[k] != null ? S.raw[k] : JSON.stringify(getArgs());
      try { const obj = JSON.parse(raw); if (typeof obj !== "object" || Array.isArray(obj) || obj === null) throw new Error("arguments must be an object"); S.args[k] = obj; S.rawErr = null; }
      catch (e) { S.rawErr = t("jsonInvalid", { m: e.message }); renderReq(); return; }
    } else if (!validate()) { renderReq(); const first = $(".req-body [aria-invalid='true']"); if (first) first.focus(); return; }
    const args = clone(getArgs());
    const id = S.rpcId++;
    const method = kind === "tool" ? "tools/call" : kind === "resource" ? "resources/read" : "prompts/get";
    const params = kind === "tool" ? { name: d.name, arguments: args } : kind === "resource" ? { uri: d.uri } : { name: d.name, arguments: args };
    const req = { jsonrpc: "2.0", id, method, params };
    pushLog({ server: s.id, at: simMs(), dir: "out", method, id, detail: kind === "resource" ? d.uri : d.name, json: req });
    const name = kind === "resource" ? d.uri : d.name;
    S.running = { id, start: performance.now(), server: s.id, kind, name, args, req, method };
    S.resp = { kind: "running", id, server: s.id, req, method };
    S.rtab = "content";
    S.logOpen = null;
    if (isMobile()) S.mseg = "response";
    const delay = s.status === "offline" ? 420 : simDelay(s, kind, d.name);
    S.running.tick = setInterval(() => {
      const el = $("#elapsed");
      if (el && S.running) el.textContent = t("running", { s: ((performance.now() - S.running.start) / 1000).toFixed(1) + " s" });
    }, 100);
    S.running.timer = setTimeout(finish, delay);
    refreshInspector();
  }
  function finish() {
    const r = S.running;
    if (!r) return;
    clearInterval(r.tick);
    const ms = Math.round(performance.now() - r.start);
    const s = srv(r.server);
    let entry;
    if (s.status !== "online") {
      const res = { status: 502, error: "upstream connect error", detail: `connect ECONNREFUSED 127.0.0.1:${(s.url || "").split(":").pop().split("/")[0]}`, upstream: s.internal };
      pushLog({ server: s.id, at: simMs(), dir: "in", method: "HTTP 502", id: r.id, detail: "ECONNREFUSED", json: res, ms, err: true });
      entry = { kind: "transport", res };
    } else {
      const result = simulate(s, r.kind, r.name, r.kind === "resource" ? { uri: r.name } : r.args);
      const res = { jsonrpc: "2.0", id: r.id, result };
      const detail = result.isError ? "isError " + (errHint(result.content[0].text).code ? "[" + errHint(result.content[0].text).code + "]" : "") : result.content ? `ok, ${result.content.length} block${result.content.length > 1 ? "s" : ""}` : result.contents ? `ok, ${result.contents.length} content` : "ok";
      pushLog({ server: s.id, at: simMs(), dir: "in", method: r.method, id: r.id, detail, json: res, ms, err: !!result.isError });
      entry = { kind: result.isError ? "iserror" : "ok", res };
      if (!result.isError) gsMark(1);
    }
    S.resp = { kind: entry.kind, id: r.id, server: s.id, req: r.req, res: entry.res, ms, method: r.method };
    S.history.unshift({ id: r.id, server: s.id, kind: r.kind, name: r.kind === "resource" ? r.name.split("/").pop() : r.name, args: r.kind === "resource" ? { uri: r.name } : r.args, at: simMs(), ms, req: r.req, res: entry.res, method: r.method, status: entry.kind });
    S.histActive = r.id;
    S.lastMs = ms;
    S.running = null;
    refreshInspector();
    renderStatus();
  }
  function cancel() {
    const r = S.running;

    S.resp = { kind: "cancelled", id: r.id, server: r.server, req: r.req, ms, method: r.method };
    S.history.unshift({ id: r.id, server: r.server, kind: r.kind, name: r.kind === "resource" ? r.name.split("/").pop() : r.name, args: r.kind === "resource" ? { uri: r.name } : r.args, at: simMs(), ms, req: r.req, res: null, method: r.method, status: "cancelled" });

  }
  function refreshInspector() {

  function loadHistory(id, rerun) {
    const h = S.history.find((x) => x.id === id);
