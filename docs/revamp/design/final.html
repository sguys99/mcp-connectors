  /* ---------- Waterfall (from concept C, redrawn for the A shell) ----------
     One scale for bars, ticks and grid lines. Duration labels go inside the bar
     when they fit, else to the right, else to the left. Rows use a roving tabindex. */
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
  const KIND_ICON = { llm: "spark", tool: "tool", guard: "shield", proxy: "route", turn: "waterfall", wait: "hand" };
  const fmtDur = (ms) => { ms = Math.max(0, ms); return ms >= 1000 ? (ms / 1000).toFixed(ms >= 10000 ? 1 : 2) + " s" : Math.round(ms) + " ms"; };
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-6))));
    const f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function tickLabel(v, step) {
    if (v === 0) return "0";
    if (step >= 1000 || v >= 1000) { const d = step % 1000 === 0 ? 0 : step % 500 === 0 ? 1 : 2; return (v / 1000).toFixed(d) + " s"; }
    return Math.round(v) + " ms";
  }
  const spanName = (s) => (s.nameKey ? t(s.nameKey) : s.name);
  /* Row label: short and scannable. Details (server, tokens, model) live in the span detail */
  const WAIT_SHORT = { approved: "approvedShort", denied: "deniedShort", cancelled: "stCancelled" };
  const rowName = (s) => (s.kind === "wait" ? t(WAIT_SHORT[s.detail.decision] || "stPending") : spanName(s));
  const rowSub = (s) => (s.kind === "wait" || (s.depth >= 2 && s.kind !== "tool") ? s.sub : "");
  function createWaterfall(opts) {
    const el = document.createElement("div");
    el.className = "wf";
    el.innerHTML = `<div class="wf-axis" aria-hidden="true"><div class="wf-axis-label">${esc(t("timeAxis"))}</div><div class="wf-ticks"></div></div><div class="wf-body" role="listbox" aria-label="${esc(opts.label || t("traceTitle"))}"><div class="wf-grid"></div></div>`;
    const ticksEl = el.querySelector(".wf-ticks"), body = el.querySelector(".wf-body"), grid = el.querySelector(".wf-grid");
    const rows = new Map();
    let domain = 1;
    const api = {
      el, spans: opts.spans, selected: opts.selected || null, live: false,
      update() {
        const spans = api.spans;
        const total = Math.max(opts.min || 100, ...spans.map((s) => s.start + s.dur));
        const W = ticksEl.clientWidth || 240;
        const maxTicks = Math.max(2, Math.min(7, Math.floor(W / 64)));
        let step = niceStep(total / maxTicks);
        domain = Math.ceil(total / step - 1e-9) * step;
        for (const m of [1, 2, 2.5, 5, 10, 20, 25, 50]) {
          const base = Math.pow(10, Math.floor(Math.log10(total / maxTicks)));
          const st = m * base, n = Math.ceil(total / st - 1e-9);
          if (n <= maxTicks && n >= 2 && n * st < domain - 1e-9) { step = st; domain = n * st; }
        }
        const n = Math.round(domain / step);
        let th = "", gh = "";
        for (let i = 0; i <= n; i++) {
          const pct = ((i * step) / domain) * 100;
          th += `<span class="wf-tick ${i === 0 ? "first" : i === n ? "last" : ""}" style="left:${pct}%">${tickLabel(i * step, step)}</span>`;
          gh += `<i class="${i === 0 ? "zero" : ""}" style="left:${pct}%"></i>`;
        }
        if (ticksEl._h !== th) { ticksEl.innerHTML = th; ticksEl._h = th; grid.innerHTML = gh; }
        const seen = new Set();
        let focusable = null;
        spans.forEach((s) => {
          seen.add(s.id);
          let r = rows.get(s.id);
          if (!r) {
            r = document.createElement("div");
            r.setAttribute("role", "option");
            r.dataset.span = s.id;
            r.innerHTML = `<div class="wf-label"></div><div class="wf-track"><div class="wf-bar"></div><span class="wf-dur"></span></div>`;
            r.addEventListener("click", () => opts.onSelect && opts.onSelect(s.id));
            r.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); opts.onSelect && opts.onSelect(s.id); }
              if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                const sib = e.key === "ArrowDown" ? r.nextElementSibling : r.previousElementSibling;
                if (sib && sib.classList.contains("wf-row")) { r.tabIndex = -1; sib.tabIndex = 0; sib.focus(); }
              }
            });
            if (opts.onHover) { r.addEventListener("mouseenter", () => opts.onHover(s.id, true)); r.addEventListener("mouseleave", () => opts.onHover(s.id, false)); }
            if (api.live && api.painted && !REDUCED.matches) r.classList.add("enter");
            body.appendChild(r);
            rows.set(s.id, r);
          }
          const kind = s.kind === "wait" ? "wait" : s.kind;
          const cls = ["wf-row", "k-" + kind];
          if (s.status === "err" && !s.denied) cls.push("is-err");

    $("#cfgNote").textContent = s.transport === "http" ? t("cfgNoteHttp") : t("cfgNoteStdio");
  }
  function openCfg(id) { S.cfg.id = id; S.cfg.tab = S.cfg.tab || "claude"; renderCfg(); openDlg("dlgCfg"); }

  /* Command palette */
  let palItems = [], palIdx = 0;
  function palCommands() {
    const s = cur();
    const cmds = [
      { g: t("pgNav"), ic: "pulse", label: t("navDashboard"), run: () => go("dashboard") },
      { g: t("pgNav"), ic: "braces", label: t("navInspector"), run: () => go("inspector") },
      { g: t("pgNav"), ic: "chat", label: t("navChat"), run: () => go("chat") },
      { g: t("pgActions"), ic: "play", label: t("pcRun"), k: ["⌘", "↵"], run: () => { go("inspector"); setTimeout(run, 30); } },
      { g: t("pgActions"), ic: "plus", label: t("pcAdd"), run: () => openAdd() },
      { g: t("pgActions"), ic: "copy", label: t("pcCfg", { s: s.id }), run: () => openCfg(s.id) },
      { g: t("pgActions"), ic: "panel", label: t("pcPanel"), k: ["⌘", "J"], run: () => { go("inspector"); toggleDock(); } }
    ];
    allServers().forEach((x) => cmds.push({ g: t("pgServers"), ic: "plug", label: x.id, sub: t(stKey(x.status)), run: () => selectServer(x.id) }));
    if (s.transport === "http") toolsOf(s).forEach((x) => cmds.push({ g: t("pgTools", { s: s.id }), ic: "tool", label: x.name, sub: "tools/call", run: () => { go("inspector"); S.ltab = "tools"; S.sel = { kind: "tool", name: x.name }; renderInspector(); } }));
    cmds.push({ g: t("pgPrefs"), ic: "sun", label: t("pcLight"), run: () => setTheme("light") }, { g: t("pgPrefs"), ic: "moon", label: t("pcDark"), run: () => setTheme("dark") }, { g: t("pgPrefs"), ic: "monitor", label: t("pcSystem"), run: () => setTheme("system") }, { g: t("pgPrefs"), ic: "globe", label: t("pcEn"), run: () => setLang("en") }, { g: t("pgPrefs"), ic: "globe", label: t("pcKo"), run: () => setLang("ko") });
    return cmds;
  }
  function renderPal() {
    const q = $("#palInput").value.trim().toLowerCase();
    palItems = palCommands().filter((c) => !q || (c.label + " " + (c.sub || "") + " " + c.g).toLowerCase().includes(q));
    palIdx = clamp(palIdx, 0, Math.max(0, palItems.length - 1));
    let html = "", g = null;
    palItems.forEach((c, i) => {
      if (c.g !== g) { g = c.g; html += `<div class="pal-grp caps" role="presentation">${esc(g)}</div>`; }
      html += `<button class="pal-item" type="button" role="option" id="pal-${i}" data-action="pal-run" data-i="${i}" aria-selected="${i === palIdx}">${icon(c.ic)}<span>${esc(c.label)}</span>${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ""}${c.k ? `<span class="k">${c.k.map((x) => `<kbd>${x}</kbd>`).join("")}</span>` : ""}</button>`;
    });
    $("#palList").innerHTML = html || `<div class="empty">${t("palEmpty")}</div>`;
    $("#palInput").setAttribute("aria-activedescendant", palItems.length ? "pal-" + palIdx : "");
    const a = $("#pal-" + palIdx); if (a) a.scrollIntoView({ block: "nearest" });
  }
  function openPal() { $("#palInput").value = ""; palIdx = 0; renderPal(); openDlg("dlgPal"); }
  function runPal(i) { const c = palItems[i]; if (!c) return; closeDlg($("#dlgPal")); setTimeout(c.run, 20); }

  /* Toast and copy */
  let toastTimer = null;
  function toast(msg) {
    const el = $("#toast");
    el.innerHTML = `${icon("check", "ic-sm")}<span>${esc(msg)}</span>`;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }
  function copyText(text, selectEl, btn) {
    const ok = () => {
      toast(t("toastCopied"));
      if (btn) { const old = btn.innerHTML; btn.innerHTML = icon("check", "ic-sm") + (btn.querySelector("span") ? `<span>${t("copied")}</span>` : ""); setTimeout(() => { if (document.contains(btn)) btn.innerHTML = old; }, 1400); }
    };
    const fallback = () => {
      if (selectEl) { const r = document.createRange(); r.selectNodeContents(selectEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      toast(t("toastCopyFail"));
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------- Actions ---------- */
  function selectServer(id) {
    const s = srv(id);
    if (!s) return;
    if (S.running) cancel();
    S.server = id; S.filter = ""; S.fieldErr = {}; S.rawErr = null; S.logOpen = null;
    if (!(S.ltab === "tools" || CAPS[s.family][S.ltab])) S.ltab = "tools";
    S.sel = { kind: "tool", name: toolsOf(s)[0].name };
    S.ltab = "tools";
    if (isMobile()) S.mseg = s.transport === "stdio" ? "request" : "tools";
    go("inspector");
  }
  function toggleDock() { S.dockOpen = !S.dockOpen; if (S.view === "inspector") { $("#insp").classList.toggle("dock-closed", !S.dockOpen); renderDock(); requestAnimationFrame(updateSplitAria); } }
  function refreshAll() {
    SERVERS.filter((s) => s.transport === "http" && s.status === "online").forEach((s) => { s.checked = fmtT(simMs()); });
    S.checks.unshift({ at: fmtT(simMs()), lvl: "ok", srv: "starter-mcp-http", msg: "ping 10 ms" }, { at: fmtT(simMs()), lvl: "ok", srv: "nl2sql-mcp-http", msg: "ping 79 ms" });
    const off = SERVERS.find((s) => s.status === "offline");
    if (off) S.checks.unshift({ at: fmtT(simMs()), lvl: "err", srv: off.id, msg: "ECONNREFUSED 127.0.0.1:8002" });
    S.checks = S.checks.slice(0, 9);
    renderAll();
  }

  document.addEventListener("click", (e) => {
    if (e.target.closest("#skipLink")) { e.preventDefault(); const m = $("#main"); if (m) m.focus(); return; }
    const goEl = e.target.closest("[data-go]");
    if (goEl) { go(goEl.dataset.go); return; }
    const gb = e.target.closest("[data-go-btn]");
    if (gb) { go(gb.dataset.goBtn); return; }
    const lb = e.target.closest("[data-lang]");
    if (lb) { setLang(lb.dataset.lang); return; }
    const tb = e.target.closest("[data-theme-set]");
    if (tb) { setTheme(tb.dataset.themeSet); return; }
    if (e.target.closest("[data-close]")) { closeDlg(e.target.closest(".overlay")); return; }
    if (e.target.classList && e.target.classList.contains("overlay")) { closeDlg(e.target); return; }
    const a = e.target.closest("[data-action]");
    if (!a) return;
    const act = a.dataset.action, d = a.dataset;
    switch (act) {
      case "select-server": selectServer(d.id); break;
      case "gs-hide": S.gs.hidden = true; store.set("mcpc-final-gs", "hidden"); renderDash(); { const b = $(".gs-show"); if (b) b.focus(); } break;
      case "gs-show": S.gs.hidden = false; store.set("mcpc-final-gs", "shown"); renderDash(); { const h = $("#gsTitle"); if (h) { h.tabIndex = -1; h.focus(); } } break;
      case "gs-insp": S.server = "starter-mcp-http"; S.ltab = "tools"; S.sel = { kind: "tool", name: "echo" }; S.filter = ""; if (isMobile()) S.mseg = "request"; go("inspector"); break;
      case "inspect": selectServer(d.id); break;
      case "close-side": closeSide(); break;
      case "open-add": closeSide(); openAdd(); break;
      case "refresh-all": refreshAll(); break;
      case "retry": retry(d.id); break;
      case "open-cfg": openCfg(d.id); break;
      case "cfg-tab": S.cfg.tab = d.k; renderCfg(); { const b = $(`[data-action="cfg-tab"][data-k="${d.k}"]`); if (b) b.focus(); } break;
      case "copy-text": copyText(d.text, a.previousElementSibling, a); break;
      case "copy-resp": if (S.resp) copyText(JSON.stringify(S.resp.res || S.resp.req, null, 2), $("#paneRes .code"), a); break;
      case "copy-msg": { const tn = conv().turns[+d.t]; const txt = tn.steps.filter((x) => x.type === "text").map((x) => { const div = document.createElement("div"); div.innerHTML = L(x.html); return div.innerText; }).join("\n\n"); copyText(txt, null, a); break; }
      case "ltab": S.ltab = d.k; S.filter = ""; ensureSel(); renderTools(); renderReq(); break;
      case "select-item":
        if (S.running) break;
        S.sel = { kind: d.kind, name: d.name }; S.fieldErr = {}; S.rawErr = null;
        $$("#toolListBody .tool-item").forEach((b) => b.setAttribute("aria-current", String(b === a)));
        if (isMobile()) { S.mseg = "request"; refreshInspector(); } else renderReq();
        break;
      case "mode": {
        const k = key(S.server, S.sel.kind, S.sel.name);
        if (d.k === "json" && S.mode === "form") { S.raw[k] = JSON.stringify(getArgs(), null, 2); S.rawErr = null; S.mode = "json"; }
        else if (d.k === "form" && S.mode === "json") {
          const obj = tryParse(S.raw[k] != null ? S.raw[k] : "{}");
          if (obj === undefined || typeof obj !== "object" || Array.isArray(obj) || obj === null) { S.rawErr = t("jsonInvalid", { m: "fix it before switching to Form" }); renderReq(); break; }
          S.args[k] = obj; delete S.raw[k]; S.rawErr = null; S.mode = "form";
        }
        renderReq();
        break;
      }
      case "sql-ex": { const args = getArgs(); args.sql = SQL_EXAMPLES[d.k]; const ta = $("#f-sql"); if (ta) { ta.value = args.sql; ta.focus(); } break; }
      case "reset-args": delete S.args[key(S.server, S.sel.kind, S.sel.name)]; delete S.raw[key(S.server, S.sel.kind, S.sel.name)]; S.fieldErr = {}; S.rawErr = null; renderReq(); break;
      case "run": run(); break;
      case "cancel": cancel(); break;
      case "rtab": S.rtab = d.k; renderRes(); break;
      case "dtab": S.dockTab = d.k; if (!S.dockOpen) { S.dockOpen = true; $("#insp").classList.remove("dock-closed"); } renderDock(); break;
      case "toggle-dock": toggleDock(); break;
      case "clear-log": S.log = S.log.filter((x) => x.server !== S.server); S.logOpen = null; renderDock(); toast(t("toastCleared")); break;
      case "log-toggle": { const i = +d.i; S.logOpen = S.logOpen === i ? null : i; const st = $("#dockBody").scrollTop; renderDock(); $("#dockBody").scrollTop = st; break; }
      case "hist-load": loadHistory(+d.id, false); break;
      case "hist-rerun": loadHistory(+d.id, true); break;
      case "mseg": S.mseg = d.k; refreshInspector(); break;
      case "sb-server": if (S.view !== "inspector") go("inspector"); break;
      case "sb-log": if (S.view !== "inspector") go("inspector"); S.dockTab = "log"; S.dockOpen = true; renderInspector(); break;
      case "hdr-show": S.addHeaders[+d.i].show = !S.addHeaders[+d.i].show; renderHeaders(); break;
      case "hdr-del": S.addHeaders.splice(+d.i, 1); renderHeaders(); break;
      case "pal-run": runPal(+d.i); break;
      case "approval": S.chat.approval = d.v; $$('[data-action="approval"]').forEach((b) => { const on = b.dataset.v === d.v; b.setAttribute("aria-checked", String(on)); }); break;
      case "cseg": S.chat.mseg = d.k; applyChatSeg(); break;
      case "tcard": { const { st } = findStep(+d.t, +d.s); if (st) { st.open = !st.open; const card = a.closest(".tcard"); card.classList.toggle("open", st.open); a.setAttribute("aria-expanded", String(st.open)); if (d.span) selectSpan(d.span, "card"); } break; }
      case "approve": approve(+d.t, +d.s); break;
      case "deny": deny(+d.t, +d.s); break;
      case "send": send(); break;
      case "stop-chat": stopChat(); break;
      case "suggest": { const ta = $("#chatInput"); ta.value = d.text; send(); break; }
      case "open-conv": { S.chat.active = d.id; const cv = conv(); const lt = [...asstTurns(cv)].reverse().find((x) => x.spans); const pick = lt ? ([...lt.spans].reverse().find((x) => x.status === "wait") || [...lt.spans].reverse().find((x) => x.kind === "tool" && x.status === "err") || [...lt.spans].reverse().find((x) => x.kind === "tool")) : null; S.chat.sel = pick ? pick.id : null; closeSide(); renderSide(); renderShell(); renderChat(); break; }
      case "new-chat": {
        const id = "c" + (S.chat.convs.length + 1) + "-" + Math.round(simMs() % 100000);
        S.chat.convs.unshift({ id, title: L2("New chat", "새 대화"), time: fmtT(simMs()).slice(0, 5), model: modelLabel(), tok: { in: 0, out: 0 }, runs: 0, turns: [] });
        S.chat.active = id; S.chat.sel = null; closeSide(); renderSide(); renderShell(); renderChat();
        setTimeout(() => { const ta = $("#chatInput"); if (ta) ta.focus(); }, 30);
        break;
      }
      case "replay": { const w = [...WFS.values()].find((x) => String(x.turnIndex) === d.k); if (w) w.replay(); break; }
      case "span-jump": selectSpan(d.span, "jump"); break;
      case "span-link": if (d.span) selectSpan(d.span, "card"); break;
    }
  });
  const cardHover = (e, on) => {
    const card = e.target.closest && e.target.closest("#threadIn .tcard");
    if (!card || !card.dataset.span) return;
    if (e.relatedTarget && card.contains(e.relatedTarget)) return;
    linkSpan(card.dataset.span, on);
  };
  document.addEventListener("mouseover", (e) => cardHover(e, true));
  document.addEventListener("mouseout", (e) => cardHover(e, false));
  document.addEventListener("focusin", (e) => cardHover(e, true));
  document.addEventListener("focusout", (e) => cardHover(e, false));
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "modelSel") { S.chat.model = el.value; renderChat(); renderStatus(); }
    else if (el.id === "orModel") { S.chat.orModel = el.value.trim() || "anthropic/claude-sonnet-4-6"; renderStatus(); }
    else if (el.id === "maxIter") { S.chat.maxIter = clamp(parseInt(el.value, 10) || 8, 1, 20); el.value = S.chat.maxIter; renderTrace(); }
    else if (el.dataset.action === "expose") { S.chat.exposed[el.dataset.id] = el.checked; renderSide(); if (S.view === "chat") renderComposer(); }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "toolFilter") { S.filter = el.value; renderToolList(); }
    else if (el.id === "srvFilter") { const q = el.value.trim().toLowerCase(); $$("#side .srv-item").forEach((b) => { b.hidden = q && !b.dataset.id.includes(q); }); }
    else if (el.id === "rawArgs") {
      const k = key(S.server, S.sel.kind, S.sel.name);
      S.raw[k] = el.value;
      let msg = null;
      try { const o = JSON.parse(el.value); if (typeof o !== "object" || Array.isArray(o) || o === null) msg = t("jsonInvalid", { m: "arguments must be an object" }); } catch (err) { msg = t("jsonInvalid", { m: err.message }); }
      S.rawErr = msg;
      const er = $("#rawErr"); er.hidden = !msg; er.textContent = msg || "";
      if (msg) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid");
    }
    else if (el.dataset && el.dataset.key && el.closest("#reqForm")) readField(el);
    else if (el.dataset && el.dataset.h != null) { S.addHeaders[+el.dataset.h][el.dataset.f] = el.value; }
    else if (el.id === "chatInput") { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 160) + "px"; }
    else if (el.id === "palInput") { palIdx = 0; renderPal(); }
  });
  $("#addForm").addEventListener("submit", submitAdd);
  $("#addHdrBtn").addEventListener("click", () => { S.addHeaders.push({ k: "", v: "", show: true }); renderHeaders(); const i = S.addHeaders.length - 1; $("#hk" + i).focus(); });
  $("#cfgCopy").addEventListener("click", (e) => { const s = srv(S.cfg.id); copyText(JSON.stringify(cfgJSON(s, S.cfg.tab), null, 2), $("#cfgCode"), e.currentTarget); gsMark(3); });
  $("#cmdkBtn").addEventListener("click", openPal);
  $("#actPalette").addEventListener("click", openPal);
  $("#menuBtn").addEventListener("click", () => { if ($("#side").classList.contains("open")) closeSide(); else openSide(); });
  $("#scrim").addEventListener("click", closeSide);
  $("#palInput").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); palIdx = Math.min(palIdx + 1, palItems.length - 1); renderPal(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); palIdx = Math.max(palIdx - 1, 0); renderPal(); }
    else if (e.key === "Enter") { e.preventDefault(); runPal(palIdx); }
  });

  const isTyping = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    const k = e.key.toLowerCase();
    if (mod && k === "k") { e.preventDefault(); const o = openOverlay(); if (o && o.id === "dlgPal") closeDlg(o); else if (!o) openPal(); return; }
    const o = openOverlay();
    if (o) {
      if (e.key === "Escape") { e.preventDefault(); closeDlg(o); return; }
      if (e.key === "Tab") {
        const f = $$("button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex='-1'])", o).filter((x) => x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.key === "Escape") {
      if ($("#side").classList.contains("open")) { closeSide(); $("#menuBtn").focus(); return; }
      if (S.view === "inspector" && S.running) { e.preventDefault(); cancel(); return; }
      if (S.view === "chat" && isBusy(conv())) { e.preventDefault(); stopChat(); return; }
      return;
    }
    if (mod && e.key === "Enter") { e.preventDefault(); if (S.view === "inspector") run(); else if (S.view === "chat") send(); return; }
    if (mod && k === "j") { e.preventDefault(); if (S.view === "inspector") toggleDock(); return; }
    if (e.key === "/" && !isTyping(e.target) && S.view === "inspector") { const f = $("#toolFilter"); if (f && f.offsetParent !== null) { e.preventDefault(); f.focus(); } }
  });

  /* Splitters: pointer drag and arrow keys. aria-valuenow is the share (percent)
     of the container that the pane before the handle (or the docked panel) takes. */
  function updateSplitAria() {
    $$(".split[data-split]").forEach((sp) => {
      const k = sp.dataset.split;
      let v = null, txt = "";
      if (k === "c1" && $("#paneTools") && $("#panes")) { const a = $("#paneTools").getBoundingClientRect().width, b = $("#panes").getBoundingClientRect().width; if (b) { v = (a / b) * 100; txt = Math.round(a) + " px"; } }
      else if (k === "rq" && $("#paneReq") && $("#paneRes")) { const a = $("#paneReq").getBoundingClientRect().width, b = $("#paneRes").getBoundingClientRect().width; if (a + b) { v = (a / (a + b)) * 100; txt = Math.round(v) + "%"; } }
      else if (k === "dock" && $("#dock") && $("#insp")) { const a = $("#dock").getBoundingClientRect().height, b = $("#insp").getBoundingClientRect().height; if (b) { v = (a / b) * 100; txt = Math.round(a) + " px"; } }
      else if (k === "trace" && $(".trace-col") && $("#chatRoot")) { const a = $(".trace-col").getBoundingClientRect().width, b = $("#chatRoot").getBoundingClientRect().width; if (b) { v = (a / b) * 100; txt = Math.round(a) + " px"; } }
      if (v != null && isFinite(v)) { sp.setAttribute("aria-valuenow", String(Math.round(v))); sp.setAttribute("aria-valuetext", txt); }
    });
  }
  function applySplit(kind, clientX, clientY) {
    const root = document.documentElement;
    if (kind === "c1") { const p = $("#panes").getBoundingClientRect(); root.style.setProperty("--c1", clamp(clientX - p.left, 180, 440) + "px"); }
    else if (kind === "rq") { const left = $("#paneTools").getBoundingClientRect().right, right = $("#panes").getBoundingClientRect().right; const r = clamp((clientX - left) / (right - left), 0.28, 0.72); root.style.setProperty("--rq", r.toFixed(3) + "fr"); root.style.setProperty("--rs", (1 - r).toFixed(3) + "fr"); }
    else if (kind === "dock") { const b = $("#insp").getBoundingClientRect(); root.style.setProperty("--dock-h", clamp(b.bottom - clientY, 90, b.height * 0.72) + "px"); if (!S.dockOpen) { S.dockOpen = true; $("#insp").classList.remove("dock-closed"); renderDock(); } }
    else if (kind === "trace") { const b = $("#chatRoot").getBoundingClientRect(); root.style.setProperty("--trace-w", clamp(b.right - clientX, 260, 640) + "px"); }
    updateSplitAria();
  }
  document.addEventListener("pointerdown", (e) => {
    const sp = e.target.closest(".split");
    if (!sp) return;
    e.preventDefault();
    sp.classList.add("drag");
    try { sp.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const kind = sp.dataset.split;
    const move = (ev) => applySplit(kind, ev.clientX, ev.clientY);
    const up = () => { sp.classList.remove("drag"); sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); sp.removeEventListener("pointercancel", up); };
    sp.addEventListener("pointermove", move);
    sp.addEventListener("pointerup", up);
    sp.addEventListener("pointercancel", up);
  });
  document.addEventListener("keydown", (e) => {
    const sp = e.target.closest && e.target.closest(".split");
    if (!sp || !/^Arrow/.test(e.key)) return;
    e.preventDefault();
    const r = sp.getBoundingClientRect();
    const dx = e.key === "ArrowLeft" ? -16 : e.key === "ArrowRight" ? 16 : 0, dy = e.key === "ArrowUp" ? -16 : e.key === "ArrowDown" ? 16 : 0;
    applySplit(sp.dataset.split, r.left + dx, r.top + dy);
  });

  /* ---------- Boot ---------- */
  function renderAll() {
    applyStatic();
    syncTheme();
    renderShell();
    renderSide();
    if (S.view === "dashboard") renderDash();
    else if (S.view === "inspector") renderInspector();
    else renderChat();
  }
  seed();
  chatSeed();
  S.dockOpen = !isMobile();
  const fromHash = (location.hash || "").replace("#", "");
  S.view = VIEWS.includes(fromHash) ? fromHash : "inspector";
  window.addEventListener("hashchange", () => { const h = (location.hash || "").replace("#", ""); if (VIEWS.includes(h) && h !== S.view) go(h, { fromHash: true }); });
  window.matchMedia("(max-width: 900px)").addEventListener("change", () => { closeSide(); });
  window.addEventListener("resize", () => requestAnimationFrame(updateSplitAria));
  renderAll();
})();
</script>
