meta:
  target: guardrail_71
  guardrail_name: enforce_select_only
  error_code: WRITE_BLOCKED
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"

tests:
  - id: G71-001
    category: block
    call_type: direct
    title: "DELETE 문 차단"
    description: "DELETE 문은 SELECT 전용 가드레일에 의해 WRITE_BLOCKED 에러로 차단되어야 한다."
    input:
      tool: run_sql_query
      params:
        sql: "DELETE FROM customer WHERE customer_id = 1"
        max_rows: 10
    expected:
      status: error
      error_code: "WRITE_BLOCKED"
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"DELETE FROM customer WHERE customer_id = 1\", \"max_rows\": 10}"

  - id: G71-002
    category: block
    call_type: direct
    title: "INSERT 문 차단"
    description: "INSERT 문은 SELECT 전용 가드레일에 의해 WRITE_BLOCKED 에러로 차단되어야 한다."
    input:
      tool: run_sql_query
      params:
        sql: "INSERT INTO customer (customer_id, address_id) VALUES (9999, 1)"
        max_rows: 10
    expected:
      status: error
      error_code: "WRITE_BLOCKED"
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"INSERT INTO customer (customer_id, address_id) VALUES (9999, 1)\", \"max_rows\": 10}"

