        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, address_id, email, first_name FROM customer WHERE active = 1 LIMIT 5\", \"max_rows\": 10}"

  - id: G76-006
    category: block
    call_type: direct
    title: "PII 컬럼 집계 함수 조회 차단 (INPUT phase)"
    description: "COUNT(email): 집계 함수 내 PII 컬럼 참조도 INPUT phase에서 PII_COLUMN_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT COUNT(email) FROM customer WHERE active = 1"
        max_rows: 10
    expected:
      status: error
