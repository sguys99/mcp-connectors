meta:
  target: guardrail_76
  guardrail_name: enforce_pii_control
  error_code: PII_COLUMN_BLOCKED
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"

tests:
  - id: G76-001
    category: block
    call_type: direct
    title: "EMAIL 컬럼 직접 조회 차단 (INPUT phase)"
    description: "SELECT email FROM customer: email 은 PII 컬럼으로 INPUT phase에서 PII_COLUMN_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT email FROM customer WHERE active = 1 LIMIT 5"
        max_rows: 10
    expected:
      status: error
      error_code: "PII_COLUMN_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT email FROM customer WHERE active = 1 LIMIT 5\", \"max_rows\": 10}"

  - id: G76-002
    category: block
    call_type: direct
    title: "PHONE 컬럼(address) 직접 조회 차단 (INPUT phase)"
