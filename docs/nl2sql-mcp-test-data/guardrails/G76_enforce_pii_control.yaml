  - id: G76-007
    category: pass
    call_type: direct
    title: "PII 컬럼 없는 SELECT — 차단 없이 통과"
    description: "SELECT customer_id, address_id, active: PII 컬럼(email, phone, first_name, last_name) 없이 일반 컬럼만 조회. PII_COLUMN_BLOCKED 없이 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, address_id, active FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, address_id, active FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G76-008
    category: pass
    call_type: direct
    title: "비PII 컬럼 조회 — 차단 없이 통과"
    description: "store_id, activebool, create_date 는 PII 목록에 없는 컬럼. PII_COLUMN_BLOCKED 없이 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, store_id, activebool, create_date FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
