  - id: G76-005
    category: block
    call_type: direct
    title: "다중 PII 컬럼 동시 조회 차단 (INPUT phase)"
    description: "SELECT에 email, first_name 두 PII 컬럼 포함. 하나라도 PII 컬럼이 포함되면 INPUT phase에서 PII_COLUMN_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, address_id, email, first_name FROM customer WHERE active = 1 LIMIT 5"
        max_rows: 10
    expected:
      status: error
      error_code: "PII_COLUMN_BLOCKED"
      checks: []
    execution:
