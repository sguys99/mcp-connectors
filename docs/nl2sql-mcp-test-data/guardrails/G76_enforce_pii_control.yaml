          --params "{\"sql\": \"SELECT customer_id, store_id, activebool, create_date FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G76-009
    category: pass
    call_type: direct
    title: "JOIN 쿼리에서 PII 컬럼 미포함 — 차단 없이 통과"
    description: "customer 와 payment JOIN이지만 SELECT에 PII 컬럼 없음. PII_COLUMN_BLOCKED 없이 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT c.customer_id, p.amount FROM customer c JOIN payment p ON c.customer_id = p.customer_id WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT c.customer_id, p.amount FROM customer c JOIN payment p ON c.customer_id = p.customer_id WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G76-010
    category: pass
    call_type: direct
    title: "rental 테이블 비PII 컬럼만 조회, 차단 없이 통과"
    description: "rental 에서 rental_id, return_date, staff_id 조회(진행 중 대여). PII 컬럼 미포함으로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, return_date, staff_id FROM rental WHERE return_date IS NULL LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, return_date, staff_id FROM rental WHERE return_date IS NULL LIMIT 10\", \"max_rows\": 10}"

  - id: G76-011
    category: transform
    call_type: direct
    title: "PII 없는 결과 — masked_columns 빈 배열 확인"
    description: "SELECT customer_id, address_id, active: PII 컬럼 미포함. 결과의 masked_columns 필드가 빈 배열([])인지 확인. OUTPUT phase 마스킹 불필요"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, address_id, active FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
        - {field: "masked_columns", op: "eq", value: []}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, address_id, active FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G76-012
    category: transform
    call_type: direct
    title: "film 조회, masked_columns 빈 배열 확인"
    description: "SELECT film_id, rating, title FROM film: PII 컬럼 없음. masked_columns 빈 배열 확인. WHERE 없는 전체 조회는 G77 에서 막히므로 language_id 조건을 둡니다"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT film_id, rating, title FROM film WHERE language_id = 1 LIMIT 15"
        max_rows: 15
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
        - {field: "masked_columns", op: "eq", value: []}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT film_id, rating, title FROM film WHERE language_id = 1 LIMIT 15\", \"max_rows\": 15}"

  - id: G76-013
    category: transform
    call_type: direct
    title: "rental 비PII 컬럼 조회, masked_columns 빈 배열 확인"
    description: "SELECT rental_id, staff_id FROM rental: PII 컬럼 미포함. OUTPUT phase에서 마스킹 없이 masked_columns 빈 배열 반환 확인"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, staff_id FROM rental WHERE return_date IS NULL LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
        - {field: "masked_columns", op: "eq", value: []}
    execution:
