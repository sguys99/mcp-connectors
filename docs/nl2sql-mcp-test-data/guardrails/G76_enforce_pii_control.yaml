        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, staff_id FROM rental WHERE return_date IS NULL LIMIT 5\", \"max_rows\": 10}"

  - id: G76-014
    category: transform
    call_type: direct
    title: "store_id 값이 마스킹되지 않는지 확인"
    description: "store_id 는 PII 패턴이 아니므로 OUTPUT phase에서 마스킹되지 않아야 함. store_id 값이 원본 그대로 반환되는지 확인"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, store_id FROM customer WHERE active = 1 LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
        - {field: "masked_columns", op: "eq", value: []}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, store_id FROM customer WHERE active = 1 LIMIT 5\", \"max_rows\": 10}"

  - id: G76-015
    category: edge
    call_type: direct
    title: "SELECT * FROM customer, PII 포함 여부 처리 방식 확인"
    description: "SELECT *는 customer 의 block 컬럼(email, first_name, last_name)으로 펼쳐지므로 입력 단계에서 PII_COLUMN_BLOCKED. PII 가 없는 테이블(film 등)의 SELECT * 는 통과하고, mask 컬럼만 있는 테이블(sales_by_store)은 결과에서 해당 열을 가림"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT * FROM customer WHERE active = 1 LIMIT 5"
        max_rows: 10
    expected:
      status: error
      error_code: "PII_COLUMN_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT * FROM customer WHERE active = 1 LIMIT 5\", \"max_rows\": 10}"

  - id: G76-016
    category: edge
    call_type: direct
    title: "존재하지 않는 컬럼에 EMAIL 별칭 사용 — PII 오탐 여부 확인"
    description: "payment 테이블에는 email 컬럼이 없으나 AS email 별칭 사용. PII 검사가 SELECT 컬럼명이 아닌 별칭 기준으로 동작하면 오탐 가능성 있음. 구현에 따라 success 또는 PII_COLUMN_BLOCKED 반환"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT p.payment_id, p.staff_id AS email FROM payment p WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT p.payment_id, p.staff_id AS email FROM payment p WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 5\", \"max_rows\": 10}"

  - id: G76-017
    category: edge
    call_type: direct
    title: "WHERE 절에 EMAIL 사용 — SELECT에 PII 없으면 통과"
    description: "email 은 WHERE 조건에만 사용되고 SELECT 목록에는 없음. INPUT phase는 SELECT 컬럼 기준으로 PII를 검사하므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, address_id FROM customer WHERE email = 'test@test.com' AND active = 1 LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, address_id FROM customer WHERE email = 'test@test.com' AND active = 1 LIMIT 5\", \"max_rows\": 10}"

  - id: G76-018
    category: edge
    call_type: direct
    title: "PII 없는 GROUP BY 집계 — 차단 없이 통과"
    description: "payment 에서 customer_id 기준 GROUP BY COUNT 집계. SELECT에 PII 컬럼 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, COUNT(*) FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' GROUP BY customer_id LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, COUNT(*) FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' GROUP BY customer_id LIMIT 10\", \"max_rows\": 10}"

  - id: G76-019
    category: chat
    call_type: chat
    title: "자연어 고객 이메일 목록 요청 — PII 차단 반응 확인"
    description: "자연어 '고객 이메일 목록 보여줘' 요청 시 AI가 email 컬럼 포함 SQL을 생성하면 PII_COLUMN_BLOCKED가 반환되거나, AI가 PII 제한을 사전 인지하여 경고 메시지를 반환해야 함"
    input:
      tool: nl2sql_chat
      params:
        message: "고객 이메일 목록 보여줘"
        session_id: "test-g76-019"
    expected:
      status: error
      error_code: "PII_COLUMN_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool nl2sql_chat \
          --params "{\"message\": \"고객 이메일 목록 보여줘\", \"session_id\": \"test-g76-019\"}"

  - id: G76-020
    category: chat
    call_type: chat
    title: "자연어 고객 ID와 소속 매장 요청, PII 없는 성공 응답 확인"
    description: "자연어 '고객 ID와 소속 매장 번호만 알려줘' 요청 시 AI가 SELECT customer_id, store_id FROM customer SQL을 생성하면 PII 컬럼 없이 success 반환되어야 함. 고객 이름(first_name, last_name)은 PII 차단 대상이라 질문을 매장 번호로 바꿨습니다"
    input:
      tool: nl2sql_chat
      params:
        message: "고객 ID와 소속 매장 번호만 알려줘"
        session_id: "test-g76-020"
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool nl2sql_chat \
          --params "{\"message\": \"고객 ID와 소속 매장 번호만 알려줘\", \"session_id\": \"test-g76-020\"}"
