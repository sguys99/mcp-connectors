      expected: "AUDIT FILE CHECK PASSED"

  - id: G78-019
    category: edge
    call_type: direct
    title: "5개 서로 다른 도구 호출 후 각각 tool_name 기록 확인"
    description: "search_tables_schema, search_columns, get_table_schema, get_tables_schema, run_sql_query 각각 1회 호출 후 audit.db에 5개 각각의 tool_name이 기록되었는지 확인"
    input:
      # 러너가 본 호출 전에 차례로 부르는 4개 도구 (execution.command 와 같은 동작)
      setup_calls:
        - {tool: search_tables_schema, params: {pattern: "CUST%", limit: 5}}
        - {tool: search_columns, params: {column_pattern: "CUSTOMER_ID"}}
        - {tool: get_table_schema, params: {table_name: "rental"}}
        - {tool: get_tables_schema, params: {table_names: ["film"]}}
      tool: run_sql_query
      params:
        sql: "SELECT COUNT(*) FROM customer WHERE active = 1"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python -c "
        import subprocess
        tools = [
            ('search_tables_schema', '{\"pattern\": \"CUST%\", \"limit\": 5}'),
            ('search_columns', '{\"column_pattern\": \"CUSTOMER_ID\"}'),
            ('get_table_schema', '{\"table_name\": \"rental\"}'),
            ('get_tables_schema', '{\"table_names\": [\"film\"]}'),
            ('run_sql_query', '{\"sql\": \"SELECT COUNT(*) FROM customer WHERE active = 1\", \"max_rows\": 10}'),
        ]
        for tool, params in tools:
            r = subprocess.run([
                'python', 'scripts/mcp_cli.py', 'call',
                '--server', 'nl2sql-mcp',
                '--tool', tool, '--params', params
            ], capture_output=True, text=True)
            print(f'{tool}: returncode={r.returncode}')
        print('ALL 5 TOOL CALLS DONE')
        "
    audit_verification:
      command: |
        python -c "
        import os, sqlite3
        conn = sqlite3.connect(os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db'))
        cur = conn.cursor()
        expected_tools = {'search_tables_schema', 'search_columns', 'get_table_schema', 'get_tables_schema', 'run_sql_query'}
        cur.execute(\"SELECT DISTINCT tool_name FROM audit_log ORDER BY call_time DESC LIMIT 20\")
        found = {row[0] for row in cur.fetchall()}
        print(f'Found tools in audit: {found}')
        missing = expected_tools - found
        assert not missing, f'Missing tool_names in audit: {missing}'
        conn.close()
        print('AUDIT CHECK PASSED')
        "
      expected: "AUDIT CHECK PASSED"

  - id: G78-020
    category: edge
    call_type: direct
    title: "audit 레코드 tool_name 유효값 검증"
    description: "audit.db의 모든 tool_name이 허용된 도구 목록(search_tables_schema, search_columns, get_table_schema, get_tables_schema, run_sql_query) 중 하나인지 확인. 잘못된 tool_name 기록 방지"
    input:
      tool: get_table_schema
      params:
        table_name: "payment"
    expected:
      status: success
      checks:
        - {field: "columns | length", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_table_schema \
          --params "{\"table_name\": \"payment\"}"
    audit_verification:
      command: |
        python -c "
        import os, sqlite3
        conn = sqlite3.connect(os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db'))
        cur = conn.cursor()
        valid_tools = {'search_tables_schema', 'search_columns', 'get_table_schema', 'get_tables_schema', 'run_sql_query'}
        cur.execute(\"SELECT DISTINCT tool_name FROM audit_log\")
        all_tools = {row[0] for row in cur.fetchall()}
        print(f'All tool_names in audit: {all_tools}')
        invalid = all_tools - valid_tools
        assert not invalid, f'Invalid tool_names found in audit: {invalid}'
        conn.close()
        print('AUDIT CHECK PASSED')
        "
      expected: "AUDIT CHECK PASSED"
