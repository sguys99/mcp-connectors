meta:
  target: guardrail_78
  guardrail_name: audit_log
  error_code: ~
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"

tests:
  - id: G78-001
    category: pass
    call_type: direct
    title: "search_tables_schema 호출 후 audit.db 기록 확인"
    description: "T-01 도구 호출 후 audit.db에 tool_name=search_tables_schema 레코드가 생성되는지 검증. audit 로그는 모든 도구 호출을 기록해야 함"
    input:
      tool: search_tables_schema
      params:
        pattern: "CUST%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params "{\"pattern\": \"CUST%\", \"limit\": 20}"
    audit_verification:
      command: |
        python -c "
        import os, sqlite3
        conn = sqlite3.connect(os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db'))
        cur = conn.cursor()
        cur.execute(\"SELECT tool_name, result_status, call_time FROM audit_log ORDER BY call_time DESC LIMIT 1\")
        row = cur.fetchone()
        print(row)
        assert row is not None, 'No audit record found'
        assert row[0] == 'search_tables_schema', f'Expected search_tables_schema, got {row[0]}'
        assert row[1] == 'success', f'Expected success, got {row[1]}'
        conn.close()
        print('AUDIT CHECK PASSED')
        "
      expected: "AUDIT CHECK PASSED"

