    description: "WRITE_BLOCKED SQL(DELETE) 실행 후 audit.db에 result_status=blocked, error_type=WRITE_BLOCKED 레코드가 생성되어야 함. 가드레일 차단도 audit에 기록되어야 함 (result_status 어휘: success, blocked, error)"
    input:
      tool: run_sql_query
      params:
        sql: "DELETE FROM customer WHERE active = 0"
        max_rows: 10
    expected:
      status: error
      error_code: "WRITE_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"DELETE FROM customer WHERE active = 0\", \"max_rows\": 10}"
    audit_verification:
      command: |
        python -c "
        import os, sqlite3
        conn = sqlite3.connect(os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db'))
        cur = conn.cursor()
        cur.execute(\"SELECT tool_name, result_status, error_type FROM audit_log WHERE tool_name='run_sql_query' ORDER BY call_time DESC LIMIT 1\")
        row = cur.fetchone()
        print(row)
        assert row is not None, 'No audit record found'
        assert row[1] == 'blocked', f'Expected blocked, got {row[1]}'
        assert row[2] == 'WRITE_BLOCKED', f'Expected WRITE_BLOCKED, got {row[2]}'
        conn.close()
