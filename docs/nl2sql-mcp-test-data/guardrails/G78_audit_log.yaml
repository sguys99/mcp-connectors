  - id: G78-016
    category: edge
    call_type: direct
    title: "30일 이상 된 audit 레코드 정리 기능 확인"
    description: "nl2sql_mcp.guardrails.audit_log.purge_old_audit_records(db_path, retention_days) 가 30일 이상 된 레코드를 삭제하는지 확인. 서버도 시작할 때 AUDIT_RETENTION_DAYS 기준으로 한 번 호출함. 테스트용 오래된 레코드를 삽입하고 정리 후 삭제되었는지 검증"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT film_id FROM film WHERE language_id = 1 LIMIT 1"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT film_id FROM film WHERE language_id = 1 LIMIT 1\", \"max_rows\": 10}"
    audit_verification:
      command: |
        python -c "
        import asyncio, os, sqlite3, sys
        from datetime import datetime, timedelta, timezone
        sys.path.insert(0, 'src/mcp-servers')
        from nl2sql_mcp.guardrails.audit_log import purge_old_audit_records
        path = os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db')
        conn = sqlite3.connect(path)
        cur = conn.cursor()
        # Insert a 31-day-old test record (call_time 은 UTC ISO 8601)
        old_time = (datetime.now(timezone.utc) - timedelta(days=31)).isoformat()
        cur.execute(\"INSERT INTO audit_log (tool_name, result_status, call_time, latency_ms) VALUES ('test_old_tool', 'success', ?, 100)\", (old_time,))
        old_id = cur.lastrowid
        conn.commit()
        print(f'Inserted old record id={old_id}')
        deleted = asyncio.run(purge_old_audit_records(db_path=path, retention_days=30))
        print(f'Purged rows: {deleted}')
        cur.execute(\"SELECT COUNT(*) FROM audit_log WHERE id=?\", (old_id,))
        count = cur.fetchone()[0]
        print(f'Old record count after purge: {count}')
        assert count == 0, 'old record was not purged'
        conn.close()
        print('AUDIT PURGE CHECK DONE')
        "
      expected: "AUDIT PURGE CHECK DONE"

  - id: G78-017
    category: edge
    call_type: direct
    title: "QUERY_TIMEOUT 후 audit.db QUERY_TIMEOUT 기록 확인"
    description: "주의: 서버 환경변수 GUARDRAIL_TIMEOUT_SEC=1 설정이 필요함(Mock 백엔드면 NL2SQL_MOCK_DELAY_SEC=2 도 함께). timeout 발생 SQL 실행 후 audit.db에 error_type=QUERY_TIMEOUT이 기록되어야 함"
    requires:
      backend: mock
      reason: "타임아웃을 Mock 지연(NL2SQL_MOCK_DELAY_SEC)으로 재현함. 실 Pagila 는 1초 안에 끝나고 GUARDRAIL_TIMEOUT_SEC 는 1초 미만을 줄 수 없음"
    env:
      GUARDRAIL_TIMEOUT_SEC: "1"
      NL2SQL_MOCK_DELAY_SEC: "2"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT c.customer_id, COUNT(p.payment_id) AS cnt FROM customer c JOIN payment p ON c.customer_id = p.customer_id WHERE p.payment_date >= DATE '2025-01-01' AND p.payment_date < DATE '2026-01-01' GROUP BY c.customer_id ORDER BY cnt DESC"
        max_rows: 100
    expected:
      status: error
      error_code: "QUERY_TIMEOUT"
      checks: []
    execution:
      command: |
        GUARDRAIL_TIMEOUT_SEC=1 NL2SQL_MOCK_DELAY_SEC=2 python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT c.customer_id, COUNT(p.payment_id) AS cnt FROM customer c JOIN payment p ON c.customer_id = p.customer_id WHERE p.payment_date >= DATE '2025-01-01' AND p.payment_date < DATE '2026-01-01' GROUP BY c.customer_id ORDER BY cnt DESC\", \"max_rows\": 100}"
    audit_verification:
      command: |
        python -c "
        import os, sqlite3
        conn = sqlite3.connect(os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db'))
        cur = conn.cursor()
        cur.execute(\"SELECT tool_name, result_status, error_type FROM audit_log WHERE error_type='QUERY_TIMEOUT' ORDER BY call_time DESC LIMIT 1\")
        row = cur.fetchone()
        print(row)
        assert row is not None, 'No QUERY_TIMEOUT audit record found'
        assert row[1] == 'error', f'Expected error status, got {row[1]}'
        assert row[2] == 'QUERY_TIMEOUT', f'Expected QUERY_TIMEOUT, got {row[2]}'
        conn.close()
        print('AUDIT CHECK PASSED')
        "
      expected: "AUDIT CHECK PASSED"

  - id: G78-018
    category: edge
    call_type: direct
    title: "audit.db 파일 경로 확인"
    description: "AUDIT_LOG_PATH 환경변수 또는 기본값(저장소 루트 기준 var/nl2sql_mcp/audit.db)에 감사 DB 파일이 생성되었는지 확인. 서버는 상대 경로를 실행 위치가 아니라 저장소 루트 기준으로 풂"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT film_id FROM film WHERE language_id = 1 LIMIT 1"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT film_id FROM film WHERE language_id = 1 LIMIT 1\", \"max_rows\": 10}"
    audit_verification:
      command: |
        python -c "
        import os, sqlite3
        audit_path = os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db')
        print(f'Checking audit.db at: {audit_path}')
