  - id: G78-014
    category: edge
    call_type: direct
    title: "연속 10회 호출 후 audit.db 10개 신규 레코드 확인"
    description: "run_sql_query 10회 연속 호출 후 audit.db에 10개의 신규 레코드가 생성되었는지 확인. 모든 호출이 빠짐없이 기록되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT COUNT(*) FROM film WHERE language_id = 1"
        max_rows: 10
      repeat: 10  # 러너가 같은 호출을 10번 합니다 (execution.command 와 같은 동작)
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python -c "
        import subprocess, json
        for i in range(10):
            result = subprocess.run([
                'python', 'scripts/mcp_cli.py', 'call',
                '--server', 'nl2sql-mcp',
                '--tool', 'run_sql_query',
                '--params', '{\"sql\": \"SELECT COUNT(*) FROM film WHERE language_id = 1\", \"max_rows\": 10}'
            ], capture_output=True, text=True)
            print(f'Call {i+1}: {result.returncode}')
        print('ALL 10 CALLS DONE')
        "
    audit_verification:
      command: |
        python -c "
        import os, sqlite3
        conn = sqlite3.connect(os.environ.get('AUDIT_LOG_PATH', 'var/nl2sql_mcp/audit.db'))
        cur = conn.cursor()
        cur.execute(\"SELECT COUNT(*) FROM audit_log WHERE tool_name='run_sql_query' ORDER BY call_time DESC LIMIT 1\")
        total = cur.fetchone()[0]
        print(f'Total run_sql_query records: {total}')
        assert total >= 10, f'Expected at least 10 records, got {total}'
        conn.close()
        print('AUDIT CHECK PASSED')
        "
      expected: "AUDIT CHECK PASSED"

