meta:
  target: guardrail_79
  guardrail_name: detect_risky_sql
  error_code: RISKY_SQL_BLOCKED
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"

tests:
  - id: G79-001
    category: block
    call_type: direct
    title: "UNION SELECT 인젝션 차단"
    description: "WHERE active = 1 UNION SELECT 1: 전형적인 UNION 기반 SQL 인젝션 패턴. RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1 UNION SELECT 1"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1 UNION SELECT 1\", \"max_rows\": 10}"

  - id: G79-002
    category: allow
    call_type: direct
    title: "정상 UNION ALL (테이블끼리) 허용"
    description: "(P2-6) 실제 테이블을 읽는 SELECT 끼리의 UNION ALL 은 정상 쿼리이므로 통과해야 함. 상수만 고르는 가지(UNION SELECT 1)나 시스템 카탈로그를 읽는 가지는 G79-001, G79-006 에서 차단"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1 UNION ALL SELECT staff_id FROM rental WHERE return_date IS NULL"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1 UNION ALL SELECT staff_id FROM rental WHERE return_date IS NULL\", \"max_rows\": 10}"

  - id: G79-003
    category: block
    call_type: direct
    title: "pg_read_file 서버 파일 읽기 함수 차단"
    description: "pg_read_file 서버 파일 읽기 함수 호출. 서버 파일 시스템에 접근할 수 있어 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT pg_read_file('/etc/passwd')"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT pg_read_file('/etc/passwd')\", \"max_rows\": 10}"

  - id: G79-004
    category: block
    call_type: direct
    title: "query_to_xml 임의 쿼리 실행 함수 차단"
    description: "query_to_xml 호출. 인자로 받은 임의 SQL 을 실행할 수 있어 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT query_to_xml('SELECT 1', true, false, '')"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT query_to_xml('SELECT 1', true, false, '')\", \"max_rows\": 10}"

  - id: G79-005
    category: block
    call_type: direct
    title: "lo_export 서버 파일 쓰기 함수 차단"
    description: "lo_export 대형 객체를 서버 파일로 쓰는 함수. 데이터 유출 경로가 될 수 있어 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT lo_export(16385, '/tmp/out.bin')"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT lo_export(16385, '/tmp/out.bin')\", \"max_rows\": 10}"

  - id: G79-006
    category: block
    call_type: direct
    title: "주석 우회 UNION 인젝션 차단"
    description: "/**/ 인라인 주석으로 키워드를 분리한 UNION 인젝션 우회 패턴. 주석 제거 후 UNION SELECT 패턴을 탐지하여 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1/**/UNION/**/SELECT/**/1"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1/**/UNION/**/SELECT/**/1\", \"max_rows\": 10}"

  - id: G79-007
    category: block
    call_type: direct
    title: "줄 주석 우회 UNION 인젝션 차단"
    description: "--comment 줄 주석 후 줄 바꿈으로 UNION SELECT를 숨기는 인젝션 우회. 줄 주석 제거 후 탐지하여 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1--comment\nUNION SELECT 1"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1--comment\\nUNION SELECT 1\", \"max_rows\": 10}"

  - id: G79-008
    category: block
    call_type: direct
    title: "pg_ls_dir 서버 디렉터리 조회 함수 차단"
    description: "pg_ls_dir 서버 디렉터리 목록 함수. 서버 파일 구조 정찰 경로가 될 수 있어 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT pg_ls_dir('.')"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT pg_ls_dir('.')\", \"max_rows\": 10}"

  - id: G79-009
    category: pass
    call_type: direct
    title: "일반 SELECT — 차단 없이 통과"
    description: "customer 일반 SELECT. UNION 인젝션, 위험 시스템 함수 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, address_id, active FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, address_id, active FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G79-010
    category: pass
    call_type: direct
    title: "날짜 조건 payment 조회, 차단 없이 통과"
    description: "payment 날짜 조건 조회. 위험 패턴 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT amount, payment_date FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT amount, payment_date FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G79-011
    category: pass
    call_type: direct
    title: "GROUP BY COUNT 집계 — 차단 없이 통과"
    description: "payment COUNT GROUP BY 집계. 위험 패턴 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT COUNT(*) cnt FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' GROUP BY rental_id LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT COUNT(*) cnt FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' GROUP BY rental_id LIMIT 10\", \"max_rows\": 10}"

  - id: G79-012
    category: pass
    call_type: direct
    title: "payment 수치 컬럼 조회, 차단 없이 통과"
    description: "payment 날짜 조건 조회. amount, rental_id 는 PII 목록에 없으므로 G76 통과, 위험 패턴 없어 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT payment_id, amount, rental_id FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT payment_id, amount, rental_id FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G79-013
    category: pass
    call_type: direct
    title: "customer, payment JOIN, 차단 없이 통과"
    description: "customer 와 payment JOIN 쿼리. UNION 인젝션, 위험 시스템 함수 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT c.customer_id, p.amount FROM customer c JOIN payment p ON c.customer_id = p.customer_id WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT c.customer_id, p.amount FROM customer c JOIN payment p ON c.customer_id = p.customer_id WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G79-014
    category: edge
    call_type: direct
    title: "GUARDRAIL_RISKY_SQL_ENABLED=false 시 UNION 인젝션 통과 확인"
    description: "주의: 서버 환경변수 GUARDRAIL_RISKY_SQL_ENABLED=false 설정이 필요함. 가드레일 비활성화 시 UNION 인젝션 SQL이 RISKY_SQL_BLOCKED 없이 통과되어야 함. 정상 환경에서는 RISKY_SQL_BLOCKED 발생"
    env:
      GUARDRAIL_RISKY_SQL_ENABLED: "false"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1 UNION SELECT 1"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        GUARDRAIL_RISKY_SQL_ENABLED=false python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1 UNION SELECT 1\", \"max_rows\": 10}"

  - id: G79-015
    category: edge
    call_type: direct
    title: "GUARDRAIL_RISKY_SQL_ENABLED=false 시 pg_read_file 통과 확인"
    description: "주의: 서버 환경변수 GUARDRAIL_RISKY_SQL_ENABLED=false 설정이 필요함. 가드레일 비활성화 시 pg_read_file SQL이 RISKY_SQL_BLOCKED 없이 통과되어야 함. 정상 환경에서는 RISKY_SQL_BLOCKED 발생"
    env:
      GUARDRAIL_RISKY_SQL_ENABLED: "false"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT pg_read_file('/etc/passwd')"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    # 실 DB 에서는 가드레일을 꺼도 DB 가 거부합니다: 읽기 전용 계정 nl2sql_ro 에 pg_read_file 권한이 없음(권한 경계)
    expected_by_backend:
      real:
        status: error
        error_code: "ACCESS_DENIED"
        checks: []
    execution:
      command: |
        GUARDRAIL_RISKY_SQL_ENABLED=false python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT pg_read_file('/etc/passwd')\", \"max_rows\": 10}"

  - id: G79-016
    category: edge
    call_type: direct
    title: "문자열 값 내 UNION SELECT — 오탐 없이 통과"
    description: "WHERE title = 'UNION SELECT': UNION SELECT가 SQL 구조가 아닌 문자열 리터럴 값으로 사용됨. 문자열 파싱 로직이 올바르면 오탐 없이 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT film_id FROM film WHERE title = 'UNION SELECT' LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT film_id FROM film WHERE title = 'UNION SELECT' LIMIT 5\", \"max_rows\": 10}"

  - id: G79-017
    category: edge
    call_type: direct
    title: "주석 내 UNION SELECT — 주석 제거 후 판단"
    description: "/* this is a comment with UNION SELECT */ — UNION SELECT가 주석 안에 있음. 주석을 제거하면 위험 패턴이 없으므로 success 반환 예상. 단, 주석 제거 미구현 시 RISKY_SQL_BLOCKED 가능성 있음"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1 /* this is a comment with UNION SELECT */ LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1 /* this is a comment with UNION SELECT */ LIMIT 5\", \"max_rows\": 10}"

  - id: G79-018
    category: edge
    call_type: direct
    title: "pg_sleep 지연 함수 차단"
    description: "pg_sleep 지연 함수 호출. 세션을 붙잡아 자원 고갈 경로가 될 수 있어 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT pg_sleep(10)"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT pg_sleep(10)\", \"max_rows\": 10}"

  - id: G79-019
    category: edge
    call_type: direct
    title: "불완전한 UNION 구문 — 파싱 오류 또는 차단"
    description: "SELECT customer_id FROM customer WHERE active = 1 UNION: UNION 키워드로 끝나는 불완전한 SQL. WRITE_BLOCKED, RISKY_SQL_BLOCKED, 또는 DB 파싱 오류 중 하나로 처리되어야 함. (P2-6) 구문 오류는 INVALID_SQL 로 통일"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1 UNION"
        max_rows: 10
    expected:
      status: error
      error_code: "INVALID_SQL"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1 UNION\", \"max_rows\": 10}"

  - id: G79-020
    category: edge
    call_type: direct
    title: "pg_terminate_backend 세션 종료 함수 차단"
    description: "pg_terminate_backend 다른 세션 강제 종료 함수. 서비스 방해 경로가 될 수 있어 RISKY_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT pg_terminate_backend(12345)"
        max_rows: 10
    expected:
      status: error
      error_code: "RISKY_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT pg_terminate_backend(12345)\", \"max_rows\": 10}"
