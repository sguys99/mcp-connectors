  - id: G74-013
    category: block
    call_type: direct
    title: "timeout_sec=1 환경에서 복잡한 집계 쿼리 QUERY_TIMEOUT 발생"
    description: "주의: 이 케이스는 서버 환경변수 GUARDRAIL_TIMEOUT_SEC=1 설정이 필요함(Mock 백엔드면 NL2SQL_MOCK_DELAY_SEC=2 도 함께, 러너는 env 키로 넘김). timeout_sec=1 환경에서 복잡한 다중 조인 집계 쿼리 실행 시 1초 이내에 완료되지 못해 QUERY_TIMEOUT 발생을 확인. 정상 환경(30s)에서는 success 반환됨"
    requires:
      backend: mock
      reason: "타임아웃을 Mock 지연(NL2SQL_MOCK_DELAY_SEC)으로 재현함. 실 Pagila 는 1초 안에 끝나고 GUARDRAIL_TIMEOUT_SEC 는 1초 미만을 줄 수 없음"
    env:
      GUARDRAIL_TIMEOUT_SEC: "1"
      NL2SQL_MOCK_DELAY_SEC: "2"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT c.customer_id, COUNT(p.payment_id) AS pay_cnt, SUM(p.amount) AS total FROM customer c JOIN rental r ON c.customer_id = r.customer_id JOIN payment p ON r.rental_id = p.rental_id WHERE p.payment_date >= DATE '2025-01-01' AND p.payment_date < DATE '2026-01-01' GROUP BY c.customer_id ORDER BY total DESC LIMIT 100"
        max_rows: 100
    expected:
      status: error
      error_code: "QUERY_TIMEOUT"
      checks: []
    execution:
      command: |
        GUARDRAIL_TIMEOUT_SEC=1 NL2SQL_MOCK_DELAY_SEC=2 python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT c.customer_id, COUNT(p.payment_id) AS pay_cnt, SUM(p.amount) AS total FROM customer c JOIN rental r ON c.customer_id = r.customer_id JOIN payment p ON r.rental_id = p.rental_id WHERE p.payment_date >= DATE '2025-01-01' AND p.payment_date < DATE '2026-01-01' GROUP BY c.customer_id ORDER BY total DESC LIMIT 100\", \"max_rows\": 100}"

  - id: G74-014
    category: block
