          --params "{\"sql\": \"SELECT COUNT(*) FROM payment p JOIN rental r ON p.rental_id = r.rental_id JOIN customer c ON c.customer_id = r.customer_id WHERE p.payment_date >= DATE '2025-01-01' AND p.payment_date < DATE '2026-01-01'\", \"max_rows\": 10}"

