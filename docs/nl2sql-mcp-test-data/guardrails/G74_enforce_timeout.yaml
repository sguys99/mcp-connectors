    title: "timeout_sec=1 환경에서 3중 JOIN 쿼리 QUERY_TIMEOUT 발생"
    description: "주의: 이 케이스는 서버 환경변수 GUARDRAIL_TIMEOUT_SEC=1 설정이 필요함(Mock 백엔드면 NL2SQL_MOCK_DELAY_SEC=2 도 함께, 러너는 env 키로 넘김). payment, rental, customer 3중 조인 + 날짜 범위 1년치 스캔. Pagila 규모(payment 14,596행)에서는 1초 안에 끝날 수 있어 지연 주입이나 대용량 데이터가 있어야 QUERY_TIMEOUT 발생 예상"
    requires:
