meta:
  target: guardrail_74
  guardrail_name: enforce_timeout
  error_code: QUERY_TIMEOUT
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"

tests:
  - id: G74-001
    category: pass
    call_type: direct
    title: "소형 테이블 단순 SELECT, 30초 이내 완료"
    description: "film 테이블(1,000행)에서 film_id만 조회. 쿼리 실행 시간이 timeout(30s)보다 훨씬 짧아 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT film_id FROM film LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT film_id FROM film LIMIT 5\", \"max_rows\": 10}"

  - id: G74-002
    category: pass
    call_type: direct
    title: "payment COUNT 집계, 30초 이내 완료"
    description: "payment 테이블에서 날짜 조건부 COUNT 집계. 인덱스(payment_date) 활용 시 빠르게 완료되어 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT COUNT(*) FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months'"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
