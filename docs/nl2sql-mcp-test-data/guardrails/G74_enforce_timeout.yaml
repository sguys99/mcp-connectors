      reason: "타임아웃을 Mock 지연(NL2SQL_MOCK_DELAY_SEC)으로 재현함. 실 Pagila 는 1초 안에 끝나고 GUARDRAIL_TIMEOUT_SEC 는 1초 미만을 줄 수 없음"
    env:
      GUARDRAIL_TIMEOUT_SEC: "1"
      NL2SQL_MOCK_DELAY_SEC: "2"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT COUNT(*) FROM payment p JOIN rental r ON p.rental_id = r.rental_id JOIN customer c ON c.customer_id = r.customer_id WHERE p.payment_date >= DATE '2025-01-01' AND p.payment_date < DATE '2026-01-01'"
        max_rows: 10
    expected:
      status: error
      error_code: "QUERY_TIMEOUT"
      checks: []
    execution:
      command: |
        GUARDRAIL_TIMEOUT_SEC=1 NL2SQL_MOCK_DELAY_SEC=2 python scripts/mcp_cli.py call --server nl2sql-mcp \
