meta:
  target: guardrail_75
  guardrail_name: block_forbidden_constructs
  error_code: FORBIDDEN_SQL_BLOCKED
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"

tests:
  - id: G75-001
    category: block
    call_type: direct
    title: "원격 DB 접속(dblink) 쿼리 차단"
    description: "dblink() 로 원격 DB 를 조회하는 SQL. 7.5 금지 구문(원격 DB 접속)으로 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM dblink('dbname=remote', 'SELECT customer_id FROM customer') AS t(customer_id int) WHERE customer_id > 0 LIMIT 5"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM dblink('dbname=remote', 'SELECT customer_id FROM customer') AS t(customer_id int) WHERE customer_id > 0 LIMIT 5\", \"max_rows\": 10}"

  - id: G75-002
    category: block
    call_type: direct
    title: "pg_catalog 시스템 스키마 접근 차단"
    description: "pg_catalog 스키마 접근 SQL. 시스템 스키마 접두사는 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT relname FROM pg_catalog.pg_class WHERE relkind = 'r' LIMIT 5"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT relname FROM pg_catalog.pg_class WHERE relkind = 'r' LIMIT 5\", \"max_rows\": 10}"

  - id: G75-003
    category: block
    call_type: direct
    title: "pg_shadow 시스템 카탈로그 접근 차단"
    description: "비밀번호 해시가 담긴 pg_shadow 조회 SQL. 시스템 카탈로그 객체 참조로 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT usename FROM pg_shadow WHERE usesysid > 0"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT usename FROM pg_shadow WHERE usesysid > 0\", \"max_rows\": 10}"

  - id: G75-004
    category: block
    call_type: direct
    title: "멀티 스테이트먼트 SQL 차단 (세미콜론 구분)"
    description: "세미콜론으로 구분된 두 SQL 문장 동시 제출. 멀티 스테이트먼트는 SQL 인젝션 경로가 될 수 있어 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1; SELECT 1"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1; SELECT 1\", \"max_rows\": 10}"

  - id: G75-005
    category: block
    call_type: direct
    title: "SeqScan 힌트(pg_hint_plan) 사용 차단"
    description: "/*+ SeqScan(customer) */ 힌트(pg_hint_plan)로 전체 테이블 스캔 강제. 위험 힌트 목록에 포함된 SeqScan 힌트는 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT /*+ SeqScan(customer) */ customer_id FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT /*+ SeqScan(customer) */ customer_id FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G75-006
    category: block
    call_type: direct
    title: "Parallel 힌트(pg_hint_plan) 사용 차단"
    description: "/*+ Parallel(p 4 hard) */ 병렬 처리 힌트. DB 리소스를 과도하게 소비할 수 있는 Parallel 힌트는 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT /*+ Parallel(p 4 hard) */ payment_id FROM payment p WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT /*+ Parallel(p 4 hard) */ payment_id FROM payment p WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G75-007
    category: block
    call_type: direct
    title: "동적 SQL(EXECUTE) 차단"
    description: "EXECUTE 로 준비된 문장을 실행하는 동적 SQL 구문. G71(write-only 차단)이 먼저 차단할 수도 있으나, EXECUTE 자체도 FORBIDDEN_SQL_BLOCKED 대상임. 어느 가드레일이 먼저 차단하든 error 반환 확인"
    input:
      tool: run_sql_query
      params:
        sql: "EXECUTE customer_stmt(1)"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"EXECUTE customer_stmt(1)\", \"max_rows\": 10}"

  - id: G75-008
    category: block
    call_type: direct
    title: "pg_roles 시스템 뷰 접근 차단"
    description: "pg_roles 시스템 뷰 접근. 역할과 권한 정보가 노출되므로 pg_* 시스템 카탈로그는 FORBIDDEN_SQL_BLOCKED 대상. 어느 가드레일이 차단하든 error 반환 확인"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rolname FROM pg_roles WHERE rolsuper"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rolname FROM pg_roles WHERE rolsuper\", \"max_rows\": 10}"

  - id: G75-009
    category: pass
    call_type: direct
    title: "일반 SELECT 쿼리, 차단 없이 통과"
    description: "customer 테이블 일반 SELECT. 금지 구문 없으므로 FORBIDDEN_SQL_BLOCKED 없이 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id, active FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id, active FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G75-010
    category: pass
    call_type: direct
    title: "안전한 IndexScan 힌트, 차단 없이 통과"
    description: "/*+ IndexScan(p idx_fk_staff_id) */ 인덱스 힌트. SeqScan/Parallel/NoIndexScan 위험 힌트 목록에 없는 일반 IndexScan 힌트이므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT /*+ IndexScan(p idx_fk_staff_id) */ payment_id, amount FROM payment p WHERE staff_id = 1 AND payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT /*+ IndexScan(p idx_fk_staff_id) */ payment_id, amount FROM payment p WHERE staff_id = 1 AND payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G75-011
    category: pass
    call_type: direct
    title: "COUNT 집계 쿼리, 차단 없이 통과"
    description: "payment COUNT 집계. 금지 구문 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT COUNT(*) FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months'"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT COUNT(*) FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '6 months'\", \"max_rows\": 10}"

  - id: G75-012
    category: pass
    call_type: direct
    title: "INNER JOIN 쿼리, 차단 없이 통과"
    description: "payment와 staff JOIN(staff_id 조인, username 은 비PII). 금지 구문 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT p.amount, s.username FROM payment p JOIN staff s ON p.staff_id = s.staff_id WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT p.amount, s.username FROM payment p JOIN staff s ON p.staff_id = s.staff_id WHERE p.payment_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G75-013
    category: pass
    call_type: direct
    title: "DISTINCT 쿼리, 차단 없이 통과"
    description: "customer DISTINCT active 조회. 금지 구문 없으므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT DISTINCT active FROM customer WHERE active IS NOT NULL"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT DISTINCT active FROM customer WHERE active IS NOT NULL\", \"max_rows\": 10}"

  - id: G75-014
    category: edge
    call_type: direct
    title: "GUARDRAIL_FORBIDDEN_ENABLED=false 시 dblink SQL 통과 확인"
    description: "주의: 서버 환경변수 GUARDRAIL_FORBIDDEN_ENABLED=false 설정이 필요함. 가드레일 비활성화 시 dblink SQL이 차단 없이 통과되어야 함. 정상 환경에서는 FORBIDDEN_SQL_BLOCKED 발생"
    env:
      GUARDRAIL_FORBIDDEN_ENABLED: "false"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM dblink('dbname=remote', 'SELECT customer_id FROM customer') AS t(customer_id int) WHERE customer_id > 0 LIMIT 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    # 실 DB 에서는 가드레일을 꺼도 DB 가 거부합니다: 샘플 DB 에 dblink 확장이 없음
    expected_by_backend:
      real:
        status: error
        error_code: "INVALID_SQL"
        checks: []
    execution:
      command: |
        GUARDRAIL_FORBIDDEN_ENABLED=false python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM dblink('dbname=remote', 'SELECT customer_id FROM customer') AS t(customer_id int) WHERE customer_id > 0 LIMIT 5\", \"max_rows\": 10}"

  - id: G75-015
    category: edge
    call_type: direct
    title: "GUARDRAIL_FORBIDDEN_ENABLED=false 시 SeqScan 힌트 SQL 통과 확인"
    description: "주의: 서버 환경변수 GUARDRAIL_FORBIDDEN_ENABLED=false 설정이 필요함. 가드레일 비활성화 시 SeqScan 힌트 SQL이 차단 없이 통과되어야 함. 정상 환경에서는 FORBIDDEN_SQL_BLOCKED 발생"
    env:
      GUARDRAIL_FORBIDDEN_ENABLED: "false"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT /*+ SeqScan(customer) */ customer_id FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        GUARDRAIL_FORBIDDEN_ENABLED=false python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT /*+ SeqScan(customer) */ customer_id FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G75-016
    category: edge
    call_type: direct
    title: "주석 내 @ 기호, 금지 구문으로 오인하지 않음"
    description: "/* @not_a_dblink */ 주석 내 @ 기호. PostgreSQL 에는 @dblink 문법이 없고 주석 안의 문자이므로 success 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT /* @not_a_dblink */ customer_id FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT /* @not_a_dblink */ customer_id FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G75-017
    category: block
    call_type: direct
    title: "information_schema 스키마 접근 차단"
    description: "information_schema.tables 로 시스템 스키마 접근 시도. pg_catalog 와 마찬가지로 information_schema 접근은 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' LIMIT 5"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' LIMIT 5\", \"max_rows\": 10}"

  - id: G75-018
    category: block
    call_type: direct
    title: "NoIndexScan 힌트 사용, 위험 힌트 여부 확인"
    description: "/*+ NoIndexScan(customer) */ 힌트. NoIndexScan 은 위험 힌트 목록에 포함되어 FORBIDDEN_SQL_BLOCKED 반환"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT /*+ NoIndexScan(customer) */ customer_id FROM customer WHERE active = 1 LIMIT 10"
        max_rows: 10
    expected:
      status: error
      error_code: "FORBIDDEN_SQL_BLOCKED"
      checks: []
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT /*+ NoIndexScan(customer) */ customer_id FROM customer WHERE active = 1 LIMIT 10\", \"max_rows\": 10}"

  - id: G75-019
    category: edge
    call_type: direct
    title: "후행 세미콜론 단일 SQL, 처리 방식 확인"
    description: "SQL 끝에 세미콜론이 있는 단일 문장. 멀티 스테이트먼트가 아니므로 success 반환 예상이나, 구현에 따라 FORBIDDEN_SQL_BLOCKED 발생 가능. 실제 동작 확인 필요"
    input:
      tool: run_sql_query
      params:
        sql: "SELECT customer_id FROM customer WHERE active = 1 LIMIT 5;"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 1}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT customer_id FROM customer WHERE active = 1 LIMIT 5;\", \"max_rows\": 10}"

  - id: G75-020
    category: block
    call_type: direct
    title: "pg_proc 함수 정의 조회 차단"
    description: "pg_proc 시스템 카탈로그에서 함수 정의 조회. pg_* 시스템 카탈로그 참조이므로 FORBIDDEN_SQL_BLOCKED 반환되어야 함"
