    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT proname FROM pg_proc WHERE proname = 'film_in_stock'\", \"max_rows\": 10}"
