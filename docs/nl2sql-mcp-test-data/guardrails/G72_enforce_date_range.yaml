    title: "최근 3개월 범위 통과"
    description: "payment_date >= CURRENT_DATE - 3개월은 12개월 이내이므로 가드레일을 통과해야 한다."
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, amount FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '3 months' LIMIT 10"
        max_rows: 10
    expected:
