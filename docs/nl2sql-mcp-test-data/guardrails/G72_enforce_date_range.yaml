  - id: G72-009
    category: pass
    call_type: direct
    title: "정확히 12개월 범위 통과"
    description: "payment_date 범위가 2025-06-01 ~ 2026-06-01으로 정확히 12개월이므로 통과해야 한다."
    input:
      tool: run_sql_query
