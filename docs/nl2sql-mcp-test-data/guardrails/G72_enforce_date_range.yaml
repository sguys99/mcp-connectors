    description: "rental_date >= CURRENT_DATE - 6개월 필터가 있으며 12개월 이내이므로 가드레일을 통과해야 한다."
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, customer_id FROM rental WHERE rental_date >= CURRENT_DATE - INTERVAL '6 months' LIMIT 6"
        max_rows: 6
