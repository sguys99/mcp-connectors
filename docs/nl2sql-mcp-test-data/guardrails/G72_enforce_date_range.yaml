          --params "{\"sql\": \"SELECT rental_id, amount FROM payment WHERE payment_date >= DATE '2025-06-01' AND payment_date <= DATE '2026-06-01' LIMIT 10\", \"max_rows\": 10}"

  - id: G72-010
