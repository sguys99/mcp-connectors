  - id: G72-013
    category: transform
    call_type: direct
    title: "날짜 필터 없는 payment 조회 → 자동 주입"
    description: >
      SELECT 절에 payment_date 가 있지만 WHERE 에는 staff_id 조건만 있는 payment 쿼리는 가드레일이
      PAYMENT_DATE >= CURRENT_DATE - INTERVAL '3 months' 조건을 자동 주입한다(주입 컬럼명은 대문자).
      LIMIT 절이 없으므로 주입 뒤 7.3이 LIMIT 10 를 붙인다.
      transform이므로 status=success로 응답해야 하며 결과가 반환되어야 한다.
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, amount, payment_date FROM payment WHERE staff_id = 1"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, amount, payment_date FROM payment WHERE staff_id = 1\", \"max_rows\": 10}"

  - id: G72-014
    category: transform
    call_type: direct
    title: "날짜 필터 없는 rental 조회 → 자동 주입"
    description: >
      날짜 필터 없이 staff_id 만 지정된 rental 쿼리(SELECT 절에 rental_date)는 가드레일이
      RENTAL_DATE >= CURRENT_DATE - INTERVAL '3 months' 조건을 자동 주입한다(주입 컬럼명은 대문자).
      transform이므로 status=success로 응답해야 한다.
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, rental_date FROM rental WHERE staff_id = 1"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, rental_date FROM rental WHERE staff_id = 1\", \"max_rows\": 10}"

  - id: G72-015
    category: transform
    call_type: direct
    title: "금액 조건만 있는 payment 조회 → 자동 주입"
    description: >
      amount 조건만 있고 날짜 필터가 없는 payment 쿼리(SELECT 절에 payment_date)는 가드레일이
      PAYMENT_DATE >= CURRENT_DATE - INTERVAL '3 months' 조건을 자동 주입한다(주입 컬럼명은 대문자).
      transform이므로 status=success로 응답해야 한다.
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, amount, payment_date FROM payment WHERE amount >= 5"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, amount, payment_date FROM payment WHERE amount >= 5\", \"max_rows\": 10}"

  - id: G72-016
    category: transform
    call_type: direct
    title: "반납일 필터 없는 rental 조회 → 자동 주입"
    description: >
      inventory_id 조건만 있고 날짜 필터가 없는 rental 쿼리(SELECT 절에 return_date)는 가드레일이
      RETURN_DATE >= CURRENT_DATE - INTERVAL '3 months' 조건을 자동 주입한다(주입 컬럼명은 대문자).
      transform이므로 status=success로 응답해야 한다.
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, inventory_id, return_date FROM rental WHERE inventory_id > 0"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, inventory_id, return_date FROM rental WHERE inventory_id > 0\", \"max_rows\": 10}"

  - id: G72-017
    category: edge
    call_type: direct
    title: "날짜 컬럼을 언급하지 않은 rental 조회 (주입 여부 확인)"
    description: >
      rental 테이블은 rental_date, return_date 날짜 컬럼을 가지지만 쿼리 텍스트에 날짜 컬럼이 없다.
      날짜 컬럼 감지는 SQL 텍스트의 _AT, _DT, _DATE, _TIME 접미사 기준이라 주입되지 않을 수 있다.
      주입 시 status=success, 미주입 시에도 정책에 따라 success여야 한다.
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, customer_id FROM rental WHERE customer_id > 0 LIMIT 6"
        max_rows: 6
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, customer_id FROM rental WHERE customer_id > 0 LIMIT 6\", \"max_rows\": 6}"

  - id: G72-018
    category: edge
    call_type: direct
    title: "TO_DATE 함수 형식 날짜 필터 통과"
    description: "TO_DATE('2026-01-01', 'YYYY-MM-DD') ~ TO_DATE('2026-07-01', 'YYYY-MM-DD') 형식의 날짜 범위(6개월)는 12개월 이내이므로 가드레일을 통과해야 한다."
    input:
      tool: run_sql_query
      params:
        sql: "SELECT payment_id, amount FROM payment WHERE payment_date >= TO_DATE('2026-01-01', 'YYYY-MM-DD') AND payment_date < TO_DATE('2026-07-01', 'YYYY-MM-DD') LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT payment_id, amount FROM payment WHERE payment_date >= TO_DATE('2026-01-01', 'YYYY-MM-DD') AND payment_date < TO_DATE('2026-07-01', 'YYYY-MM-DD') LIMIT 10\", \"max_rows\": 10}"

  - id: G72-019
    category: edge
    call_type: direct
    title: "정확히 12개월 경계 통과 (CURRENT_DATE - 12개월)"
    description: >
      payment_date >= CURRENT_DATE - INTERVAL '12 months' 는 오늘까지 정확히 12개월이다.
      경계값(달력 기준 12개월)은 통과해야 한다. (P2-6) 하한만 있는 조건은 오늘까지의 기간으로 검사하므로
      고정 날짜 대신 상대식을 써서 실행 시점과 무관하게 만듦.
    input:
      tool: run_sql_query
      params:
        sql: "SELECT payment_id, amount FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '12 months' LIMIT 10"
        max_rows: 10
    expected:
      status: success
      checks:
        - {field: "row_count", op: "gte", value: 0}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT payment_id, amount FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '12 months' LIMIT 10\", \"max_rows\": 10}"

  - id: G72-020
    category: edge
    call_type: direct
    title: "12개월 + 1일 초과 차단 (CURRENT_DATE - 12개월 - 1일)"
    description: >
      실행일 기준으로 payment_date >= CURRENT_DATE - INTERVAL '12 months' - INTERVAL '1 day'은 12개월 + 1일이다.
      경계값 + 1일이므로 DATE_RANGE_EXCEEDED로 차단되어야 한다.
    input:
      tool: run_sql_query
      params:
        sql: "SELECT payment_id, amount FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '12 months' - INTERVAL '1 day' LIMIT 10"
        max_rows: 10
    expected:
      status: error
      error_code: "DATE_RANGE_EXCEEDED"
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT payment_id, amount FROM payment WHERE payment_date >= CURRENT_DATE - INTERVAL '12 months' - INTERVAL '1 day' LIMIT 10\", \"max_rows\": 10}"
