meta:
  target: guardrail_72
  guardrail_name: enforce_date_range
  error_code: DATE_RANGE_EXCEEDED
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"
  notes: |
    기준일: 실행일(CURRENT_DATE). 하한만 있는 조건은 오늘까지의 기간으로 검사하므로
      통과 케이스는 상대식(CURRENT_DATE - INTERVAL)이나 양쪽 경계를 모두 준 범위를 씁니다 (P2-7)
    - 조회 범위가 12개월 초과 시 DATE_RANGE_EXCEEDED 에러
    - 날짜 컬럼(_AT, _DT, _DATE, _TIME 접미사)이 있으나 날짜 필터가 없는 경우
      CURRENT_DATE - INTERVAL '3 months' 기준으로 날짜 조건 자동 주입 (transform)
    - transform 케이스는 status=success (에러 아님)

tests:
  - id: G72-001
    category: block
    call_type: direct
    title: "13개월 범위 조회 차단 (payment)"
    description: "payment_date 범위가 2023-05-01 ~ 2024-06-02로 13개월을 초과하므로 DATE_RANGE_EXCEEDED로 차단되어야 한다."
    input:
      tool: run_sql_query
      params:
        sql: "SELECT rental_id, amount FROM payment WHERE payment_date >= DATE '2023-05-01' AND payment_date < DATE '2024-06-02' LIMIT 10"
        max_rows: 10
    expected:
      status: error
      error_code: "DATE_RANGE_EXCEEDED"
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool run_sql_query \
          --params "{\"sql\": \"SELECT rental_id, amount FROM payment WHERE payment_date >= DATE '2023-05-01' AND payment_date < DATE '2024-06-02' LIMIT 10\", \"max_rows\": 10}"

