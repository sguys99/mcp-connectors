          --params '{"pattern": "%A%", "limit": 50}'

  - id: T01-015
    category: edge
    call_type: direct
    title: "% 패턴 + limit=50 → 전체 23개(테이블 15, 뷰 7, 구체화 뷰 1), truncated=false"
    input:
      tool: search_tables_schema
      params:
        pattern: "%"
        limit: 50
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 23}
        - {field: "tables", op: "length_eq", value: 23}
