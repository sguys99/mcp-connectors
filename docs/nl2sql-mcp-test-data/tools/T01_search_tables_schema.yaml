  - id: T01-006
    category: positive
    call_type: direct
    title: "%INVENT% 패턴으로 재고 테이블 검색"
    input:
      tool: search_tables_schema
      params:
        pattern: "%INVENT%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 1}
        - {field: "tables[*].table_name", op: "contains_any", value: ["inventory"]}
        - {field: "truncated", op: "eq", value: false}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
