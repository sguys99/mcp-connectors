      status: success
      human_verify: "응답에 customer 테이블(그리고 customer_list 뷰)이 포함되어 있는지 확인. LLM이 pattern='CUST%' 또는 '%CUSTOMER%'를 사용했는지 확인."
    execution:
      method: "Frontend /chat 페이지에서 nl2sql-mcp 서버 연결 후 프롬프트 입력"

  - id: T01-019
    category: chat
    call_type: chat
    title: "자연어로 영화 관련 테이블 검색 요청"
    chat_prompt: "영화 관련 테이블 알려줘"
    expected:
