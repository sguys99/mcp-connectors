  - id: T01-007
    category: negative
    call_type: direct
    title: "% 와일드카드 + limit=5 → TOO_MANY_TABLES (23 > 5)"
    input:
      tool: search_tables_schema
      params:
        pattern: "%"
        limit: 5
    expected:
      status: error
      error_code: "TOO_MANY_TABLES"
      checks:
        - {field: "error.code", op: "eq", value: "TOO_MANY_TABLES"}
        - {field: "error.message", op: "contains", value: "(23)"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "%", "limit": 5}'

  - id: T01-008
    category: negative
    call_type: direct
    title: "% 와일드카드 + limit=20 → TOO_MANY_TABLES (23 > 20)"
    input:
      tool: search_tables_schema
      params:
        pattern: "%"
        limit: 20
    expected:
      status: error
      error_code: "TOO_MANY_TABLES"
      checks:
        - {field: "error.code", op: "eq", value: "TOO_MANY_TABLES"}
        - {field: "error.message", op: "contains", value: "(23)"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "%", "limit": 20}'

  - id: T01-009
    category: negative
    call_type: direct
    title: "존재하지 않는 패턴 → 빈 결과 (에러 아님)"
    input:
      tool: search_tables_schema
      params:
        pattern: "NONEXISTENT_XYZ%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 0}
        - {field: "tables", op: "eq", value: []}
        - {field: "truncated", op: "eq", value: false}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "NONEXISTENT_XYZ%", "limit": 20}'

  - id: T01-010
    category: negative
    call_type: direct
    title: "limit=0 → INVALID_INPUT (허용 범위 1~50)"
    input:
      tool: search_tables_schema
      params:
        pattern: "%"
        limit: 0
    expected:
      status: error
      error_code: "INVALID_INPUT"
      checks:
        - {field: "error.code", op: "eq", value: "INVALID_INPUT"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "%", "limit": 0}'

  - id: T01-011
    category: negative
    call_type: direct
    title: "limit=51 → 최대값(50) 초과로 INVALID_INPUT"
    input:
      tool: search_tables_schema
      params:
        pattern: "%"
        limit: 51
    expected:
      status: error
      error_code: "INVALID_INPUT"
      checks:
        - {field: "error.code", op: "eq", value: "INVALID_INPUT"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "%", "limit": 51}'

  - id: T01-012
    category: edge
    call_type: direct
    title: "대문자 패턴 'CUSTOMER' → 대소문자 비구분으로 소문자 customer 반환"
    input:
      tool: search_tables_schema
      params:
        pattern: "CUSTOMER"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 1}
        - {field: "tables[*].table_name", op: "contains_any", value: ["customer"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "CUSTOMER", "limit": 20}'

  - id: T01-013
    category: edge
    call_type: direct
    title: "%CATEGORY% 패턴 → 소형 코드 마스터 category 와 연결 테이블, 집계 뷰, 구체화 뷰 검색"
    input:
