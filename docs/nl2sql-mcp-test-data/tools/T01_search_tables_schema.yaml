meta:
  target: search_tables_schema
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"
  cli_server: nl2sql-mcp

# 기준 스키마: Pagila (public), 테이블 15개 + 뷰 7개 + 구체화 뷰 1개 = 23개. 식별자는 소문자로 반환된다.
# 기대 match 수는 Mock 카탈로그(src/mcp-servers/nl2sql_mcp/db/mock_backend.py)를 직접 조회해 맞췄다.

tests:
  - id: T01-001
    category: positive
    call_type: direct
    title: "CUST% 패턴으로 customer 테이블과 customer_list 뷰 검색"
    input:
      tool: search_tables_schema
      params:
        pattern: "CUST%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 2}
        - {field: "tables[*].table_name", op: "contains_all", value: ["customer", "customer_list"]}
        - {field: "truncated", op: "eq", value: false}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "CUST%", "limit": 20}'

  - id: T01-002
    category: positive
    call_type: direct
    title: "FILM% 패턴으로 영화 관련 복수 테이블 검색"
    input:
      tool: search_tables_schema
      params:
        pattern: "FILM%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 4}
        - {field: "tables[*].table_name", op: "contains_all", value: ["film", "film_actor", "film_category", "film_list"]}
        - {field: "truncated", op: "eq", value: false}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "FILM%", "limit": 20}'

  - id: T01-003
    category: positive
    call_type: direct
    title: "PAY% 패턴으로 payment 테이블 검색"
    input:
      tool: search_tables_schema
      params:
        pattern: "PAY%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 1}
        - {field: "tables[*].table_name", op: "contains_any", value: ["payment"]}
        - {field: "truncated", op: "eq", value: false}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "PAY%", "limit": 20}'

