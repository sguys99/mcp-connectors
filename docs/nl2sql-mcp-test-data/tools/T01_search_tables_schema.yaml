    category: positive
    call_type: direct
    title: "SALES% 패턴으로 매출 집계 뷰 2개 검색"
    input:
      tool: search_tables_schema
      params:
        pattern: "SALES%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 2}
        - {field: "tables[*].table_name", op: "contains_all", value: ["sales_by_film_category", "sales_by_store"]}
        - {field: "truncated", op: "eq", value: false}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_tables_schema \
          --params '{"pattern": "SALES%", "limit": 20}'

  - id: T01-005
    category: positive
    call_type: direct
    title: "STAFF% 패턴으로 직원 관련 테이블과 뷰 검색"
    input:
      tool: search_tables_schema
      params:
        pattern: "STAFF%"
        limit: 20
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 2}
        - {field: "tables[*].table_name", op: "contains_all", value: ["staff", "staff_list"]}
        - {field: "truncated", op: "eq", value: false}
    execution:
