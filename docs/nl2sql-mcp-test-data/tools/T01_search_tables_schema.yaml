      status: success
      human_verify: "응답에 payment 테이블이 포함되어 있는지 확인. 테이블 설명(comment)이 함께 반환되는지 확인."
    execution:
      method: "Frontend /chat 페이지에서 nl2sql-mcp 서버 연결 후 프롬프트 입력"
