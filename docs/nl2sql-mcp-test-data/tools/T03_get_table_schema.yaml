meta:
  target: get_table_schema
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"
  cli_server: nl2sql-mcp

# 기준 스키마: Pagila (public). owner 는 "public", 식별자는 소문자로 반환된다.
# 컬럼 수, PK, FK 기대값은 Mock 카탈로그를 직접 조회해 맞췄다.

tests:
  - id: T03-001
    category: positive
    call_type: direct
    title: "customer 테이블 스키마 조회 → 10개 컬럼, PK=customer_id"
    input:
      tool: get_table_schema
      params:
        table_name: "customer"
    expected:
      status: success
      checks:
        - {field: "table_name", op: "eq", value: "customer"}
        - {field: "columns", op: "length_eq", value: 10}
        - {field: "primary_key", op: "contains_any", value: ["customer_id"]}
        - {field: "columns[*].name", op: "contains_all", value: ["customer_id", "store_id", "first_name", "email", "active"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_table_schema \
          --params '{"table_name": "customer"}'

  - id: T03-002
    category: positive
    call_type: direct
    title: "payment 테이블 스키마 → payment_date 컬럼, FK 3개 확인"
    input:
      tool: get_table_schema
      params:
        table_name: "payment"
    expected:
      status: success
      checks:
        - {field: "table_name", op: "eq", value: "payment"}
        - {field: "columns[*].name", op: "contains_any", value: ["payment_date"]}
        - {field: "foreign_keys", op: "length_eq", value: 3}
        - {field: "foreign_keys[*].ref_table", op: "contains_all", value: ["customer", "staff", "rental"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_table_schema \
          --params '{"table_name": "payment"}'

  - id: T03-003
    category: positive
