  - id: T03-007
    category: negative
    call_type: direct
    title: "존재하지 않는 테이블명 → TABLE_NOT_FOUND 에러"
    input:
      tool: get_table_schema
      params:
        table_name: "NONEXISTENT_TABLE_XYZ"
    expected:
      status: error
      error_code: "TABLE_NOT_FOUND"
      checks:
        - {field: "error.code", op: "eq", value: "TABLE_NOT_FOUND"}
        - {field: "error.message", op: "contains", value: "NONEXISTENT_TABLE_XYZ"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_table_schema \
          --params '{"table_name": "NONEXISTENT_TABLE_XYZ"}'

