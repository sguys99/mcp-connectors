    category: positive
    call_type: direct
    title: "%_DATE 패턴으로 날짜 컬럼 검색 ('_' 와일드카드라 last_update 14건도 함께 매칭)"
    input:
      tool: search_columns
      params:
        column_pattern: "%_DATE"
        limit: 50
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 18}
        - {field: "columns[*].column_name", op: "contains_all", value: ["rental_date", "return_date", "payment_date", "create_date", "last_update"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_columns \
          --params '{"column_pattern": "%_DATE", "limit": 50}'

