meta:
  target: search_columns
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"
  cli_server: nl2sql-mcp

# 기준 스키마: Pagila (public), 전체 컬럼 131개. column_pattern 은 SQL LIKE 전체 일치(대소문자 비구분)이며
# '_' 는 한 글자 와일드카드다. 기대 match 수는 Mock 카탈로그를 직접 조회해 맞췄다.

tests:
  - id: T02-001
    category: positive
    call_type: direct
    title: "AMOUNT 컬럼 검색 → payment.amount 1건"
    input:
      tool: search_columns
      params:
        column_pattern: "AMOUNT"
        limit: 50
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 1}
        - {field: "columns[*].column_name", op: "contains_any", value: ["amount"]}
        - {field: "columns[*].table_name", op: "contains_all", value: ["payment"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_columns \
          --params '{"column_pattern": "AMOUNT", "limit": 50}'

  - id: T02-002
    category: positive
    call_type: direct
    title: "CUSTOMER_ID 컬럼 검색 → PK, FK 포함 3개 테이블 발견"
    input:
      tool: search_columns
      params:
        column_pattern: "CUSTOMER_ID"
        limit: 50
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 3}
        - {field: "columns[*].table_name", op: "contains_all", value: ["customer", "payment", "rental"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_columns \
          --params '{"column_pattern": "CUSTOMER_ID", "limit": 50}'

