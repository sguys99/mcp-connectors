  - id: T02-007
    category: negative
    call_type: direct
    title: "% 와일드카드 + limit=5 → TOO_MANY_COLUMNS (131 > 5)"
    input:
      tool: search_columns
      params:
        column_pattern: "%"
        limit: 5
    expected:
      status: error
      error_code: "TOO_MANY_COLUMNS"
      checks:
        - {field: "error.code", op: "eq", value: "TOO_MANY_COLUMNS"}
        - {field: "error.message", op: "contains", value: "(131)"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_columns \
          --params '{"column_pattern": "%", "limit": 5}'

  - id: T02-008
    category: negative
    call_type: direct
    title: "존재하지 않는 컬럼 패턴 → match_count=0, 빈 결과"
    input:
      tool: search_columns
      params:
        column_pattern: "NONEXISTENT_COL_XYZ_123"
        limit: 50
    expected:
      status: success
      checks:
        - {field: "match_count", op: "eq", value: 0}
        - {field: "columns", op: "eq", value: []}
        - {field: "truncated", op: "eq", value: false}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool search_columns \
          --params '{"column_pattern": "NONEXISTENT_COL_XYZ_123", "limit": 50}'

