  - id: T04-018
    category: chat
    call_type: chat
    title: "자연어로 고객, 대여 테이블 스키마 동시 조회 요청"
    chat_prompt: "고객 테이블과 대여 테이블 스키마 같이 보여줘"
    expected:
      tool_called: get_tables_schema
      status: success
      checks:
        - {field: "tool_input.table_names", op: "contains", value: "customer"}
        - {field: "tool_input.table_names", op: "contains", value: "rental"}
        - {field: "result.tables | length", op: "eq", value: 2}
      human_verify: "응답에 customer, rental 두 테이블의 컬럼 목록이 모두 포함되어 있는지 확인"
    execution:
      method: "Frontend /chat 페이지에서 nl2sql-mcp 서버 연결 후 프롬프트 입력"

  - id: T04-019
    category: chat
    call_type: chat
    title: "JOIN 쿼리 작성을 위해 결제, 대여 테이블 스키마 동시 조회"
    chat_prompt: "조인 쿼리 작성 위해 결제와 대여 테이블 구조 한번에 알려줘"
    expected:
