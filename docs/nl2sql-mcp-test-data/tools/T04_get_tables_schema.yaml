meta:
  target: get_tables_schema
  db_mode: real
  total: 20
  dialect: postgres  # SQL 문법 기준. 서버 NL2SQL_DB_DIALECT 기본값과 같아야 합니다
  mcp_server: nl2sql-mcp
  base_url: "http://localhost:8004/mcp"
  cli_server: nl2sql-mcp

# 기준 스키마: Pagila (public), 테이블 15개 + 뷰 7개. 식별자는 소문자로 반환된다.
# 응답은 {"tables": [스키마...], "not_found": [이름...]} 형태이며, 각 스키마의 FK 는 foreign_keys[*].ref_table 에 있다.

tests:
  - id: T04-001
    category: positive
    call_type: direct
    title: "customer + rental 두 테이블 스키마 동시 조회"
    input:
      tool: get_tables_schema
      params:
        table_names: ["customer", "rental"]
    expected:
      status: success
      checks:
        - {field: "tables | length", op: "eq", value: 2}
        - {field: "not_found", op: "eq", value: []}
        - {field: "tables[*].table_name", op: "contains_all", value: ["customer", "rental"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_tables_schema \
          --params '{"table_names": ["customer", "rental"]}'

  - id: T04-002
    category: positive
    call_type: direct
    title: "payment + rental FK 관계(payment.rental_id → rental) 포함 스키마 조회"
    input:
      tool: get_tables_schema
      params:
        table_names: ["payment", "rental"]
    expected:
      status: success
      checks:
        - {field: "tables | length", op: "eq", value: 2}
        - {field: "not_found", op: "eq", value: []}
        - {field: "tables[*].table_name", op: "contains_all", value: ["payment", "rental"]}
        - {field: "tables[?table_name=='payment'].foreign_keys[*].ref_table", op: "contains", value: "rental"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_tables_schema \
          --params '{"table_names": ["payment", "rental"]}'

