    call_type: direct
    title: "유효 테이블과 존재하지 않는 테이블 혼합 → tables=1, not_found=['NONEXISTENT_XYZ']"
    input:
      tool: get_tables_schema
      params:
        table_names: ["customer", "NONEXISTENT_XYZ"]
    expected:
      status: success
      checks:
        - {field: "tables | length", op: "eq", value: 1}
        - {field: "tables[*].table_name", op: "contains_all", value: ["customer"]}
