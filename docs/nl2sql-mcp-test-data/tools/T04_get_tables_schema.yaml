  - id: T04-007
    category: negative
    call_type: direct
    title: "21개 테이블명 입력 시 INVALID_INPUT 에러 (최대 20개 초과)"
    input:
      tool: get_tables_schema
      params:
        table_names:
          - "actor"
          - "address"
          - "category"
          - "city"
          - "country"
          - "customer"
          - "film"
          - "film_actor"
          - "film_category"
          - "inventory"
          - "language"
          - "payment"
          - "rental"
          - "staff"
          - "store"
          - "actor_info"
          - "customer_list"
          - "film_list"
          - "nicer_but_slower_film_list"
          - "sales_by_film_category"
          - "sales_by_store"
    expected:
      status: error
      error_code: "INVALID_INPUT"
      checks:
        - {field: "error.code", op: "eq", value: "INVALID_INPUT"}
        - {field: "error.message", op: "contains", value: "20"}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_tables_schema \
          --params '{"table_names": ["actor","address","category","city","country","customer","film","film_actor","film_category","inventory","language","payment","rental","staff","store","actor_info","customer_list","film_list","nicer_but_slower_film_list","sales_by_film_category","sales_by_store"]}'

  - id: T04-008
    category: negative
    call_type: direct
    title: "빈 리스트 입력 시 INVALID_INPUT 에러"
    input:
      tool: get_tables_schema
      params:
        table_names: []
    expected:
      status: error
      error_code: "INVALID_INPUT"
      checks:
        - {field: "error.code", op: "eq", value: "INVALID_INPUT"}
        - {field: "error.message", op: "contains_any", value: ["empty", "required"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_tables_schema \
          --params '{"table_names": []}'

  - id: T04-009
    category: negative
    call_type: direct
    title: "존재하지 않는 테이블만 입력 → tables=[], not_found=['NONEXISTENT_XYZ']"
    input:
      tool: get_tables_schema
      params:
        table_names: ["NONEXISTENT_XYZ"]
    expected:
      status: success
      checks:
        - {field: "tables", op: "eq", value: []}
        - {field: "not_found", op: "eq", value: ["NONEXISTENT_XYZ"]}
    execution:
      command: |
        python scripts/mcp_cli.py call --server nl2sql-mcp \
          --tool get_tables_schema \
          --params '{"table_names": ["NONEXISTENT_XYZ"]}'

