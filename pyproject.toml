[project]
name = "mcp-connectors"
version = "0.1.0"
description = "Monorepo for building, testing and operating MCP servers that connect AI agents to enterprise internal systems (code repos, RDB, DW, catalogs, internal APIs)"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "mcp>=1.30.0,<2",
    "fastmcp>=3.4.10,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.14.2",
    "tenacity",
    "pyyaml>=6.0",
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "sqlglot>=25.0",
    "pydantic>=2.0",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# NL2SQL 을 실 Oracle DB 에 붙일 때만 필요합니다: `uv sync --extra oracle`
oracle = ["oracledb>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
# pythonpath = [".", "src/mcp-servers"] 로 인해 아래 패키지가 top-level 로 import 됩니다
known-first-party = ["_common", "starter_mcp", "mock_repo_mcp", "nl2sql_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src/mcp-servers"]
# importlib 모드: 테스트 디렉토리의 빈 __init__.py 가 src/ 의 동명 패키지와
# 충돌하지 않도록 각 테스트 모듈을 고유 namespace 로 로드한다.
# 실 DB 통합 테스트(-m integration)는 기본 실행에서 뺍니다. `make test-integration` 으로 따로 돌려요.
addopts = "--import-mode=importlib -m 'not integration'"
asyncio_mode = "auto"
markers = [
  "integration: 실 PostgreSQL 샘플 DB(docker compose postgres)가 필요한 통합 테스트",
]

[tool.coverage.run]
source = ["src/mcp-servers", "scripts"]
branch = true
omit = ["*/__pycache__/*", "*/fixtures/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# 개발 의존성은 이 그룹 하나로 관리합니다 (`uv sync` 가 기본 포함, `make init-dev` 도 동일).
[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "pre-commit>=3.3.3",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.12",
    "pytest-cov>=6.0",
]
