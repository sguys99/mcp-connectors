# CI: 로컬 Makefile 타깃과 같은 검사를 GitHub Actions 에서 돌립니다 (Phase 7, P7-4).
# 잡은 모두 병렬이고, 각 잡은 로컬에서 같은 이름의 make 타깃으로 재현할 수 있어요.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PR 은 새 푸시가 오면 이전 실행을 취소하고, main 푸시는 끝까지 돌립니다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Python 버전은 uv 가 .python-version 을 읽어 정합니다
  UV_PYTHON_PREFERENCE: managed
  NODE_VERSION: "20"
  FORCE_COLOR: "1"
  # setup-uv 는 v8 부터 major 태그(v10)를 내지 않아 전체 버전으로 고정합니다

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: make lint-py

  python-tests:
    name: Python tests and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      # make test 는 tests/http_transport (make test-http) 와 tests/scripts (make test-cli) 를 포함합니다
      - name: pytest (integration excluded)
        run: make test
      - name: starter-mcp scenarios (stdio)
        run: make test-scenarios-starter
      - name: NL2SQL scenarios (Mock backend)
        run: make test-scenarios

  integration:
    name: Integration (NL2SQL sample DB)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      # Quick Start 와 같이 루트 .env 를 만듭니다. 시나리오 러너가 띄우는 서버가 여기서 샘플 DB 접속 정보를 읽어요
      - run: cp .env.example .env
      - name: Start sample DB (PostgreSQL 17 + Pagila)
        run: make sample-db-up
      # conftest 는 DB 에 닿지 않으면 skip 하므로, 조용히 녹색이 되지 않게 먼저 접속을 확인합니다
      - name: Check read-only connection
        run: |
          uv run python -c "import psycopg; psycopg.connect('host=127.0.0.1 port=5432 dbname=pagila user=nl2sql_ro password=nl2sql_ro_local_sample', connect_timeout=5).execute('SELECT 1 FROM public.film LIMIT 1')"
      - name: pytest -m integration
        run: uv run pytest -m integration tests/nl2sql_mcp/integration -v
      - name: NL2SQL scenarios (real backend)
        run: uv run python scripts/run_mcp_tests.py --backend real
      - name: Sample DB logs
        if: failure()
        run: docker compose --profile sample-db logs postgres
      - name: Stop sample DB
        if: always()
        run: docker compose --profile sample-db down -v

  frontend:
    name: Frontend lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: typecheck
        run: npx tsc --noEmit
      - name: vitest
        run: npm run test
      - name: next build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      # global-setup 이 make run-mock-repo-mcp, run-starter-mcp-http 로 서버를 띄웁니다
      - run: uv sync --locked --all-extras --dev
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # playwright.config.ts 가 dev 서버를 CHAT_MOCK_LLM=1, MCP_ALLOW_RUNTIME_PROXY=true 로 띄웁니다
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # .pre-commit-config.yaml 의 gitleaks rev 와 같은 버전입니다
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "${archive}" checksums.txt
          gitleaks version
      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1

  docker:
    name: Docker compose build and health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health checks
        run: |
          set -euo pipefail
          # 레지스트리 API 200 이면 Frontend 기동과 configs/ 읽기가 정상입니다 (frontend/Dockerfile HEALTHCHECK 과 같은 기준)
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/registry > /dev/null
          curl -fsS -o /dev/null http://localhost:3000/
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.1"}}}'
          check() {
            curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -X POST "$1" \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d "$init" | grep -q '"serverInfo"'
            echo "ok: $1"
          }
          # 호스트에서 각 MCP 서버로 직접
          check http://localhost:8001/mcp
          check http://localhost:8002/mcp
          check http://localhost:8004/mcp
          # Frontend 프록시가 컨테이너 안에서 internalUrl 로 서버에 닿는지
          check http://localhost:3000/api/mcp/starter-mcp-http
          check http://localhost:3000/api/mcp/mock-repo-mcp
          check http://localhost:3000/api/mcp/nl2sql-mcp-http
      - name: Compose status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: docker compose down -v
