name: Feature request
description: Suggest a new feature, server, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describing the problem first helps us find the best solution, which may differ from the one you have in mind.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New MCP server or example
        - Existing MCP server
        - _common modules
        - CLI or scenario runner
        - Frontend (Dashboard, Inspector, Chat, Settings)
        - Skills (mcp-spec-writer, mcp-server-builder)
        - Docker or developer tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Include CLI usage, UI sketches, or example tool signatures if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, or MCP spec references.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
