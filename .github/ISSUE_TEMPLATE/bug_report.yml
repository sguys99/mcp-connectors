name: Bug report
description: Something does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include real credentials, hostnames, or personal data.
        For security problems, follow [SECURITY.md](https://github.com/sguys99/mcp-connectors/blob/main/SECURITY.md) instead of opening an issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - starter_mcp
        - mock_repo_mcp
        - nl2sql_mcp
        - _common
        - CLI (scripts/mcp_cli.py) or scenario runner
        - Frontend Dashboard
        - Frontend Inspector
        - Frontend Chat
        - Frontend Settings or runtime servers
        - Docker Compose or Makefile
        - Skills (mcp-spec-writer, mcp-server-builder)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, CLI calls, or UI steps that trigger the bug.
      placeholder: |
        1. make run-mock-repo-mcp
        2. uv run python scripts/mcp_cli.py call --server mock-repo-mcp --tool ... --params '{...}'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant output. It is rendered as code, so no backticks are needed. Remove secrets first.
      render: shell
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - Streamable HTTP
        - Not applicable
  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running it?
      options:
        - Local (make targets, npm run dev)
        - Docker Compose
        - Other
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or a release version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python and Node versions, browser (for UI bugs), LLM provider and model (for Chat bugs), and relevant environment variables (names only, never values).
      placeholder: |
        OS: macOS 15
        Python: 3.12.12
        Node: 20.x
        Browser: Chrome 130
        Env set: MCP_API_KEY, MCP_ALLOW_RUNTIME_PROXY=true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
